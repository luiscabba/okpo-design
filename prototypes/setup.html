<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkPo Brand Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../tokens.css">
<style>
/* Brand setup: the console's new-brand flow (Sources, Read, Check facts, Rules, Test and publish), run full screen,
   one question per screen. The Brand context panel on the right fills as things are checked.
   Built from tokens.css and the console's own components and motion. Nothing here is new to the system. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}

/* backdrop: three crisp tone tiles, never moves */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute;display:block}

/* shell */
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:12px;z-index:30;margin:12px 16px 0;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:14px}
.brandsw{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:transparent;text-align:left;min-width:170px}
.gdot{width:28px;height:28px;border-radius:8px;background:#0d6efd;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.gdot.empty{background:transparent;border:1.5px dashed var(--mute);color:var(--mute)}
.stepper{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0}
.step{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:500;border:0;background:transparent;padding:4px;white-space:nowrap}
.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:600 12px var(--mono);transition:background .25s,color .25s}
.step.on{color:var(--ink)}.step.on b{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.step.done b{background:var(--green);border-color:var(--green);color:#121212}
.step:disabled{cursor:default}
.sline{flex:0 1 40px;min-width:12px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}.sline i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s var(--ease)}
.stepmini{display:none;font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;max-width:1200px;width:100%;margin:0 auto;padding:36px 24px 120px;align-items:start}
.main{width:100%;max-width:640px;justify-self:center;display:flex;flex-direction:column;gap:16px;min-width:0}
.main.wide{max-width:none}
.hd{display:flex;flex-direction:column;gap:6px}
.hd .label{display:inline-flex;align-items:center;gap:8px}
.hd h1{margin:0;font:800 32px/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}

/* OkPo's guide line: first person, labelled, no avatar. Rises once, in one piece. */
.say{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--body);font-size:15px;line-height:1.5;max-width:60ch}
.say p{margin:0}

/* the console's components */
.card{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.txt{border:1px solid var(--line);border-radius:var(--r-field);padding:0 12px;height:42px;background:var(--glass-strong);width:100%;outline:none}
.txt:focus{border-color:var(--ink)}
textarea.txt{height:auto;padding:10px 12px;line-height:1.45;resize:vertical}
select.txt{appearance:auto}
.drop-z{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center;color:var(--body);background:transparent;width:100%;transition:background .2s,border-color .2s}
.drop-z:hover{background:var(--soft);border-color:var(--mute)}
.src{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);color:var(--mute)}
.kc{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kc p{margin:0}
.kc.flash{animation:flashk .7s var(--ease)}
@keyframes flashk{30%{box-shadow:0 0 0 3px var(--l-green),var(--glass-shadow);transform:scale(1.02)}}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--soft);min-width:0;min-height:120px}
.col .kc{background:var(--glass-strong);padding:11px 12px;gap:6px;font-size:13px}
.mini{padding:10px 12px;border-radius:12px;display:flex;align-items:flex-start;gap:8px;font-size:13px;min-width:0}
.scan{width:44px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--soft) 0%,var(--ink) 50%,var(--soft) 100%);background-size:220% 100%;animation:scan 1.1s linear infinite;flex:none}
@keyframes scan{from{background-position:120% 0}to{background-position:-120% 0}}
.dots{display:inline-flex;gap:4px;padding:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.opts{display:grid;gap:8px}
.opts button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;transition:border-color .2s,box-shadow .2s}
.opts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--glass-strong)}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mute);display:grid;place-items:center;background:transparent;padding:0;flex:none;transition:background .15s,border-color .15s;color:var(--ground)}
.cbx svg{transform:scale(0);transition:transform .2s var(--pop)}
[aria-checked="true"]>.cbx{background:var(--ink);border-color:var(--ink)}[aria-checked="true"]>.cbx svg{transform:scale(1)}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-row);border:1px solid var(--line);background:transparent;text-align:left;width:100%;transition:border-color .2s,background .2s}
.rrow[aria-checked="true"]{border-color:var(--ink);background:var(--glass-strong)}
.composer{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-radius:14px}
.composer input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:36px}
.chat{display:flex;flex-direction:column;gap:12px;min-height:200px;max-height:420px;overflow:auto}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--soft)}
.bub.ai{display:flex;gap:10px;padding:0;max-width:100%}
.kv2{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px 14px;font-size:14px}
.kv2>span:nth-child(odd){font:600 10.5px/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.why{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12.5px}

/* Brand context panel */
.ctx{position:sticky;top:88px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 104px);overflow:auto}
.ctx h2{margin:0;font:800 22px/1.1 var(--display);letter-spacing:-.03em}
.sec{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.prow span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.lit .rid{animation:lit .7s var(--ease)}
@keyframes lit{30%{box-shadow:0 0 0 2px var(--l-purple);transform:scale(1.08)}}
.vline{font:800 15px/1.25 var(--display);letter-spacing:-.02em}
.ctxbar{display:none}

/* sheet (phone) */
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:82vh;overflow:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 6px}
.sheet .ctx{position:static;max-height:none;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:12px 16px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.proto{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--btn);color:var(--on-btn);font:600 11.5px var(--mono)}
.proto button{border:0;background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font:inherit}
.proto button:hover{background:rgba(127,127,127,.25)}

@media (max-width:1060px){
  .stepper .step span{display:none}
}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr);padding:16px 16px 120px;gap:14px}
  .body>.ctx{display:none}
  .ctxbar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;border:1px solid var(--glass-edge);font-size:13.5px}
  .stepper{display:none}.stepmini{display:block;flex:1;text-align:center}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .hd h1{font-size:26px}
  .top{margin:10px 10px 0;gap:10px;padding:8px 10px}
  .brandsw{min-width:0}.brandsw .bsw-t{display:none}
  .kv2{grid-template-columns:minmax(0,1fr);gap:2px 0}.kv2>span:nth-child(even){margin-bottom:10px}
  .proto{left:auto;right:12px}
}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="shell" id="app"></div>
<div id="layer"></div>
<div class="proto" role="toolbar" aria-label="Prototype controls"><button type="button" id="pRestart">Restart</button><button type="button" id="pSkip">Skip to test</button><button type="button" id="pTheme">Dark</button></div>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,40):ms));
const EASE='cubic-bezier(.2,.8,.2,1)',POP='cubic-bezier(.34,1.56,.64,1)',POPS='cubic-bezier(.34,1.45,.64,1)',EXIT='cubic-bezier(.6,0,.3,1)';

/* tiles and line icons, exactly as the console draws them */
const P={frame:'<path d="M0 0H100V100H0Z M27 27V73H73V27Z" fill-rule="evenodd" fill="C"/>',quarter:'<path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="C"/>',diamond:'<path d="M50 0L100 50L50 100L0 50Z M50 28L72 50L50 72L28 50Z" fill-rule="evenodd" fill="C"/>',half:'<path d="M0 100 A50 50 0 0 1 100 100 Z" fill="C"/><rect width="100" height="22" fill="C"/>',pin:'<path d="M0 0 L50 0 L50 50 Z M100 0 L100 50 L50 50 Z M100 100 L50 100 L50 50 Z M0 100 L0 50 L50 50 Z" fill="C"/>',petal:'<path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z" fill="C"/>'};
const COL={frame:'var(--coral)',quarter:'var(--green)',diamond:'var(--orange)',half:'var(--yellow)',pin:'var(--blue)',petal:'var(--purple)'};
function tile(k,s=14,outline){let b=P[k];b=outline?b.replace(/fill="C"/g,`style="fill:none;stroke:${outline};stroke-width:9"`).replace(/fill-rule="evenodd" /g,''):b.replace(/fill="C"/g,`style="fill:${COL[k]}"`);return `<svg width="${s}" height="${s}" viewBox="-5 -5 110 110" aria-hidden="true" style="flex:none;display:block">${b}</svg>`}
const IC={x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12l5 5 9-10"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',chev:'<path d="M9 6l6 6-6 6"/>',send:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const ic=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;display:block">${IC[k]}</svg>`;
$('#bg').innerHTML=(innerWidth<700?[['quarter','left:-120px;top:-120px;width:420px;height:420px'],['petal','left:180px;top:140px;width:300px;height:300px'],['half','left:120px;top:520px;width:380px;height:380px']]:[['quarter','left:-260px;top:-360px;width:900px;height:900px'],['petal','left:45vw;top:-260px;width:640px;height:640px'],['half','left:48vw;top:58vh;width:820px;height:820px']]).map(([k,st])=>`<svg viewBox="-5 -5 110 110" style="${st}">${P[k].replace(/fill="C"/g,'style="fill:var(--tone)"')}</svg>`).join('');

/* ---------------- demo data (GCash) ---------------- */
const SOURCES=[{n:'gcash.com',d:'Website · 24 pages',web:1},{n:'GCash Brand Guidelines 2026.pdf',d:'Brand book · 48 pages'},{n:'Marketing compliance memo.pdf',d:'Compliance · 6 pages',memo:1},{n:'GCash Heroes deck.pdf',d:'A past brief · 12 slides'},{n:'Old campaign scan.pdf',d:'Scanned · 3 pages',bad:1}];
const CATS=['Finance and e-wallets','Food and drink','Telco','Beauty','Retail','Apps and games','Other'];
const DRAFT=[
 {id:'K1',g:'Facts',t:'Free to download and sign up.',sh:'Free to join',src:'gcash.com/register'},
 {id:'V1',g:'Voice',t:'Taglish, short and warm.',sh:'Taglish, short, warm',src:'Brand book, p.22'},
 {id:'R-03',g:'Rules',t:'Never promise approval, loan amounts or dates.',src:'Compliance memo, p.2',memo:1},
 {id:'K3',g:'Facts',t:'Sign-up needs one valid ID and takes about 5 minutes.',sh:'One ID, 5 minutes',src:'gcash.com/help'},
 {id:'K2',g:'Facts',t:'Verification is usually done the same day.',sh:'Same-day check',src:'gcash.com/help',low:1},
 {id:'R-04',g:'Rules',t:'Never compare fees with other wallets.',src:'Brand book, p.31'},
 {id:'V2',g:'Voice',t:'Say “po” when the other person does.',sh:'“Po” when they use it',src:'Brand book, p.23'},
 {id:'K4',g:'Facts',t:'Send money to any Philippine bank.',sh:'Any bank',src:'gcash.com/send'},
 {id:'K5',g:'Facts',t:'Pay bills to over 1,000 billers in the app.',sh:'1,000+ billers',src:'gcash.com/bills'},
 {id:'R-09',g:'Rules',t:'Never lead with loans or credit.',src:'Compliance memo, p.3',memo:1},
 {id:'K6',g:'Facts',t:'Save in GSave with no minimum balance.',sh:'GSave, no minimum',src:'Brand book, p.14'},
 {id:'V3',g:'Voice',t:'No hard sell. Show the app doing the work.',sh:'No hard sell',src:'Brand book, p.24'},
 {id:'K7',g:'Facts',t:'Most customers are 18 to 35, many unbanked.',sh:'18 to 35',src:'Brand book, p.8'},
 {id:'R-10',g:'Rules',t:'One campaign per post.',src:'Compliance memo, p.4',memo:1},
 {id:'K8',g:'Facts',t:'Many send money home to family in the provinces.',sh:'Sends money home',src:'Brand book, p.9',low:1},
];
const CONFLICT={t:'Welcome credit: the website says ₱50, the Heroes deck says ₱100.',src:'gcash.com vs Heroes deck',options:[['₱50','gcash.com, promos page'],['₱100','GCash Heroes deck, slide 6'],['Neither','The offer has ended']]};
const GAPS=[{id:'G1',q:'Can I use GCash abroad?'},{id:'G2',q:'Is there a fee to cash out to a bank?'}];
const OKPO=[['R-01','Turn on the paid partnership label'],['R-02','Say it’s paid, in words or with the label'],['R-11','Use your own tracked link'],['R-14','No minors on camera']];
const GROUPS=['Facts','Voice','Rules'];
const STEPS=['Sources','Read','Check facts','Rules','Test and publish'];
const STEP_OF=[0,0,0,1,2,2,2,2,3,4,4,4],FIRST=[0,3,4,8,9],PAGE=5;

const fresh=()=>({mode:'setup',step:0,max:0,name:'GCash',cat:'Finance and e-wallets',files:[],iv:{who:'',offer:'',never:''},
 cards:[],read:'no',fpage:0,credit:null,gaps:GAPS.map(g=>({...g})),rules:[],editing:null,as:'inf',chat:[],busy:false,published:false,sheet:false});
let S=fresh(),lastKey='',lastSay='',seen=new Set(),timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,RM?0:ms);timers.push(t);return t};
const memo=()=>S.files.some(f=>f.memo);
const facts=()=>S.cards.filter(c=>c.g==='Facts');
const voice=()=>S.cards.filter(c=>c.g==='Voice');
const ok=g=>S.cards.filter(c=>c.st==='ok'&&(!g||c.g===g));
const drafts=()=>facts().filter(c=>c.st==='draft');
const rulesOn=()=>S.rules.filter(r=>r.on);
const card=id=>S.cards.find(c=>c.id===id);
const isTeam=()=>true;

/* ---------------- shared pieces ---------------- */
function toast(html){const t=document.createElement('div');t.className='toast glass strong';t.setAttribute('role','status');t.innerHTML=html;$('#layer').appendChild(t);
 if(!RM)t.animate([{opacity:0,transform:'translate(-50%,16px)'},{opacity:1,transform:'translateX(-50%)'}],{duration:350,easing:EASE});
 setTimeout(()=>{if(RM){t.remove();return}t.animate([{opacity:1},{opacity:0,transform:'translate(-50%,12px)'}],{duration:220}).finished.then(()=>t.remove())},3200)}
const bm=(sz=28)=>S.name.trim()?`<span class="gdot" style="width:${sz}px;height:${sz}px">${esc(S.name.trim()[0].toUpperCase())}</span>`:`<span class="gdot empty" style="width:${sz}px;height:${sz}px">+</span>`;
function bump(el){if(el&&!RM)el.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:260,easing:POP})}
function say(text){return `<div class="say" id="say"><span class="label">OkPo</span><p>${text}</p></div>`}
const head=(eyebrow,title)=>`<div class="hd"><span class="label" id="eyebrow">${tile('petal',14)}${eyebrow}</span><h1 id="h1">${title}</h1></div>`;
function navRow({back=true,primary='Continue',disabled=false,skip='',id='next'}={}){
 return `<div class="nav">${back?`<button type="button" class="ghost" data-act="back">Back</button>`:''}<span class="grow"></span>${skip?`<button type="button" class="link" data-act="skip">${skip}</button>`:''}<button type="button" class="btn" id="${id}" data-act="next" ${disabled?'disabled':''}>${primary}</button></div>`}
function chipFor(c){return c.st==='ok'?'<span class="chip ok up">Checked</span>':c.st==='draft'?'<span class="chip n up">Draft · not used</span>':c.low?'<span class="chip warn up">A guess · check me</span>':'<span class="chip n up">Drafted</span>'}
function kc(c,mode){
 return `<div class="kc glass${c.st==='ok'?'':' strong'}" data-kc="${c.id}"><div class="row"><span class="label grow">${esc(c.g==='Voice'?'Voice':c.id)}</span><span data-chip="${c.id}">${chipFor(c)}</span></div>
 ${S.editing===c.id?`<textarea class="txt" data-txt="${c.id}" rows="3">${esc(c.t)}</textarea>`:`<p>${esc(c.t)}</p>`}
 <span class="src">${ic('doc',12)}${esc(c.src)}</span>
 ${mode==='read'?'':`<div class="row" style="gap:6px"><span class="grow"></span>${S.editing===c.id?`<button class="btn sm" type="button" data-save="${c.id}">Save</button>`:`<button class="ghost" type="button" data-edit="${c.id}">Edit</button><button class="ghost" type="button" data-drop="${c.id}" aria-label="Drop this card">${ic('x',13)}</button>`}</div>`}</div>`}

/* ---------------- Brand context panel ---------------- */
function panel(){
 const f=ok('Facts'),v=ok('Voice'),r=rulesOn(),live=S.published,dr=drafts().length;
 const row=(id,txt,cls)=>`<div class="prow" data-p="${id}"><span class="rid ${cls||''}">${esc(id)}</span><span>${esc(txt)}</span></div>`;
 return `<div class="row"><span class="label grow" style="display:inline-flex;gap:8px;align-items:center">${tile('petal',14)}${esc(S.name||'New brand')} · v1</span><span class="chip up ${live?'ok':'n'}">${live?'● Live':'Draft'}</span></div>
 <h2>Brand context</h2>
 <span class="small">${live?'The coach, daily briefs and Ask AI use this now.':'The coach, daily briefs and Ask AI will use this. Only checked items go in.'}</span>
 <div class="sec"><div class="row"><span class="label grow">Facts</span><span class="cnt num">${f.length}</span></div>${f.map(c=>row(c.id,c.sh||c.t,'k')).join('')||'<span class="small">Facts you check land here.</span>'}${dr?`<span class="small">${dr} more saved as drafts, not used yet.</span>`:''}</div>

/* Check: ticked in place with the console's flash ring. Cards never leave the screen. */
async function keepPage(){
 const fs=facts(),pages=Math.ceil(fs.length/PAGE),p=Math.min(S.fpage,pages-1),list=fs.slice(p*PAGE,p*PAGE+PAGE).filter(c=>c.st!=='ok');

/* Test: demo answers that cite what they used */
function answer(q,as){const s=q.toLowerCase(),inf=as==='inf',rule=id=>rulesOn().some(r=>r.id===id),fact=id=>card(id)&&card(id).st==='ok';
 if(/sure|approv|guarantee/.test(s)&&rule('R-03'))return{t:inf?'Hindi po, bawal yan. Sabihin mo na lang: libre mag-join, mga 5 minuto lang.':'Hindi ko po masasabi yan. Libre mag-join, at makikita mo sa app kung ano ang para sa’yo.',used:['R-03','K1','Voice'].filter(u=>u!=='K1'||fact('K1'))};
 if(/mas mura|cheaper|ibang wallet|maya/.test(s)&&rule('R-04'))return{t:inf?'Hindi tayo nagko-compare sa ibang wallets. Ipakita mo na lang kung gaano kadali magpadala.':'Hindi ko po masasabi yan. Pero puwede magpadala sa kahit anong bangko sa GCash.',used:['R-04',...(fact('K4')?['K4']:[])]};
 if(/loan|gcredit|utang/.test(s)&&rule('R-09'))return{t:'Iwas muna tayo sa loans. Mag-lead tayo sa pagpapadala o pagbabayad ng bills.',used:['R-09']};
 if(/credit|welcome|promo/.test(s)&&fact('K9'))return{t:S.credit==='Neither'?'Wala na pong welcome credit ngayon. Libre pa rin mag-join.':`Opo, ${S.credit} para sa bagong verified users.`,used:['K9','Voice']};
 const g=ok('Facts').find(c=>c.from&&s.split(/\W+/).filter(w=>w.length>3).some(w=>c.from.toLowerCase().includes(w)));if(g)return{t:g.t,used:[g.id,'Voice']};
 if(/abroad|ibang bansa/.test(s))return{t:'Wala pa po akong sagot dito, kaya hindi ako manghuhula. Ipapasa ko ito sa team.',used:[],handoff:true};
 if(/magkano|bayad|fee|libre|free|join|kailangan|id\b/.test(s)&&fact('K1'))return{t:`Libre po ang pag-join.${fact('K3')?' Isang valid ID lang, mga 5 minuto.':''}`,used:['K1',...(fact('K3')?['K3']:[]),'Voice']};
 if(/padala|send|bank|nanay/.test(s)&&fact('K4'))return{t:'Puwede pong magpadala sa kahit anong bangko sa Pilipinas, diretso sa app.',used:['K4','Voice']};
 return{t:'Wala pa po akong sagot dito, kaya hindi ako manghuhula. Ipapasa ko ito sa team.',used:[],handoff:true}}
async function ask(q){if(S.busy)return;const as=S.as;S.chat.push({me:1,t:q,as});const ty={typing:1,as,used:[]};S.chat.push(ty);S.busy=true;render('askIn');
 await wait(1000);const a=answer(q,as);S.chat.splice(S.chat.indexOf(ty),1,{t:a.t,used:a.used,handoff:!!a.handoff,as});S.busy=false;render('askIn');
 a.used.forEach((u,i)=>later(()=>{$$(`[data-p="${u}"]`).forEach(el=>{el.classList.remove('lit');void el.offsetWidth;el.classList.add('lit')})},i*90))}

/* Publish: the console's moment. A petal pops at the button and flies to the brand switcher. */
function publish(){const btn=$('#publish'),target=$('#brandBtn');
 const done=()=>{S.published=true;go(11);const c=$('#live');if(c&&!RM)c.animate([{transform:'scale(.94)',opacity:0},{transform:'scale(1.02)',opacity:1,offset:.7},{transform:'none'}],{duration:520,easing:POPS});
  const bb=$('#brandBtn');if(bb&&!RM)bb.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:420});
  toast(`${tile('petal',16)}<span><b>${esc(S.name)} brand context v1 is live.</b> The coach, daily briefs and every OkPo page use it now.</span>`)};
 if(RM||!btn||!target){done();return}btn.disabled=true;
 const r=btn.getBoundingClientRect(),t=target.getBoundingClientRect(),g=document.createElement('div');g.innerHTML=tile('petal',46);
 g.style.cssText=`position:fixed;left:${r.left+r.width/2-23}px;top:${r.top+r.height/2-23}px;z-index:90;pointer-events:none`;document.body.appendChild(g);
 const dx=t.left+22-(r.left+r.width/2),dy=t.top+20-(r.top+r.height/2);
 g.animate([{transform:'scale(.2) rotate(0)',opacity:0},{transform:'scale(1.5) rotate(45deg)',opacity:1,offset:.35},{transform:'scale(1.5) rotate(45deg)',offset:.55},{transform:`translate(${dx}px,${dy}px) scale(.4) rotate(90deg)`,opacity:.9}],{duration:1300,easing:EXIT}).finished.then(()=>{g.remove();done()})}

/* ---------------- events ---------------- */
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-act]');if(!b||b.closest('.proto'))return;const d=b.dataset;
 if(d.act==='sheet'){openSheet();return}
 if(d.act==='sheetclose'){closeSheet();return}
 if(d.act==='brand'){toast(S.published?'Switch brands from the console.':'Brands switch in the console once this one is live.');return}
 if(d.act==='exit'){S.mode='exited';render();return}
 if(d.act==='resume'){S.mode='setup';render();return}
 if(d.jump!==undefined){go(FIRST[+d.jump]);return}
 if(d.act==='next'){const st=S.step;
  if(st===4){keepPage();return}
  if(st===5){const txt=S.credit==='Neither'?'There’s no welcome credit right now.':`${S.credit} welcome credit for new verified users.`;const ex=card('K9');if(ex){ex.t=txt;ex.sh=S.credit==='Neither'?'No welcome credit':S.credit+' welcome credit'}else S.cards.push({id:'K9',g:'Facts',t:txt,sh:S.credit==='Neither'?'No welcome credit':S.credit+' welcome credit',src:'You settled: '+CONFLICT.src,st:'ok'});go(6);return}
  if(st===6){const vs=voice().filter(c=>c.st!=='ok');if(!vs.length){go(7);return}b.disabled=true;vs.forEach((c,i)=>later(()=>{c.st='ok';const el=$(`[data-kc="${c.id}"]`);if(el){el.classList.remove('strong');$(`[data-chip="${c.id}"]`,el).innerHTML=chipFor(c);el.classList.add('flash')}paintPanel()},i*60));await wait(vs.length*60+700);go(7);return}
  if(st===10){publish();return}
  go(st+1);return}
 if(d.act==='back'){if(S.step===4&&S.fpage>0){S.fpage--;render();return}go(Math.max(0,S.step===4?3:S.step-1));return}
 if(d.act==='skip'){
  if(S.step===2){S.iv={who:'',offer:'',never:''};go(3);return}
  if(S.step===4){const fs=facts(),from=Math.min(S.fpage,Math.ceil(fs.length/PAGE)-1)*PAGE;fs.slice(from).forEach(c=>{if(c.st!=='ok')c.st='draft'});toast(`<b>${drafts().length} facts saved as drafts.</b> I won’t use them until someone checks them.`);go(5);return}
  if(S.step===7){go(8);return}return}
 if(d.act==='addfile'){const f=SOURCES.find(a=>!S.files.some(x=>x.n===a.n));if(!f){toast('All the sample files are added.');return}S.files.push(f);render();const row=$(`[data-f="${S.files.length-1}"]`);if(row&&!RM)row.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:EASE});return}
 if(d.rm!==undefined){S.files.splice(+d.rm,1);render();return}
 if(d.edit){S.editing=d.edit;render('');const ta=$(`[data-txt="${d.edit}"]`);if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}return}
 if(d.save){const c=card(d.save),ta=$(`[data-txt="${d.save}"]`);if(c&&ta&&ta.value.trim()){c.t=ta.value.trim();c.sh=c.t.length>28?c.t.slice(0,26)+'…':c.t;c.src=c.src.includes('edited')?c.src:c.src+' · edited by you';c.st='ok';c.low=false}S.editing=null;render();const el=$(`[data-kc="${d.save}"]`);if(el)el.classList.add('flash');return}
 if(d.drop){const el=$(`[data-kc="${d.drop}"]`);const gone=()=>{S.cards=S.cards.filter(c=>c.id!==d.drop);if(!facts().slice(S.fpage*PAGE).length&&S.fpage>0)S.fpage--;render()};if(el&&!RM)el.animate([{opacity:1},{opacity:0,transform:'scale(.96)'}],{duration:200}).finished.then(gone);else gone();return}
 if(d.credit){S.credit=d.credit;$$('[data-credit]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.credit===d.credit)));$('#next').disabled=false;return}
 if(d.rule!==undefined){const r=S.rules[+d.rule];r.on=!r.on;b.setAttribute('aria-checked',String(r.on));paintPanel();const n=rulesOn().length,nx=$('#next');nx.disabled=!n;nx.textContent=n?`Use ${n} rule${n===1?'':'s'}`:'Tick at least one';return}
 if(d.as){S.as=d.as;render();return}
 if(d.q){ask(d.q);return}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='fName'){S.name=t.value;$('#next').disabled=!t.value.trim();const bb=$('#brandBtn');if(bb){bb.querySelector('.gdot').outerHTML=bm();bb.querySelector('b').textContent=t.value.trim()||'New brand'}}
 if(t.dataset.iv){S.iv[t.dataset.iv]=t.value;$('#next').textContent=`Read ${S.files.length+(S.iv.who||S.iv.offer||S.iv.never?1:0)} sources`}});
document.addEventListener('change',e=>{if(e.target.id==='fCat')S.cat=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.dataset.form==='rule'){const i=$('#ruleIn'),v=i.value.trim();if(!v){i.focus();return}const n=Math.max(15,...S.rules.map(r=>+r.id.slice(2)+1));S.rules.push({id:'R-'+n,t:v,src:'Added by you',on:true});render('ruleIn');
  const el=$(`[data-rule="${S.rules.length-1}"]`);if(el&&!RM)el.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:EASE});return}
 if(f.dataset.form==='ask'){const i=$('#askIn'),v=i.value.trim();if(!v){i.focus();return}ask(v);return}
 if(f.dataset.gap){const g=S.gaps.find(x=>x.id===f.dataset.gap),v=f.querySelector('input').value.trim();if(!g||!v){f.querySelector('input').focus();return}
  const id='K'+(10+GAPS.indexOf(GAPS.find(x=>x.id===g.id)));S.cards.push({id,g:'Facts',t:v,sh:v.length>28?v.slice(0,26)+'…':v,src:'Your answer to: '+g.q,from:g.q,st:'ok'});S.gaps=S.gaps.filter(x=>x!==g);
  const go2=()=>{render();toast(`${tile('petal',16)}<span><b>Added as a checked fact.</b> ${id} is in Brand context now.</span>`)};
  if(RM)go2();else f.animate([{opacity:1},{opacity:0,transform:'translateY(-6px)'}],{duration:220,easing:EASE}).finished.then(go2)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* prototype controls */
const theme=()=>document.documentElement.getAttribute('data-theme')==='dark';
$('#pTheme').onclick=()=>{document.documentElement.setAttribute('data-theme',theme()?'light':'dark');$('#pTheme').textContent=theme()?'Light':'Dark'};
$('#pRestart').onclick=()=>{timers.forEach(clearTimeout);timers=[];S=fresh();lastKey='';lastSay='';seen=new Set();closeSheet();render()};
$('#pSkip').onclick=()=>{timers.forEach(clearTimeout);timers=[];if(!S.files.length)S.files=SOURCES.slice(0,4);S.cards=DRAFT.map(c=>({...c,st:'ok'}));S.read='done';S.credit=S.credit||'₱50';
 if(!card('K9'))S.cards.push({id:'K9',g:'Facts',t:'₱50 welcome credit for new verified users.',sh:'₱50 welcome credit',src:'You settled: '+CONFLICT.src,st:'ok'});buildRules();S.rules.forEach(r=>r.on=true);S.mode='setup';go(9)};
document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')||'light');
render();
})();
</script>
