<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkPo Brand Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: setup is a full-screen conversation with OkPo on the left and "Your GCash AI" assembling on the right
   (a pull-down strip on phones). Things you confirm fly into it. The console after setup stays organized. Light first. */
:root{
  --ground:#f6f1e4; --tone:#ebe2cc; --ink:#121212; --body:#4a4640; --mute:#6a655c;
  --line:rgba(18,18,18,.12); --line2:rgba(18,18,18,.07); --soft:rgba(18,18,18,.05); --field:#ffffff;
  --glass-a:rgba(255,255,255,.7); --glass-b:rgba(255,255,255,.5); --glass-edge:rgba(255,255,255,.95);
  --glass-strong:rgba(255,255,255,.88); --shadow:0 16px 36px rgba(18,18,18,.10);
  --btn:#121212; --on-btn:#f6f1e4;
  --coral:#ff8787; --yellow:#ffd43b; --orange:#ffa94d; --green:#69db7c; --blue:#74c0fc; --purple:#b197fc;
  --l-coral:#c92a2a; --l-green:#237a36; --l-yellow:#9c6500; --l-purple:#6741d9;
  --ok-bg:rgba(105,219,124,.24); --fix-bg:rgba(255,135,135,.2); --k-bg:rgba(177,151,252,.2); --tp-bg:rgba(255,212,59,.3); --c-bg:rgba(105,219,124,.2);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --text:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --pop:cubic-bezier(.34,1.56,.64,1); --exit:cubic-bezier(.6,0,.3,1);
}
:root[data-theme="dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a;
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.07); --soft:rgba(255,255,255,.06); --field:#1a1a1a;
  --glass-a:rgba(40,40,40,.72); --glass-b:rgba(22,22,22,.62); --glass-edge:rgba(255,255,255,.16);
  --glass-strong:rgba(32,32,32,.92); --shadow:0 16px 36px rgba(0,0,0,.5);
  --btn:#ececec; --on-btn:#121212;
  --l-coral:#ff8787; --l-green:#69db7c; --l-yellow:#ffd43b; --l-purple:#b197fc;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute;fill:var(--tone);transition:transform 1.4s var(--ease)}
/* the backdrop shifts per section */
body[data-sec="1"] .bg .b2{transform:scale(1.35) rotate(25deg)}
body[data-sec="1"] .bg .b1{transform:translate(-40px,-30px) scale(.9)}
body[data-sec="2"] .bg .b3{transform:translate(-120px,-60px) scale(1.2)}
body[data-sec="2"] .bg .b2{transform:translate(60px,40px) scale(.85) rotate(-15deg)}
body[data-sec="3"] .bg .b1{transform:scale(1.2) rotate(-8deg)}
body[data-sec="3"] .bg .b3{transform:translate(160px,-40px) scale(1.15)}
body[data-sec="4"] .bg .b1{transform:translate(60px,40px) scale(1.25)}
body[data-sec="4"] .bg .b2{transform:scale(1.4) rotate(45deg)}
body[data-sec="4"] .bg .b3{transform:translate(-60px,-80px) scale(1.3)}
#app{position:relative;z-index:1;min-height:100%}
.label{font:600 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.sub{color:var(--body)} .small{font-size:13px;color:var(--mute)} .num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0}
.wm{font:800 24px/1 var(--display);letter-spacing:-.035em;display:inline-flex}
.wm span:nth-child(1){color:var(--coral)}.wm span:nth-child(2){color:var(--yellow)}.wm span:nth-child(3){color:var(--green)}.wm span:nth-child(4){color:var(--blue)}
.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),var(--shadow);border-radius:20px}
.glass.strong{background:var(--glass-strong)}
.btn{border:0;border-radius:14px;padding:13px 22px;min-height:48px;font-weight:600;font-size:15px;background:var(--btn);color:var(--on-btn);transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn.sm{min-height:44px;padding:10px 16px;font-size:14px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 14px;min-height:44px;font-weight:500;font-size:14px;transition:transform .12s var(--ease),background .2s}
.ghost:hover{background:var(--soft)} .ghost:active{transform:scale(.97)}
.link{border:0;background:none;padding:10px 0;min-height:44px;color:var(--mute);text-decoration:underline;font-size:14px}
.link:hover{color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;min-height:38px;font-size:13.5px;color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rid{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:6px;background:var(--soft);color:var(--body);white-space:nowrap}
.rid.k{background:var(--k-bg);color:var(--l-purple)} .rid.tp{background:var(--tp-bg);color:var(--l-yellow)} .rid.c{background:var(--c-bg);color:var(--l-green)}
.chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;font:600 10.5px/1 var(--mono);letter-spacing:.07em;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--l-green)} .chip.fix,.chip.fail{background:var(--fix-bg);color:var(--l-coral)} .chip.n{background:var(--soft);color:var(--body)}
.tick{color:var(--l-green);font-weight:700}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--field);padding:12px 14px;min-height:46px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:120px;line-height:1.5}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-18px) scale(.9)}}
@keyframes word{from{opacity:0;transform:translateY(6px);filter:blur(3px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--purple) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.enter>*{animation:rise .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}.enter>*:nth-child(n+6){animation-delay:.3s}
.say .w{display:inline-block;animation:word .4s var(--ease) both}
.pop{animation:pop .55s var(--pop) both}
.lit{animation:glow 1.1s var(--ease) 2}
.ghostfly{position:fixed;z-index:60;pointer-events:none;margin:0;transition:transform .62s var(--exit),opacity .62s var(--exit);will-change:transform}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mute);margin-right:4px;animation:dots 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}

/* ---------- guided mode ---------- */
.g{min-height:100vh;display:flex;flex-direction:column}
.gtop{display:flex;align-items:center;gap:24px;padding:18px 28px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.steps{display:flex;gap:6px;align-items:center;margin:0 auto}
.steps em{font-style:normal}
.steps span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);padding:6px 10px;border-radius:99px;white-space:nowrap}
.steps span.on{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps span.done{color:var(--ink)}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.steps span.on i{background:var(--ink)} .steps span.done i{background:var(--green)}
.gbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;padding:12px 40px 96px;max-width:1240px;width:100%;margin:0 auto;align-items:start}
.gcol{display:flex;flex-direction:column;gap:22px;max-width:620px;width:100%;justify-self:center;padding-top:4vh}
.gcol h1{margin:0;font:800 clamp(32px,4.4vw,46px)/1.02 var(--display);letter-spacing:-.035em;text-wrap:balance}
.okpo{display:flex;gap:12px;align-items:flex-start}
.okpo .av{width:38px;height:34px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:var(--shadow);font:800 13px/1 var(--display);letter-spacing:-.04em}
.okpo .av span:nth-child(1){color:var(--coral)}.okpo .av span:nth-child(2){color:var(--yellow)}
.say{margin:0;font-size:17px;line-height:1.5;color:var(--body);max-width:52ch;padding-top:4px}
.gnav{display:flex;align-items:center;gap:16px;padding-top:4px;flex-wrap:wrap}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line2);box-shadow:0 6px 16px rgba(18,18,18,.05);transition:transform .2s var(--ease),opacity .2s}
.card .t{font-size:16px} .card .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.card.gone{opacity:0;transform:scale(.96)}
.drop{border:1.5px dashed var(--line);border-radius:20px;padding:30px;text-align:center;background:var(--glass-b);width:100%;transition:border-color .2s,transform .15s var(--ease)}
.drop:hover{border-color:var(--ink)} .drop:active{transform:scale(.99)}
.doc{width:26px;height:32px;border-radius:5px;border:1.5px solid var(--line);background:var(--field);flex:none}
.webi{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);flex:none}
.choice{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--glass-b);border-radius:18px;padding:16px 20px;text-align:left;width:100%;transition:transform .15s var(--ease)}
.choice:active{transform:scale(.98)}
.choice[aria-checked="true"]{border:2px solid var(--ink);background:var(--glass-strong);padding:15px 19px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);flex:none;transition:box-shadow .2s}
.choice[aria-checked="true"] .radio{background:var(--ink);box-shadow:inset 0 0 0 4px var(--ground)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;font-size:13px;line-height:1;transition:background .2s}
.box.on{background:var(--ink);color:var(--ground)}
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pile{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:230px}
.pile .n{font:800 34px/1 var(--display);letter-spacing:-.03em}
.pile .mini{font-size:12.5px;line-height:1.35;background:var(--glass-strong);border:1px solid var(--line2);border-radius:10px;padding:7px 9px;animation:drop .45s var(--pop) both}
.pile.guard{border:2px solid var(--ink)} .pile.brief{border:1.5px dashed var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .2s linear}
.voice{border-radius:18px;padding:18px 20px}
.note{display:flex;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--body)}
.bub{border-radius:16px;padding:10px 13px;font-size:14.5px;line-height:1.45;max-width:88%;animation:rise .35s var(--ease) both}
.bub.me{background:var(--btn);color:var(--on-btn);align-self:flex-end;border-bottom-right-radius:6px}
.bub.ai{background:var(--glass-strong);border:1px solid var(--line2);align-self:flex-start;border-bottom-left-radius:6px}
.used{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;padding-right:2px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px 12px;font-size:13.5px;align-items:start}
.sum{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 16px;padding:16px 0}
.lines{border-top:1px solid var(--line);border-bottom:1px solid var(--line)} .lines>*+*{border-top:1px solid var(--line)}
.tpl{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line2)}
.tpl .nm{flex:1 1 200px;font-size:16px;font-weight:500;min-width:0}
.tpl .ctl{display:flex;align-items:center;gap:8px}
.mv{border:1px solid var(--line);background:transparent;border-radius:10px;width:44px;height:44px;display:grid;place-items:center;color:var(--body);font-size:16px}
.mv[disabled]{opacity:.3;cursor:default}
.share{width:90px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;flex:none}
.share b{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .4s var(--ease)}

/* ---------- Your GCash AI (the stack) ---------- */
.stack{position:sticky;top:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stack h2{margin:0;font:800 20px/1.1 var(--display);letter-spacing:-.03em}
.lay{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--glass-strong);border:1px solid var(--line2);transition:opacity .3s}
.lay.hollow{opacity:.55}
.lay.guard{border:2px solid var(--ink)}
.lay.brief{border:1.5px dashed var(--line);background:transparent}
.lay .hd{display:flex;align-items:center;gap:10px}
.lay .hd b{font-size:14.5px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .rid{transition:transform .2s}
.vline{font:800 15px/1.25 var(--display);letter-spacing:-.02em}
.mini-stack{display:none}
.live{position:relative;overflow:hidden}
.live::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--green) 22%,transparent),transparent);animation:sweep 1.2s var(--ease) 1 both}

/* ---------- console ---------- */
.c{display:flex;min-height:100vh}
.side{width:236px;flex:none;padding:22px 14px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line2);background:var(--glass-b)}
.side .wm{margin:0 10px 20px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;min-height:44px;border-radius:12px;border:0;background:transparent;color:var(--body);font-weight:500;text-align:left;width:100%}
.nav[aria-current="page"]{color:var(--ink);font-weight:600}
.nav[data-nav="campaigns"][aria-current="page"]{background:color-mix(in srgb,var(--green) 24%,transparent)}
.nav[data-nav="context"][aria-current="page"]{background:color-mix(in srgb,var(--purple) 24%,transparent)}
.cmain{flex:1;min-width:0;padding:28px 36px 96px;display:flex;flex-direction:column;gap:18px;max-width:1240px}
.cmain>*{animation:rise .4s var(--ease) both}
.ctabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft);overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
.ctabs button{border:0;background:transparent;border-radius:9px;padding:8px 14px;min-height:40px;font-size:14px;color:var(--body);white-space:nowrap}
.ctabs button[aria-selected="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sec{padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--glass-edge);width:100%;transition:transform .15s var(--ease)}
.sec:hover{transform:translateY(-2px)}
.big{font:800 34px/1 var(--display);letter-spacing:-.03em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:top}
td .s{font-size:12.5px;color:var(--mute)}
tr.grp td{padding:16px 12px 6px;border-bottom:0}
.src{font:500 11.5px var(--mono);color:var(--mute);white-space:nowrap}
.dash{color:var(--mute)}
.fl{display:flex;flex-direction:column;gap:2px}
.fl button{border:0;background:transparent;border-radius:10px;padding:10px;min-height:44px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--body);text-align:left}
.fl button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600}
.guide{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.gitems{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--glass-strong);border-radius:14px;padding:12px 14px;border:1px solid var(--line2)}
.circ{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mute);flex:none;display:grid;place-items:center;font-size:11px}
.circ.done{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.empty{padding:28px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:16px;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-edge);color:var(--ink);font-weight:500;box-shadow:var(--shadow);animation:rise .3s var(--ease);max-width:calc(100% - 32px)}
.proto{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:#121212;color:#f6f1e4;font:600 11.5px var(--mono);max-width:calc(100% - 24px)}
.proto button{border:0;background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font:inherit}
.proto button:hover,.proto button[aria-pressed="true"]{background:rgba(255,255,255,.14)}
.pitems{display:flex;flex-wrap:wrap;gap:4px} #pMenu{opacity:.65}
@media (max-width:1000px){
  .gbody{grid-template-columns:minmax(0,1fr);padding:4px 16px 120px;gap:16px}
  .stack{display:none}
  .mini-stack{display:flex;position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;align-items:center;gap:10px;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line2);border-radius:0;font-size:13.5px;width:calc(100% + 32px);text-align:left;border-top:0;border-left:0;border-right:0;min-height:48px}
  .stack.open{display:flex;position:fixed;inset:auto 12px 12px 12px;top:72px;z-index:45;overflow-y:auto;border-radius:24px}
  .gcol{padding-top:8px}
  .steps span em{display:none}.steps span{padding:6px}
  .c{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line2);align-items:center}
  .side .wm{margin:0 12px 0 0}.side .foot{display:none}.nav{width:auto;white-space:nowrap}
  .cmain{padding:20px 16px 110px}
  .cards3{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)!important}
}
@media (max-width:600px){
  .gtop{padding:12px 16px;gap:12px}
  .piles{grid-template-columns:minmax(0,1fr)}.pile{min-height:0}

<script>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
const P={frame:'<path d="M0 0H100V100H0Z M27 27V73H73V27Z" fill-rule="evenodd" fill="C"/>',quarter:'<path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="C"/>',diamond:'<path d="M50 0L100 50L50 100L0 50Z M50 28L72 50L50 72L28 50Z" fill-rule="evenodd" fill="C"/>',half:'<path d="M0 100 A50 50 0 0 1 100 100 Z" fill="C"/><rect width="100" height="22" fill="C"/>',pin:'<path d="M0 0 L50 0 L50 50 Z M100 0 L100 50 L50 50 Z M100 100 L50 100 L50 50 Z M0 100 L0 50 L50 50 Z" fill="C"/>',petal:'<path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z" fill="C"/>'};

const PAGE=5;

const fresh=()=>({mode:'setup',step:0,files:[],captions:'',readDone:false,
  facts:FACTS.map(f=>({...f,st:'new',editing:false})),fpage:0,credit:null,

let S=fresh(),lastKey='';

const hasMemo=()=>S.files.some(f=>f.memo);

function buildGuards(){S.guards=GUARDS.map(g=>{const found=!g.memo||hasMemo();return {...g,on:false,found,sev:'fail',src:found?g.src:'Common for finance brands'}})}

/* fly a copy of an element into the stack */
function fly(el,target){
  if(RM||!el)return;
  const t=document.querySelector(getComputedStyle($('.stack')||document.body).display==='none'?'#miniStack':target)||$('#miniStack');if(!t)return;
  const a=el.getBoundingClientRect(),b=t.getBoundingClientRect();
  const g=el.cloneNode(true);g.classList.add('ghostfly');g.removeAttribute('id');
  Object.assign(g.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});
  document.body.appendChild(g);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transform=`translate(${dx}px,${dy}px) scale(.18)`;g.style.opacity='.15'}));
  setTimeout(()=>g.remove(),700);
}

}

}
const miniStack=()=>`<button type="button" class="mini-stack" id="miniStack" data-act="stackopen" aria-expanded="${S.stackOpen}">${tile('petal',18)}<span class="grow"><b>Your GCash AI</b> · ${kept().length} facts · ${activeG().length} guardrails</span><span aria-hidden="true">▾</span></button>`;

/* ---------------- guided setup ---------------- */
const SECT=['Material','Who we are','Guardrails','Go live'];
const SECOF=st=>st===0?0:st<=3?1:st<=6?2:st===7?3:4;
function gtop(sec,list=SECT){
  const s=list.map((n,i)=>`<span class="${i+1===sec?'on':i+1<sec?'done':''}"><i></i><em>${n}</em></span>`).join('');

}
function gpage(sec,inner,nav,list){
  return `<div class="g">${gtop(sec,list)}<div class="gbody">${miniStack()}<main class="gcol" id="gcol">${inner}${nav}</main>${stackPanel()}</div></div>`;

function setupScreen(){
  const st=S.step,sec=SECOF(st);
  if(st===0) return gpage(0,H('Welcome, GCash','Let’s build your GCash AI.')+say('Kumusta! I’m OkPo. Give me what you already have and I’ll draft the rest. You just check it. About 10 minutes, and nothing goes live until you say so.')+
    `<div class="cards"><div class="card">${tile('petal',28)}<span class="grow"><div class="t"><b>Who we are</b></div><div class="s">What’s true about GCash, and how you sound</div></span></div><div class="card" style="border:2px solid var(--ink)"><span style="width:28px"></span><span class="grow"><div class="t"><b>Guardrails</b></div><div class="s">What can never happen in a post</div></span></div><div class="card" style="border:1.5px dashed var(--line);background:transparent;box-shadow:none">${tile('quarter',28,'var(--mute)')}<span class="grow"><div class="t"><b>Campaign brief</b></div><div class="s">Comes later, with each campaign</div></span></div></div>`,gnav({back:false,primary:'Let’s start'}));

  if(st===3){

     `<div class="bar" role="progressbar" aria-label="Reading" id="rbar"><b style="width:${done?100:0}%"></b></div>

     <div class="pile glass strong guard"><div class="row"><b class="grow" style="font-size:14px">Guardrails</b></div><span class="n num" id="n1">${done?gN:0}</span><div class="cards" id="p1" style="gap:6px">${done?GUARDS.filter(g=>!g.memo||hasMemo()).slice(0,3).map(g=>`<span class="mini">${esc(g.sh)}</span>`).join(''):''}</div></div>
     <div class="pile glass brief"><div class="row">${tile('quarter',20)}<b class="grow" style="font-size:14px">First campaign</b></div><span class="n num" id="n2">${done?SAVED_TPS.length:0}</span><div class="cards" id="p2" style="gap:6px">${done?SAVED_TPS.slice(0,3).map(t=>`<span class="mini">${esc(t)}</span>`).join(''):''}</div></div></div>

     `<div style="display:flex;flex-direction:column;gap:12px"><div class="voice" style="background:var(--soft)"><span class="label">Plain</span><p style="margin:8px 0 0;font-size:17px">Sign up for GCash today and enjoy fast, secure transfers!</p></div>${card}${chips}</div>`,

/* reading: lines drop into piles while the counts climb */
async function runReading(){
  buildGuards();S.readDone=false;render();
  const gs=GUARDS.filter(g=>!g.memo||hasMemo());
  const streams=[FACTS.map(f=>f.sh),gs.map(g=>g.sh),SAVED_TPS];
  const totals=streams.map(s=>s.length),cur=[0,0,0];
  const order=[];for(let i=0;i<Math.max(...totals);i++)for(let p=0;p<3;p++)if(i<totals[p])order.push(p);
  for(let i=0;i<order.length;i++){
    if(S.mode!=='setup'||S.step!==3)return;
    const p=order[i];cur[p]++;
    const box=$('#p'+p);if(box){const m=document.createElement('span');m.className='mini';m.textContent=streams[p][cur[p]-1];box.prepend(m);while(box.children.length>3)box.lastChild.remove()}
    const n=$('#n'+p);if(n)n.textContent=cur[p];
    const bar=$('#rbar b');if(bar)bar.style.width=Math.round((i+1)/order.length*100)+'%';
    await wait(170);
  }
  await wait(250);if(S.mode==='setup'&&S.step===3){S.readDone=true;render()}
}

function reply(tab,q){
  const s=q.toLowerCase(),cr=S.credit;
  if(tab==='post'){
    const res=[];const g=id=>activeG().some(x=>x.id===id);
    if(g('R-03')&&/sure|approv|guarantee/.test(s))res.push(['fail','Promises approval','R-03']);
    if(g('R-04')&&/mas mura|cheaper|kaysa/.test(s))res.push(['fail','Compares fees with another wallet','R-04']);
    if(g('R-09')&&/loan|gcredit|utang/.test(s))res.push(['fail','Leads with credit','R-09']);
    if(/₱?100/.test(s)&&cr!=='100')res.push(['fix','Says ₱100 welcome credit. GCash confirmed '+(cr==='none'?'there is none now':'₱'+cr),'K9']);
    const brief=S.camps[0];
    if(brief&&/website/.test(s))res.push(['fix','Ends on the website, not the app sign-up','Brief · Ends on']);
    const verdict=res.some(r=>r[0]==='fail')?'FAIL':res.length?'NEEDS A FIX':'PASSES';
    const body=res.length?res.map(r=>`<div class="row" style="font-size:14px"><span class="chip ${r[0]}">${r[0]==='fail'?'FAIL':'FIX'}</span><span class="grow">${esc(r[1])}</span>${rid(r[2],kind(r[2]))}</div>`).join(''):`<div class="small">All ${activeG().length+4} guardrails pass, and every claim matches a fact.</div>`;
    return {t:`<div class="row"><b class="grow">Verdict</b><span class="chip ${verdict==='PASSES'?'ok':'fail'}">${verdict}</span></div>${body}${brief?'':'<div class="small">No campaign brief yet, so only facts and guardrails were checked.</div>'}`,used:res.length?res.map(r=>r[2]):['Guardrails','Facts'],html:true};
  }
  const cre=tab==='creator';
  if(/sure|approv|guarantee/.test(s))return{t:cre?'Hindi po, bawal yan. Sabihin mo na lang: libre mag-join, mga 5 minuto lang.':'Hindi ko po masasabi yan. Libre mag-join, at makikita mo sa app kung ano ang para sa’yo.',used:['R-03','K1','Voice']};
  if(/loan|gcredit|utang/.test(s))return{t:cre?'Iwas muna tayo sa loans sa posts. Mag-lead tayo sa pagpapadala o pagbabayad ng bills.':'Para sa credit, makikita mo po ang options sa app pagka-verify. Libre mag-join.',used:['R-09','K1']};
  if(/credit|welcome|50|100|promo/.test(s))return{t:cr==='none'?'Wala na pong welcome credit ngayon. Libre pa rin mag-join.':'Opo, ₱'+(cr||'50')+' para sa bagong verified users, hanggang 31 Oct.',used:['K9','Voice']};
  if(/id|requirement|kailangan/.test(s))return{t:'Isang valid ID lang po, mga 5 minuto. Kadalasan same day ang verification.',used:['K3','K2']};
  if(/magkano|bayad|fee|libre|free|cost/.test(s))return{t:'Libre po ang pag-join. Isang valid ID lang, mga 5 minuto.',used:['K1','K3','Voice']};
  if(/mas mura|cheaper|maya|other wallet/.test(s))return{t:cre?'Hindi tayo nagko-compare sa ibang wallets. Ipakita mo na lang kung gaano kadali magpadala.':'Hindi ko po masasabi yan. Pero puwede magpadala sa any bank sa GCash.',used:['R-04','K4']};
  if(/padala|send|bank|nanay/.test(s))return{t:'Puwede pong magpadala sa kahit anong bangko sa Pilipinas, diretso sa app.',used:['K4','Voice']};
  return{t:'Magandang tanong po. Ipapasa ko ito sa GCash team para masagot nang tama.',used:['Voice','Logged to Learn']};
}

}
function cGuard(){
  const cell=a=>a?`<td><b style="font-size:13.5px">${esc(a[0])}</b>${a[1]?`<div class="s">${esc(a[1])}</div>`:''}</td>`:'<td><span class="dash">Not used</span></td>';
  const row=g=>`<tr><td>${rid(g.id)}</td><td style="min-width:220px">${esc(g.t)}</td>${cell(g.coach)}<td><span class="chip ${g.sev}">${g.sev==='fail'?'FAIL':'NEEDS A FIX'}</span><div class="s">${g.sev==='fail'?'Post doesn’t count':'Fix and resubmit'}</div></td>${cell(g.ask)}</tr>`;
  return `<p class="sub" style="margin:0;max-width:70ch">What can never happen, in any campaign. Each row says what the guardrail does in the coach, the checker and Ask AI.</p>
  <div class="glass strong" style="padding:8px"><div class="tw"><table><thead><tr><th></th><th>Guardrail</th><th>Coach · creators</th><th>Check · posts</th><th>Ask AI · audience</th></tr></thead><tbody>
  <tr class="grp"><td colspan="5"><b>Set by GCash</b> <span class="small">${activeG().length} · each one approved by you</span></td></tr>${activeG().map(row).join('')}
  <tr class="grp"><td colspan="5"><b>Set by OkPo</b> <span class="small">4 · locked, the same for every brand</span></td></tr>${OKPO.map(row).join('')}</tbody></table></div></div>`;
}
function cTest(){
  return `<div class="split" style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start"><div style="display:flex;flex-direction:column;gap:12px">${tryPanel()}</div>
  <div class="glass strong" style="padding:18px;display:flex;flex-direction:column;gap:10px"><span class="label">Full test</span><b class="disp" style="font-size:26px">${S.tested?exCount()+' of '+exCount()+' behave':'Last run at publish'}</b><span class="small">A pass and a fail example for every guardrail.</span><button type="button" class="btn sm" data-act="runtest">${S.tested?'Run again':'Run full test'}</button></div></div>`;
}
const LEARN=[{id:'l1',q:'Pwede ba gamitin ang GCash sa abroad?',n:4},{id:'l2',q:'May bayad ba mag-cash out sa bangko?',n:3},{id:'l3',fix:'Ends on the website, not the app',n:6}];
const learnItems=()=>LEARN.filter(l=>!S.learnDone.includes(l.id)&&(l.q||S.camps.length));
function cLearn(){
  if(!S.week)return `<div class="glass empty"><b style="font-size:16px">Learn starts when creators post</b><span class="small" style="max-width:52ch">It will list questions the AI couldn’t answer and fixes that keep coming up, and send each one to the layer that would fix it.</span></div>`;
  const items=learnItems().map(l=>`<div class="glass strong row" style="padding:16px 18px;flex-wrap:wrap"><span class="grow" style="min-width:220px">${l.q?`<b>Asked ${l.n} times, no answer</b><span class="small" style="display:block">“${esc(l.q)}”</span>`:`<b>Frequent fix, ${l.n} posts this week</b><span class="small" style="display:block">${esc(l.fix)}</span>`}</span>${l.q?`<button type="button" class="ghost" data-learn="${l.id}">Add as a fact</button>`:`<button type="button" class="ghost" data-learn="${l.id}">Open the brief</button>`}<button type="button" class="link" data-ldis="${l.id}">Dismiss</button></div>`).join('');
  return `<p class="sub" style="margin:0;max-width:70ch">What the AI couldn’t answer and what posts keep getting wrong. Each suggestion goes to the layer that would fix it.</p>${items||'<div class="glass empty small">Nothing new. Learn checks again every day.</div>'}`;
}
function cCampaigns(){
  const list=S.camps.map(c=>`<div class="glass strong" style="padding:18px;display:flex;flex-direction:column;gap:12px"><div class="row" style="flex-wrap:wrap"><span class="grow"><b class="disp" style="font-size:22px">${esc(c.name)}</b><span class="small" style="display:block">${{signup:'New verified sign-ups',deposit:'First deposits',bills:'First bill payment'}[c.obj]}</span></span><span class="chip n">DRAFT · REWARDS NEXT</span></div>
   <div class="label">Brief</div>
   <div class="row" style="flex-wrap:wrap;gap:6px"><span class="small" style="width:110px">Talking points</span>${c.tps.map((t,i)=>rid(String(i+1).padStart(2,'0')+' '+t,'tp')).join('')}</div>
   <div class="row" style="gap:6px;flex-wrap:wrap"><span class="small" style="width:110px">Ends on</span><span style="font-size:14px">${c.ends==='app'?'The app sign-up, with the creator’s own link':'The creator’s OkPo page'}</span></div>
   <div class="row" style="gap:6px;flex-wrap:wrap"><span class="small" style="width:110px">Tags</span><span style="font-size:14px">${esc(c.tags)}</span></div></div>`).join('');
  return `<div class="row" style="flex-wrap:wrap"><span class="grow"><span class="label">Campaigns</span><h1 class="disp" style="margin:6px 0 0;font-size:30px">Campaigns</h1></span><button type="button" class="btn sm" data-act="newcamp">New campaign</button></div>
  <p class="sub" style="margin:0;max-width:70ch">Each campaign has its own brief, on top of GCash’s who we are and guardrails.</p>
  ${list||`<div class="glass empty"><b style="font-size:16px">No campaigns yet</b><span class="small">Start one to write its brief. We saved ${SAVED_TPS.length} talking points from your material.</span><button type="button" class="btn sm" data-act="newcamp">Start your first campaign</button></div>`}`;
}



/* ---------------- render and events ---------------- */
function render(focus){
  const key=S.mode+':'+(S.mode==='setup'?S.step+'-'+S.fpage+'-'+S.voice:S.mode==='campaign'?S.cstep:S.page+S.ctab);
  document.body.dataset.sec=S.mode==='setup'?Math.min(4,SECOF(S.step)):S.mode==='campaign'?4:0;
  $('#app').innerHTML=S.mode==='setup'?setupScreen():S.mode==='exited'?exitedScreen():S.mode==='campaign'?campScreen():consoleScreen();
  const col=$('#gcol');if(col&&key!==lastKey)col.classList.add('enter');
  if(key!==lastKey&&lastKey)window.scrollTo(0,0);
  lastKey=key;S.fresh=[];S.hl=[];
  const ch=$('#chat');if(ch)ch.scrollTop=ch.scrollHeight;
  if(focus){const el=document.getElementById(focus);if(el){el.focus({preventScroll:true});if(el.setSelectionRange)el.setSelectionRange(el.value.length,el.value.length)}}
}
function go(step){S.step=step;S.stackOpen=false;if(step===3){runReading();return}render()}
function startCamp(){S.camp={name:S.camps.length?'GCash Ipon Challenge':'GCash Heroes',obj:S.camps.length?'deposit':'signup',tps:[],ends:'app',tags:S.camps.length?'#IponChallenge':'#GCashHeroes'};S.cstep=0;S.mode='campaign';S.fresh=['brief'];render()}
const toConsole=(page='context',tab='overview')=>{S.mode='console';S.page=page;S.ctab=tab;render()};

async function keepPage(){
  const fs=S.facts.slice(S.fpage*PAGE,S.fpage*PAGE+PAGE);
  for(const f of fs){const el=$('#fc-'+f.id);if(el){fly(el,'#stk-who');el.classList.add('gone')}await wait(90)}
  await wait(380);
  fs.forEach(f=>{if(f.st==='new'){f.st='kept';S.fresh.push(f.id)}});S.fresh.push('who');
  const pages=Math.ceil(S.facts.length/PAGE);
  if(S.fpage<pages-1){S.fpage++;render()}else go(5);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||b.closest('.proto'))return;const d=b.dataset;
  if(d.act==='next'){
    if(S.mode==='campaign'){
      if(S.cstep===0){const n=$('#cname');if(n)S.camp.name=n.value.trim()||S.camp.name;S.cstep=1;if(!S.camp.tps.length){render();for(const t of SAVED_TPS.slice(0,3)){S.camp.tps.push(t);S.fresh.push('tp'+t);render();await wait(160)}}else render();return}
      if(S.cstep===2){const t=$('#ctags');if(t)S.camp.tags=t.value;S.camps.push(S.camp);S.camp=null;toConsole('campaigns');toast('Brief saved. Rewards and pool are next, in the campaign.');return}
      S.cstep++;render();return}
    if(S.step===2){const c=$('#caps');if(c)S.captions=c.value}
    if(S.step===4){keepPage();return}
    if(S.step===6){if(S.voice==='adjust'){const v=$('#vline');if(v)S.line=v.value.trim()||null;S.voice='ok'}fly($('#vcard'),'#stk-voice');await wait(380);S.voiceSet=true;S.fresh.push('voice');go(7);return}
    if(S.step===9){S.published=true;S.fresh.push('who','brief');go(10);return}
    go(S.step+1);return}
  if(d.act==='back'){
    if(S.mode==='campaign'){if(S.cstep===0){S.camp=null;S.published?toConsole(S.page):(S.mode='setup',render())}else{S.cstep--;render()}return}
    if(S.step===6&&S.voice==='adjust'){S.voice=null;render();return}
    if(S.step===4&&S.fpage>0){S.fpage--;render();return}
    if(S.step===5)S.fpage=Math.ceil(S.facts.length/PAGE)-1;
    if(S.step===4){S.readDone=true}
    S.step=Math.max(0,S.step-1);S.stackOpen=false;render();return}
  if(d.act==='skip'){
    if(S.step===2){S.captions='';go(3)}
    else if(S.step===4){S.facts.forEach((f,i)=>{if(i>=(S.fpage)*PAGE&&f.st==='new')f.st='draft'});toast(drafts().length+' facts saved as drafts. I won’t use them until you check them.');go(5)}
    else if(S.step===6){S.voice='adjust';render()}
    return}
  if(d.act==='stackopen'){S.stackOpen=!S.stackOpen;render();return}
  if(d.act==='stackclose'){S.stackOpen=false;render();return}
  if(d.act==='saveexit'){S.mode='exited';render();return}
  if(d.act==='resume'){S.mode='setup';render();return}
  if(d.act==='addfile'){const f=FILES.find(a=>!S.files.some(x=>x.n===a.n));if(f){S.files.push(f);S.fresh.push(f.n);render()}else toast('All sample files added.');return}
  if(d.rm!==undefined){S.files.splice(+d.rm,1);render();return}
  if(d.act==='samplecaps'){S.captions=SAMPLE_CAPS;render('caps');return}
  if(d.ff){const f=S.facts.find(x=>x.id===d.ff);f.editing=true;render('f-'+f.id);return}
  if(d.fsave){const f=S.facts.find(x=>x.id===d.fsave);const v=$('#f-'+f.id).value.trim();if(v)f.t=v;f.editing=false;render();return}
  if(d.credit){S.credit=d.credit;render();return}
  if(d.trait){const v=$('#vline');if(v&&v.value.trim()!==voiceLine())S.line=v.value.trim();const t=d.trait;S.traits=S.traits.includes(t)?S.traits.filter(x=>x!==t):[...S.traits,t];render();return}
  if(d.g!==undefined){const g=S.guards[+d.g];if(!g.on){fly(b,'#stk-guard');await wait(300);S.fresh.push(g.id)}g.on=!g.on;render();return}
  if(d.tab){S.tryTab=d.tab;render();return}
  if(d.act==='toggleex'){S.showEx=!S.showEx;render();return}
  if(d.act==='newcamp'){startCamp();return}
  if(d.act==='toconsole'){toConsole();return}
  if(d.obj){S.camp.obj=d.obj;render();return}
  if(d.ends){S.camp.ends=d.ends;render();return}
  if(d.up!==undefined){const i=+d.up,a=S.camp.tps;[a[i-1],a[i]]=[a[i],a[i-1]];render();return}
  if(d.down!==undefined){const i=+d.down,a=S.camp.tps;[a[i+1],a[i]]=[a[i],a[i+1]];render();return}
  if(d.tprm!==undefined){S.camp.tps.splice(+d.tprm,1);render();return}
  if(d.tpadd){fly(b,'#stk-brief');await wait(300);S.camp.tps.push(d.tpadd);S.fresh.push('tp'+d.tpadd);render();return}
  if(d.ctab){S.page='context';S.ctab=d.ctab;render();return}
  if(d.nav){if(d.nav==='context'||d.nav==='campaigns'){S.page=d.nav;render()}else toast(b.textContent.trim()+' isn’t part of this prototype.');return}
  if(d.act==='hideguide'){S.guideHidden=true;render();toast('Hidden. It comes back if something needs you.');return}
  if(d.act==='captions'){S.captions=SAMPLE_CAPS;render();toast('Captions added. The voice now learns from 3 of your posts.');return}
  if(d.act==='drafts'){S.ff='Drafts';S.ctab='who';render();return}
  if(d.check){const f=S.facts.find(x=>x.id===d.check);f.st='kept';S.checkedDrafts=true;render();toast('Kept. The AI can use it after your next publish.');return}
  if(d.act==='runtest'){S.tested=true;S.page='context';S.ctab='test';render();toast(`Full test: ${exCount()} of ${exCount()} examples behave.`);return}
  if(d.fg){S.ff=d.fg;render();return}
  if(d.act==='addfact'){toast('Adding a fact opens a short form. Not in this prototype.');return}
  if(d.learn){const l=LEARN.find(x=>x.id===d.learn);S.learnDone.push(l.id);if(l.q){render();toast('Added to Who we are as a draft fact. Check it and publish to make it live.')}else{toConsole('campaigns')}return}
  if(d.ldis){S.learnDone.push(d.ldis);render();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='caps')S.captions=e.target.value;
  if(e.target.id==='fq'){S.fq=e.target.value;render('fq')}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='guard'){const v=$('#newGuard').value.trim();if(!v){toast('Type the guardrail first.');return}fly(e.target,'#stk-guard');const id='R-'+(15+S.guards.length);S.guards.push({id,t:v,sh:v.length>26?v.slice(0,24)+'…':v,src:'You added it',found:true,coach:['Won’t say it, and warns',''],ask:['Won’t say it',''],sev:'fail',on:true});S.fresh.push(id);render('newGuard')}
  if(f==='try'){
    const v=$('#tryq').value.trim();if(!v||S.busy)return;const tab=S.tryTab;
    const m={q:v,pending:true};S.log[tab].push(m);S.busy=true;S.hl=[];render();
    await wait(750);Object.assign(m,reply(tab,v),{pending:false});S.busy=false;S.hl=m.used.slice();render('tryq');
  }
});
const theme=()=>document.documentElement.getAttribute('data-theme')==='dark';
$('#pMenu').onclick=()=>{const o=$('.proto').classList.toggle('open');$('#pMenu').setAttribute('aria-expanded',String(o))};
$('#pRestart').onclick=()=>{S=fresh();lastKey='';$('#pWeek').setAttribute('aria-pressed','false');render()};
$('#pSkip').onclick=()=>{if(!S.files.length)S.files=FILES.slice(0,3);if(!S.guards)buildGuards();S.guards.forEach(g=>{if(g.found)g.on=true});if(!S.credit)S.credit='50';S.facts.forEach(f=>{if(f.st==='new')f.st='kept'});S.voiceSet=true;S.published=true;toConsole()};
$('#pWeek').onclick=()=>{S.week=!S.week;$('#pWeek').setAttribute('aria-pressed',String(S.week));render();toast(S.week?'Showing a week of activity.':'Back to day one.')};
$('#pTheme').onclick=()=>{document.documentElement.setAttribute('data-theme',theme()?'light':'dark');$('#pTheme').textContent=theme()?'Light':'Dark'};
if(!document.documentElement.getAttribute('data-theme'))document.documentElement.setAttribute('data-theme','light');
$('#pTheme').textContent=theme()?'Light':'Dark';
render();
})();
</script>
</body>
</html>
