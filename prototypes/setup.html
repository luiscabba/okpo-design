<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkPo Brand Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: two modes. Setup and campaign briefing are a full-screen single column, one question per screen.
   The console is the real console's sidebar plus tabs, organized by what each part does. Light first; dark only when chosen. */
:root{
  --ground:#f6f1e4; --tone:#ebe2cc; --ink:#121212; --body:#4a4640; --mute:#6a655c;
  --line:rgba(18,18,18,.12); --line2:rgba(18,18,18,.07); --soft:rgba(18,18,18,.05); --field:#ffffff;
  --glass-a:rgba(255,255,255,.7); --glass-b:rgba(255,255,255,.5); --glass-edge:rgba(255,255,255,.95);
  --glass-strong:rgba(255,255,255,.88); --shadow:0 16px 36px rgba(18,18,18,.10);
  --btn:#121212; --on-btn:#f6f1e4;
  --coral:#ff8787; --yellow:#ffd43b; --orange:#ffa94d; --green:#69db7c; --blue:#74c0fc; --purple:#b197fc;
  --l-coral:#c92a2a; --l-green:#237a36; --l-yellow:#9c6500; --l-purple:#6741d9;
  --ok-bg:rgba(105,219,124,.24); --fix-bg:rgba(255,135,135,.2); --k-bg:rgba(177,151,252,.2); --tp-bg:rgba(255,212,59,.3); --c-bg:rgba(105,219,124,.2);
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --text:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a;
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.07); --soft:rgba(255,255,255,.06); --field:#1a1a1a;
  --glass-a:rgba(40,40,40,.72); --glass-b:rgba(22,22,22,.62); --glass-edge:rgba(255,255,255,.16);
  --glass-strong:rgba(32,32,32,.92); --shadow:0 16px 36px rgba(0,0,0,.5);
  --btn:#ececec; --on-btn:#121212;
  --l-coral:#ff8787; --l-green:#69db7c; --l-yellow:#ffd43b; --l-purple:#b197fc;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute;fill:var(--tone)}
#app{position:relative;z-index:1;min-height:100%}
.label{font:600 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.sub{color:var(--body)} .small{font-size:13px;color:var(--mute)} .num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0}
.wm{font:800 24px/1 var(--display);letter-spacing:-.035em;display:inline-flex}
.wm span:nth-child(1){color:var(--coral)}.wm span:nth-child(2){color:var(--yellow)}.wm span:nth-child(3){color:var(--green)}.wm span:nth-child(4){color:var(--blue)}
.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),var(--shadow);border-radius:20px}
.glass.strong{background:var(--glass-strong)}
.btn{border:0;border-radius:14px;padding:13px 22px;min-height:48px;font-weight:600;font-size:15px;background:var(--btn);color:var(--on-btn);transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn.sm{min-height:44px;padding:10px 16px;font-size:14px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 14px;min-height:44px;font-weight:500;font-size:14px}
.ghost:hover{background:var(--soft)}
.link{border:0;background:none;padding:10px 0;min-height:44px;color:var(--mute);text-decoration:underline;font-size:14px}
.link:hover{color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;min-height:38px;font-size:13.5px;color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.rid{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border-radius:6px;background:var(--soft);color:var(--body);white-space:nowrap}
.rid.k{background:var(--k-bg);color:var(--l-purple)} .rid.tp{background:var(--tp-bg);color:var(--l-yellow)} .rid.c{background:var(--c-bg);color:var(--l-green)}
.chip{display:inline-flex;align-items:center;padding:5px 10px;border-radius:99px;font:600 10.5px/1 var(--mono);letter-spacing:.07em;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--l-green)} .chip.fix,.chip.fail{background:var(--fix-bg);color:var(--l-coral)} .chip.n{background:var(--soft);color:var(--body)}
.tick{color:var(--l-green);font-weight:700}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--field);padding:12px 14px;min-height:46px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:120px;line-height:1.5}

/* ---------- guided mode ---------- */
.g{min-height:100vh;display:flex;flex-direction:column}
.gtop{display:flex;align-items:center;gap:24px;padding:20px 28px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.prog{flex:1;max-width:620px;margin:0 auto;display:flex;gap:8px}
.prog span{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute);min-width:0}
.prog span.on{color:var(--ink);font-weight:600}
.prog i{display:block;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.prog i b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s var(--ease)}
.prog em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmain{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 16px 96px}
.gcol{width:min(640px,100%);margin:0 auto;display:flex;flex-direction:column;gap:24px}
.gcol h1{margin:0;font:800 clamp(32px,4.6vw,44px)/1.03 var(--display);letter-spacing:-.035em;text-wrap:balance}
.gcol .lead{margin:0;font-size:17px;color:var(--body);max-width:56ch}
.gq{display:flex;flex-direction:column;gap:10px}
.gnav{display:flex;align-items:center;gap:16px;padding-top:6px;flex-wrap:wrap}
.lines>*+*{border-top:1px solid var(--line)}
.lines{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.li{display:flex;align-items:center;gap:14px;padding:14px 0}
.li .t{font-size:16px} .li .s{font-size:13px;color:var(--mute);margin-top:2px}
.drop{border:1.5px dashed var(--line);border-radius:20px;padding:28px;text-align:center;background:var(--glass-b);width:100%}
.drop:hover{border-color:var(--ink)}
.doc{width:26px;height:32px;border-radius:5px;border:1.5px solid var(--line);background:var(--field);flex:none}
.webi{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);flex:none}
.choice{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--glass-b);border-radius:18px;padding:16px 20px;text-align:left;width:100%}
.choice[aria-checked="true"]{border:2px solid var(--ink);background:var(--glass-strong);padding:15px 19px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);flex:none}
.choice[aria-checked="true"] .radio{background:var(--ink);box-shadow:inset 0 0 0 4px var(--ground)}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;font-size:12px;line-height:1}
.box.on{background:var(--ink);color:var(--ground)}
.count{display:flex;align-items:center;gap:16px;padding:16px 0}
.count .n{font:800 28px/1 var(--display);min-width:44px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s linear}
.voice{border-radius:18px;padding:18px 20px}
.note{display:flex;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--body)}
.bub{border-radius:16px;padding:10px 13px;font-size:14.5px;line-height:1.45;max-width:88%}
.bub.me{background:var(--btn);color:var(--on-btn);align-self:flex-end;border-bottom-right-radius:6px}
.bub.ai{background:var(--glass-strong);border:1px solid var(--line2);align-self:flex-start;border-bottom-left-radius:6px}
.used{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:330px;overflow-y:auto;padding-right:2px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px 12px;font-size:13.5px;align-items:start}
.layers{display:flex;flex-direction:column;gap:10px}
.layer{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px}
.layer.next{border:1.5px dashed var(--line);background:transparent}
.sum{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 16px;padding:16px 0}
.tpl{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.tpl .nm{flex:1 1 220px;font-size:16px;font-weight:500;min-width:0}
.tpl .ctl{display:flex;align-items:center;gap:8px}
.mv{border:1px solid var(--line);background:transparent;border-radius:10px;width:44px;height:44px;display:grid;place-items:center;color:var(--body);font-size:16px}
.mv[disabled]{opacity:.3;cursor:default}
.share{width:96px;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;flex:none}
.share b{position:absolute;left:0;top:0;bottom:0;background:var(--green)}

/* ---------- console ---------- */
.c{display:flex;min-height:100vh}
.side{width:236px;flex:none;padding:22px 14px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line2);background:var(--glass-b)}
.side .wm{margin:0 10px 20px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;min-height:44px;border-radius:12px;border:0;background:transparent;color:var(--body);font-weight:500;text-align:left;width:100%}
.nav[aria-current="page"]{color:var(--ink);font-weight:600}
.nav[data-nav="campaigns"][aria-current="page"]{background:color-mix(in srgb,var(--green) 24%,transparent)}
.nav[data-nav="context"][aria-current="page"]{background:color-mix(in srgb,var(--purple) 24%,transparent)}
.cmain{flex:1;min-width:0;padding:28px 36px 96px;display:flex;flex-direction:column;gap:18px;max-width:1240px}
.ctabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft);overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
.ctabs button{border:0;background:transparent;border-radius:9px;padding:8px 14px;min-height:40px;font-size:14px;color:var(--body);white-space:nowrap}
.ctabs button[aria-selected="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sec{padding:20px;display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--glass-edge);width:100%;transition:transform .15s var(--ease)}
.sec:hover{transform:translateY(-1px)}
.big{font:800 34px/1 var(--display);letter-spacing:-.03em}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font:600 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:top}
td .s{font-size:12.5px;color:var(--mute)}
tr.grp td{padding:16px 12px 6px;border-bottom:0}
.src{font:500 11.5px var(--mono);color:var(--mute);white-space:nowrap}
.dash{color:var(--mute)}
.fl{display:flex;flex-direction:column;gap:2px}
.fl button{border:0;background:transparent;border-radius:10px;padding:10px;min-height:44px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--body);text-align:left}
.fl button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600}
.guide{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.gitems{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--glass-strong);border-radius:14px;padding:12px 14px;border:1px solid var(--line2)}
.circ{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mute);flex:none;display:grid;place-items:center;font-size:11px}
.circ.done{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.empty{padding:28px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:16px;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-edge);color:var(--ink);font-weight:500;box-shadow:var(--shadow);animation:up .3s var(--ease);max-width:calc(100% - 32px)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.proto{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:#121212;color:#f6f1e4;font:600 11.5px var(--mono);max-width:calc(100% - 24px)}
.proto button{border:0;background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font:inherit}
.proto button:hover,.proto button[aria-pressed="true"]{background:rgba(255,255,255,.14)}
.pitems{display:flex;flex-wrap:wrap;gap:4px}
#pMenu{opacity:.65}
@media (max-width:900px){
  .c{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line2);align-items:center}
  .side .wm{margin:0 12px 0 0}.side .foot{display:none}.nav{width:auto;white-space:nowrap}
  .cmain{padding:20px 16px 110px}
  .cards3{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr)!important}
}
@media (max-width:600px){
  .gtop{padding:14px 16px;gap:12px}.prog em{display:none}
  .gmain{justify-content:flex-start;padding-top:28px;padding-bottom:120px}
  .seg button{min-height:44px}
  .ex{grid-template-columns:auto minmax(0,1fr)}.ex .pf{grid-column:2}
  .sum{grid-template-columns:minmax(0,1fr)}
  .pitems{display:none}.proto.open .pitems{display:flex}#pMenu{opacity:1}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg width="520" height="520" viewBox="0 0 100 100" style="left:-140px;top:-140px"><path d="M0 0 A100 100 0 0 1 100 100 L0 100 Z" transform="rotate(180 50 50)"></path></svg>
  <svg width="380" height="380" viewBox="0 0 100 100" style="right:-90px;top:30%"><path d="M50 0 A25 25 0 0 1 50 50 A25 25 0 0 1 0 50 A25 25 0 0 1 50 0 Z M50 50 A25 25 0 0 1 100 50 A25 25 0 0 1 50 100 A25 25 0 0 1 50 50 Z"></path></svg>
  <svg width="440" height="440" viewBox="0 0 100 100" style="left:36%;bottom:-250px"><path d="M0 64 A50 50 0 0 1 100 64 Z"></path></svg>
</div>
<div id="app"></div>
<div class="proto" role="toolbar" aria-label="Prototype controls"><button type="button" id="pMenu" aria-expanded="false">Prototype</button><span class="pitems"><button type="button" id="pRestart">Restart</button><button type="button" id="pSkip">Skip to console</button><button type="button" id="pWeek" aria-pressed="false">Simulate a week</button><button type="button" id="pTheme">Dark</button></span></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* tiles: the console's own shapes. Idle = outline in mute, active = filled glaze. */
const P={frame:'<path d="M0 0H100V100H0Z M27 27V73H73V27Z" fill-rule="evenodd" fill="C"/>',quarter:'<path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="C"/>',diamond:'<path d="M50 0L100 50L50 100L0 50Z M50 28L72 50L50 72L28 50Z" fill-rule="evenodd" fill="C"/>',half:'<path d="M0 100 A50 50 0 0 1 100 100 Z" fill="C"/><rect width="100" height="22" fill="C"/>',pin:'<path d="M0 0 L50 0 L50 50 Z M100 0 L100 50 L50 50 Z M100 100 L50 100 L50 50 Z M0 100 L0 50 L50 50 Z" fill="C"/>',petal:'<path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z" fill="C"/>'};
const COL={frame:'var(--coral)',quarter:'var(--green)',diamond:'var(--orange)',half:'var(--yellow)',petal:'var(--purple)',pin:'var(--blue)'};
function tile(k,s=16,outline){let b=P[k];b=outline?b.replace(/fill="C"/g,`style="fill:none;stroke:${outline};stroke-width:9"`).replace(/fill-rule="evenodd" /g,''):b.replace(/fill="C"/g,`style="fill:${COL[k]}"`);return `<svg width="${s}" height="${s}" viewBox="-5 -5 110 110" aria-hidden="true" style="flex:none;display:block">${b}</svg>`}
const rid=(t,c='')=>`<span class="rid ${c}">${esc(t)}</span>`;
const kind=u=>/^K\d|^Voice$/.test(u)?'k':'';

const FACTS=[
 {id:'K1',t:'Free to download and sign up.',src:'gcash.com/register',g:'Sign-up',used:312},
 {id:'K3',t:'Sign-up needs one valid ID and takes about 5 minutes.',src:'gcash.com/help',g:'Sign-up',used:204},
 {id:'K2',t:'Verification is usually done the same day.',src:'gcash.com/help',g:'Sign-up',used:30},
 {id:'K4',t:'Send money to any Philippine bank.',src:'gcash.com/send',g:'Products',used:88},
 {id:'K5',t:'Pay bills to over 1,000 billers in the app.',src:'gcash.com/bills',g:'Products',used:23},
 {id:'K12',t:'Cash in at 7-Eleven and other partners.',src:'gcash.com',g:'Products',used:19},
 {id:'K6',t:'Save in GSave with no minimum balance.',src:'Brand book, p.14',g:'Products',used:15},
 {id:'K7',t:'Most customers are 18 to 35, many unbanked.',src:'Brand book, p.8',g:'Audience',used:41},
 {id:'K8',t:'Many send money home to family in the provinces.',src:'Brand book, p.9',g:'Audience',used:12},
];
const GUARDS=[
 {id:'R-03',t:'Never promise approval, loan amounts or dates.',src:'Compliance memo, p.2',memo:true,coach:['Won’t say it, and warns','Gives a safe line instead'],ask:['Won’t say it','Hands off if pressed'],pass:'“Libre mag-join, mga 5 minuto.”',fail:'“Sure approved ka dito!”'},
 {id:'R-04',t:'Never compare fees with other wallets.',src:'Brand book, p.31',coach:['Won’t say it, and warns',''],ask:['Won’t say it',''],pass:'“Libre magpadala sa GCash.”',fail:'“Mas mura kami kaysa sa ibang wallet.”'},
 {id:'R-09',t:'Never lead with loans or credit.',src:'Compliance memo, p.3',memo:true,coach:['Steers away',''],ask:['Won’t bring it up',''],pass:'Opens on sending money home.',fail:'Opens on “Need cash? GCredit!”'},
 {id:'R-10',t:'One campaign per post.',src:'Compliance memo, p.4',memo:true,coach:['Reminds',''],ask:null,pass:'One campaign in the post.',fail:'Mentions Heroes and Ipon in one post.'},
];
const OKPO=[
 {id:'R-01',t:'Turn on Paid partnership',coach:['Reminds','On every mission'],ask:null,sev:'fix',pass:'Paid partnership label on.',fail:'Label off.'},
 {id:'R-02',t:'Say it’s paid, in words or with the label',coach:['Reminds',''],ask:null,sev:'fail',pass:'Says “paid partnership”.',fail:'Never says it’s paid.'},
 {id:'R-11',t:'Use your own tracked link',coach:['Hands out the link',''],ask:['Offers that creator’s link',''],sev:'fail',pass:'Uses the creator’s own link.',fail:'Sends people to gcash.com.'},
 {id:'R-14',t:'No minors on camera',coach:['Reminds','When filming'],ask:null,sev:'fail',pass:'Adults only on camera.',fail:'A child appears on camera.'},
];

function toast(t){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2800)}
const hasMemo=()=>S.files.some(f=>f.memo);
const activeG=()=>(S.guards||[]).filter(g=>g.on);

const voiceLine=()=>S.line!==null?S.line:(S.traits.includes('Playful')?LINE_P:LINE);
function buildGuards(){S.guards=GUARDS.map(g=>{const found=!g.memo||hasMemo();return {...g,on:found,found,sev:'fail',src:found?g.src:'Common for finance brands'}})}

/* ---------------- guided setup ---------------- */
const SECT=['Your material','Who we are','Guardrails','Go live'];
// step -> [section, fill%]  steps: 0 welcome,1 material,2 captions,3 reading,4 facts,5 question,6 voice,7 guardrails,8 try,9 review,10 done
const MAP={1:[0,34],2:[0,67],3:[0,100],4:[1,34],5:[1,67],6:[1,100],7:[2,100],8:[3,50],9:[3,100]};
function gtop(sections,cur,fill,exit=true){
  const prog=sections.map((s,i)=>{const w=i<cur?100:i===cur?fill:0;return `<span class="${i===cur?'on':''}"><i><b style="width:${w}%"></b></i><em>${s}</em></span>`}).join('');
  return `<header class="gtop"><span class="wm" aria-label="OkPo"><span>O</span><span>k</span><span>P</span><span>o</span></span><div class="prog" aria-label="Progress">${prog}</div>${exit?'<button type="button" class="link" data-act="saveexit">Save and exit</button>':'<span style="width:90px"></span>'}</header>`;
}
const gpage=(top,inner,nav)=>`<div class="g">${top}<main class="gmain"><div class="gcol">${inner}${nav}</div></main></div>`;
function gnav({back=true,primary='Continue',disabled=false,skip=''}={}){
  return `<div class="gnav">${back?'<button type="button" class="ghost" data-act="back">Back</button>':''}<span class="grow"></span>${skip?`<button type="button" class="link" data-act="skip">${skip}</button>`:''}<button type="button" class="btn" data-act="next" ${disabled?'disabled':''}>${primary}</button></div>`;
}
const head=(k,h,lead)=>`<div class="gq"><span class="label">${k}</span><h1>${h}</h1>${lead?`<p class="lead">${lead}</p>`:''}</div>`;

function setupScreen(){
  const st=S.step,m=MAP[st]||[0,0],top=gtop(SECT,st===0?0:m[0],st===0?0:m[1]);

   `<div class="lines"><div class="li"><b class="disp" style="font-size:22px;width:26px">1</b><span class="grow"><div class="t"><b>Who we are</b></div><div class="s">What’s true about GCash, and how you sound</div></span></div><div class="li"><b class="disp" style="font-size:22px;width:26px">2</b><span class="grow"><div class="t"><b>Guardrails</b></div><div class="s">What can never happen in a post</div></span></div></div>
   <p class="small" style="margin:-8px 0 0">Each campaign adds its own brief on top of these two. You’ll write it when you start a campaign.</p>`,gnav({back:false,primary:'Start'}));

    return gpage(top,head('Your material','Add what you already have.','Your website and brand book are enough to start. A compliance document helps us find your guardrails.')+
     `<button type="button" class="drop" data-act="addfile"><b style="font-size:16px">Drop files here, or paste a link</b><span class="small" style="display:block;margin-top:4px">PDF, slides, docs, a web address · tap to add a sample</span></button>${list?`<div class="lines">${list}</div>`:''}`,
     gnav({primary:'Continue',disabled:!S.files.length}));
  }
  if(st===2) return gpage(top,head('Your material · optional','Paste a few captions GCash likes.','Three or more posts in your own words. OkPo learns how GCash sounds from them.')+
     `<div style="display:flex;flex-direction:column;gap:8px"><label for="caps" class="label">Captions</label><textarea id="caps" placeholder="One caption per paragraph">${esc(S.captions)}</textarea><button type="button" class="link" data-act="samplecaps" style="align-self:flex-start">Use sample captions</button></div>`,
     gnav({primary:'Read them',skip:'Skip for now'}));
  if(st===3){
    const r=S.read,bad=S.files.filter(f=>f.bad),gN=(S.guards||[]).filter(g=>g.found).length;

    const done=r>=100;
    return gpage(top,head('Your material',done?'Done. Here’s what we found.':'Reading your material…',done?'Next, you’ll check each part.':'OkPo files every line by the question it answers.')+
     `<div class="bar" role="progressbar" aria-label="Reading" aria-valuenow="${r}" aria-valuemin="0" aria-valuemax="100"><b style="width:${r}%"></b></div>
     <div class="lines">${c('Who we are',FACTS.length,'facts',60)}${c('Guardrails',gN,'found',80)}${c('Saved for your first campaign',SAVED_TPS.length,'talking points',100)}</div>
     ${done&&bad.length?`<div class="note"><span class="grow"><b>We couldn’t read ${esc(bad[0].n)}.</b> It looks like a scanned image. Paste its text instead, or carry on without it.</span></div>`:''}
     ${done&&!hasMemo()?`<div class="note"><span class="grow"><b>No compliance document.</b> We’ll suggest common guardrails for finance brands, and you pick the ones that apply.</span></div>`:''}
     ${done?'':'<p class="small" style="margin:0">Big files can take a few minutes. You can leave this page; we’ll email you when it’s ready.</p>'}`,
     gnav({primary:'Continue',disabled:!done}));
  }
  if(st===4){
    const pages=Math.ceil(S.facts.length/PAGE),p=S.fpage,fs=S.facts.slice(p*PAGE,p*PAGE+PAGE),checked=Math.min(S.facts.length,(p+1)*PAGE);
    const rows=fs.map(f=>`<div class="li"><span class="grow">${f.editing?`<label for="f-${f.id}" class="label">Fix this fact</label><input type="text" id="f-${f.id}" value="${esc(f.t)}">`:`<div class="t">${esc(f.t)}</div>`}<div class="s">From ${esc(f.src)}</div></span>${f.editing?`<button type="button" class="ghost" data-fsave="${f.id}">Save</button>`:`<span class="seg" role="group" aria-label="Keep or fix"><button type="button" data-fk="${f.id}" aria-pressed="true">Keep</button><button type="button" data-ff="${f.id}" aria-pressed="false">Fix</button></span>`}</div>`).join('');
    const last=p===pages-1;
    return gpage(top,head(`Who we are · 1 of 3 · ${checked} of ${S.facts.length} checked`,'Is this true about GCash?','Keep what’s right, fix what isn’t. The AI only says what you’ve checked.')+
     `<div class="lines">${rows}</div>`,
     gnav({primary:last?'Looks right':'Looks right, next '+Math.min(PAGE,S.facts.length-(p+1)*PAGE),skip:last?'':'Check the rest later'}));
  }
  if(st===5){
    const ch=(v,big,d)=>`<button type="button" class="choice" role="radio" aria-checked="${S.credit===v}" data-credit="${v}"><span class="radio"></span><span class="grow"><b class="disp" style="font-size:24px">${big}</b><span class="small" style="display:block">${d}</span></span></button>`;
    return gpage(top,head('Who we are · 2 of 3 · one question','Your website and your deck disagree.','Which welcome credit is right today?')+
     `<div role="radiogroup" aria-label="Welcome credit" style="display:flex;flex-direction:column;gap:10px">${ch('50','₱50','gcash.com, promos page')}${ch('100','₱100','GCash Heroes deck, slide 6')}${ch('none','Neither','The offer has ended')}</div>`,gnav({disabled:!S.credit}));

  if(st===6){

      :`<div class="row" style="flex-wrap:wrap;gap:6px">${S.traits.map(t=>rid(t,'k')).join('')}</div>`;
    const card=adj?`<div class="voice glass strong" style="border:2px solid var(--ink);display:flex;flex-direction:column;gap:8px"><label for="vline" class="label">GCash · rewrite this line your way</label><textarea id="vline" style="min-height:90px;font:800 22px/1.2 var(--display);letter-spacing:-.02em">${esc(voiceLine())}</textarea></div>`
      :`<div class="voice glass strong" style="border:2px solid var(--ink)"><span class="label">GCash</span><p class="disp" style="margin:8px 0 0;font-size:clamp(21px,3vw,26px);line-height:1.15">${esc(voiceLine())}</p></div>`;
    return gpage(top,head('Who we are · 3 of 3',adj?'Make it sound like GCash.':'Does this sound like GCash?',adj?'Pick the traits that fit and rewrite the line. OkPo learns from both.':S.captions.trim()?'Learned from your captions, website and brand book.':'Learned from your website and brand book. Captions would sharpen it.')+
     `<div style="display:flex;flex-direction:column;gap:12px"><div class="voice" style="background:var(--soft)"><span class="label">Plain</span><p style="margin:8px 0 0;font-size:17px">Sign up for GCash today and enjoy fast, secure transfers!</p></div>${card}${chips}</div>`,
     adj?gnav({primary:'Use this voice'}):gnav({primary:'Yes, that’s us',skip:'Adjust'}));
  }
  if(st===7){
    const memo=hasMemo();
    const rows=S.guards.map((g,i)=>`<button type="button" class="li" style="width:100%;border:0;background:transparent;text-align:left" role="checkbox" aria-checked="${g.on}" data-g="${i}"><span class="box ${g.on?'on':''}">${g.on?'✓':''}</span><span class="grow"><div class="t">${esc(g.t)}</div><div class="s">${esc(g.src)}</div></span></button>`).join('');
    return gpage(top,head('Guardrails','What should stop a post?',memo?'Only things that are never OK. We found these in your compliance memo and brand book.':'We didn’t find a compliance document, so these are common for finance brands. Tick the ones that apply.')+
     `<div class="lines">${rows}<form class="li" data-form="guard"><label for="newGuard" class="label" style="position:absolute;left:-9999px">Add a guardrail</label><input type="text" id="newGuard" placeholder="Add one, e.g. Never show another wallet’s app"><button type="submit" class="ghost">Add</button></form></div>
     <div class="note"><span class="grow">Each one stops a post from counting. You can soften one to “needs a fix” later, in the console. OkPo also adds 4 for every brand: the paid label, saying it’s paid, the creator’s own link, and no minors on camera.</span></div>`,
     gnav({primary:'Continue',disabled:!activeG().length}));
  }
  if(st===8) return gpage(top,head('Go live · try it','Try it before it goes live.','Ask anything a creator or a follower might, or paste a post.')+tryPanel(),gnav({primary:'Review and publish'}));
  if(st===9){
    const kept=S.facts.filter(f=>f.st!=='draft').length,dr=drafts().length;
    const sum=(k,v,s)=>`<div class="sum"><span class="label" style="padding-top:3px">${k}</span><span><b style="font-size:16px">${v}</b>${s?`<span class="small" style="display:block">${s}</span>`:''}</span></div>`;
    return gpage(top,head('Go live · review','Ready to go live?','This is what the AI will say and enforce for every GCash campaign. You can change any of it later.')+
     `<div class="lines">${sum('Who we are',kept+' facts checked',(dr?dr+' more saved as drafts. The AI won’t use them until someone checks them. ':'')+'Welcome credit: '+(S.credit==='none'?'none right now':'₱'+S.credit)+'.')}${sum('Voice',S.traits.join(', '),'“'+esc(voiceLine())+'”')}${sum('Guardrails',activeG().length+' from GCash, 4 from OkPo','Each one stops a post from counting.')}${sum('Test',exCount()+' of '+exCount()+' examples behave','A pass and a fail for every guardrail.')}</div>`,
     gnav({primary:'Approve and publish'}));
  }
  if(st===10){
    return gpage(gtop(SECT,4,100,false),`<div class="gq"><span class="label">GCash is live · version 1</span><h1>Your AI now knows GCash.</h1><p class="lead">One more layer comes with each campaign: a brief that says what creators talk about.</p></div>

function exitedScreen(){
  const where=S.step<=3?'Your material':S.step<=6?'Who we are':S.step===7?'Guardrails':'Go live';

/* ---------------- try it ---------------- */
function reply(tab,q){
  const s=q.toLowerCase(),cr=S.credit;
  if(tab==='post'){
    const res=[];
    const g=id=>activeG().some(x=>x.id===id);
    if(g('R-03')&&/sure|approv|guarantee/.test(s))res.push(['fail','Promises approval','R-03']);
    if(g('R-04')&&/mas mura|cheaper|kaysa/.test(s))res.push(['fail','Compares fees with another wallet','R-04']);
    if(g('R-09')&&/loan|gcredit|utang/.test(s))res.push(['fail','Leads with credit','R-09']);
    if(/₱?100/.test(s)&&cr!=='100')res.push(['fix','Says ₱100 welcome credit. GCash confirmed '+(cr==='none'?'there is none now':'₱'+cr),'K9']);
    const brief=S.camps[0];
    if(brief&&/website/.test(s))res.push(['fix','Ends on the website, not the app sign-up','Brief · Ends on']);
    const verdict=res.some(r=>r[0]==='fail')?'FAIL':res.length?'NEEDS A FIX':'PASSES';
    const body=res.length?res.map(r=>`<div class="row" style="font-size:14px"><span class="chip ${r[0]}">${r[0]==='fail'?'FAIL':'FIX'}</span><span class="grow">${esc(r[1])}</span>${rid(r[2],kind(r[2]))}</div>`).join(''):`<div class="small">All ${activeG().length+4} guardrails pass, and every claim matches a fact.</div>`;
    return {t:`<div class="row"><b class="grow">Verdict</b><span class="chip ${verdict==='PASSES'?'ok':'fail'}">${verdict}</span></div>${body}${brief?'':'<div class="small">No campaign brief yet, so only facts and guardrails were checked.</div>'}`,used:res.length?res.map(r=>r[2]):['Guardrails','Facts'],html:true};
  }
  const cre=tab==='creator';
  if(/sure|approv|guarantee/.test(s))return{t:cre?'Hindi po, bawal yan. Sabihin mo na lang: libre mag-join, mga 5 minuto lang.':'Hindi ko po masasabi yan. Libre mag-join, at makikita mo sa app kung ano ang para sa’yo.',used:['R-03','K1','Voice']};
  if(/loan|gcredit|utang/.test(s))return{t:cre?'Iwas muna tayo sa loans sa posts. Mag-lead tayo sa pagpapadala o pagbabayad ng bills.':'Para sa credit, makikita mo po ang options sa app pagka-verify. Libre mag-join.',used:['R-09','K1']};
  if(/credit|welcome|50|100|promo/.test(s))return{t:cr==='none'?'Wala na pong welcome credit ngayon. Libre pa rin mag-join.':'Opo, ₱'+(cr||'50')+' para sa bagong verified users, hanggang 31 Oct.',used:['K9','Voice']};
  if(/id|requirement|kailangan/.test(s))return{t:'Isang valid ID lang po, mga 5 minuto. Kadalasan same day ang verification.',used:['K3','K2']};
  if(/magkano|bayad|fee|libre|free|cost/.test(s))return{t:'Libre po ang pag-join. Isang valid ID lang, mga 5 minuto.',used:['K1','K3','Voice']};
  if(/mas mura|cheaper|maya|other wallet/.test(s))return{t:cre?'Hindi tayo nagko-compare sa ibang wallets. Ipakita mo na lang kung gaano kadali magpadala.':'Hindi ko po masasabi yan. Pero puwede magpadala sa any bank sa GCash.',used:['R-04','K4']};
  if(/padala|send|bank|nanay/.test(s))return{t:'Puwede pong magpadala sa kahit anong bangko sa Pilipinas, diretso sa app.',used:['K4','Voice']};
  return{t:'Magandang tanong po. Ipapasa ko ito sa GCash team para masagot nang tama.',used:['Voice','Logged to Learn']};
}
const SAMPLE={creator:'Pwede ko bang sabihin na sure approved sila?',follower:'Magkano mag-join? Ano kailangan?',post:'Libre lang mag-join! Sure approved ka dito. Check niyo yung website.'};

const CSECT=['Campaign','Talking points','How it ends'];
function campScreen(){

  if(st===0){
    const ob=(v,t,d)=>`<button type="button" class="choice" role="radio" aria-checked="${c.obj===v}" data-obj="${v}"><span class="radio"></span><span class="grow"><b style="font-size:16px">${t}</b><span class="small" style="display:block">${d}</span></span></button>`;
    return gpage(top,head('New campaign','What’s this campaign for?','Name it and pick what counts as a win.')+
     `<div style="display:flex;flex-direction:column;gap:8px"><label for="cname" class="label">Campaign name</label><input type="text" id="cname" value="${esc(c.name)}"></div>
     <div role="radiogroup" aria-label="Goal" style="display:flex;flex-direction:column;gap:8px">${ob('signup','New verified sign-ups','A follower downloads GCash and finishes sign-up')}${ob('deposit','First deposits','A follower makes a first deposit into GSave')}${ob('bills','First bill payment','A follower pays a first bill in the app')}</div>${layerline}`,
     gnav({primary:'Continue'}));
  }

/* ---------------- render and events ---------------- */
function render(focus){
  $('#app').innerHTML=S.mode==='setup'?setupScreen():S.mode==='exited'?exitedScreen():S.mode==='campaign'?campScreen():consoleScreen();
  const ch=$('#chat');if(ch)ch.scrollTop=ch.scrollHeight;
  if(focus){const el=document.getElementById(focus);if(el){el.focus();if(el.setSelectionRange)el.setSelectionRange(el.value.length,el.value.length)}}
}
function readAnim(){
  buildGuards();S.read=0;render();
  if(RM){S.read=100;render();return}
  const tick=()=>{if(S.mode!=='setup'||S.step!==3)return;S.read=Math.min(100,S.read+4);render();if(S.read<100)setTimeout(tick,60)};setTimeout(tick,200);
}
function go(step){S.step=step;window.scrollTo(0,0);if(step===3)readAnim();else render()}
function startCamp(){S.camp={name:S.camps.length?'GCash Ipon Challenge':'GCash Heroes',obj:S.camps.length?'deposit':'signup',tps:SAVED_TPS.slice(0,3),ends:'app',tags:S.camps.length?'#IponChallenge':'#GCashHeroes'};S.cstep=0;S.mode='campaign';window.scrollTo(0,0);render()}
const toConsole=(page='context',tab='overview')=>{S.mode='console';S.page=page;S.ctab=tab;window.scrollTo(0,0);render()};

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.closest('.proto'))return;const d=b.dataset;
  if(d.act==='next'){
    if(S.mode==='campaign'){
      if(S.cstep===0){const n=$('#cname');if(n)S.camp.name=n.value.trim()||S.camp.name}
      if(S.cstep===2){const t=$('#ctags');if(t)S.camp.tags=t.value;S.camps.push(S.camp);S.camp=null;toConsole('campaigns');toast('Brief saved. Rewards and pool are next, in the campaign.');return}
      S.cstep++;window.scrollTo(0,0);render();return}
    if(S.step===2){const c=$('#caps');if(c)S.captions=c.value}
    if(S.step===4){const pages=Math.ceil(S.facts.length/PAGE);S.facts.slice(S.fpage*PAGE,S.fpage*PAGE+PAGE).forEach(f=>{if(f.st==='new')f.st='kept'});if(S.fpage<pages-1){S.fpage++;window.scrollTo(0,0);render();return}}
    if(S.step===6&&S.voice==='adjust'){const v=$('#vline');if(v)S.line=v.value.trim()||null;S.voice='ok'}
    if(S.step===9){S.published=true;go(10);return}
    go(S.step+1);return}
  if(d.act==='back'){
    if(S.mode==='campaign'){if(S.cstep===0){S.camp=null;S.published?toConsole(S.page):(S.mode='setup',render())}else{S.cstep--;render()}return}
    if(S.step===6&&S.voice==='adjust'){S.voice=null;render();return}
    if(S.step===4&&S.fpage>0){S.fpage--;render();return}
    if(S.step===5){S.fpage=Math.ceil(S.facts.length/PAGE)-1}
    go(Math.max(0,S.step-1));return}
  if(d.act==='skip'){
    if(S.step===2){S.captions='';go(3)}
    else if(S.step===4){S.facts.forEach((f,i)=>{if(i<(S.fpage+1)*PAGE){if(f.st==='new')f.st='kept'}else f.st='draft'});toast(drafts().length+' facts saved as drafts. The AI won’t use them until you check them.');go(5)}
    else if(S.step===6){S.voice='adjust';render()}
    return}
  if(d.act==='saveexit'){S.mode='exited';render();return}
  if(d.act==='resume'){S.mode='setup';render();return}
  if(d.act==='addfile'){const f=FILES.find(a=>!S.files.some(x=>x.n===a.n));if(f){S.files.push(f);render()}else toast('All sample files added.');return}
  if(d.rm!==undefined){S.files.splice(+d.rm,1);render();return}
  if(d.act==='samplecaps'){S.captions=SAMPLE_CAPS;render('caps');return}
  if(d.fk){const f=S.facts.find(x=>x.id===d.fk);f.editing=false;render();return}
  if(d.ff){const f=S.facts.find(x=>x.id===d.ff);f.editing=true;render('f-'+f.id);return}
  if(d.fsave){const f=S.facts.find(x=>x.id===d.fsave);const v=$('#f-'+f.id).value.trim();if(v)f.t=v;f.editing=false;render();return}
  if(d.credit){S.credit=d.credit;render();return}
  if(d.trait){const v=$('#vline');if(v&&v.value.trim()!==voiceLine())S.line=v.value.trim();const t=d.trait;S.traits=S.traits.includes(t)?S.traits.filter(x=>x!==t):[...S.traits,t];render();return}
  if(d.g!==undefined){S.guards[+d.g].on=!S.guards[+d.g].on;render();return}
  if(d.tab){S.tryTab=d.tab;render();return}
  if(d.act==='toggleex'){S.showEx=!S.showEx;render();return}
  if(d.act==='newcamp'){startCamp();return}
  if(d.act==='toconsole'){toConsole();return}
  if(d.obj){S.camp.obj=d.obj;render();return}
  if(d.ends){S.camp.ends=d.ends;render();return}
  if(d.up!==undefined){const i=+d.up,a=S.camp.tps;[a[i-1],a[i]]=[a[i],a[i-1]];render();return}
  if(d.down!==undefined){const i=+d.down,a=S.camp.tps;[a[i+1],a[i]]=[a[i],a[i+1]];render();return}
  if(d.tprm!==undefined){S.camp.tps.splice(+d.tprm,1);render();return}
  if(d.tpadd){S.camp.tps.push(d.tpadd);render();return}
  if(d.ctab){S.page='context';S.ctab=d.ctab;render();return}
  if(d.nav){if(d.nav==='context'||d.nav==='campaigns'){S.page=d.nav;if(d.nav==='context')S.ctab=S.ctab||'overview';render()}else toast(b.textContent.trim()+' isn’t part of this prototype.');return}
  if(d.act==='hideguide'){S.guideHidden=true;render();toast('Hidden. It comes back if something needs you.');return}
  if(d.act==='captions'){S.captions=SAMPLE_CAPS;render();toast('Captions added. The voice now learns from 3 of your posts.');return}
  if(d.act==='drafts'){S.ff='Drafts';S.ctab='who';render();return}
  if(d.check){const f=S.facts.find(x=>x.id===d.check);f.st='kept';S.checkedDrafts=true;render();toast('Kept. The AI can use it after your next publish.');return}
  if(d.act==='runtest'){S.tested=true;S.page='context';S.ctab='test';render();toast(`Full test: ${exCount()} of ${exCount()} examples behave.`);return}
  if(d.fg){S.ff=d.fg;render();return}
  if(d.act==='addfact'){toast('Adding a fact opens a short form. Not in this prototype.');return}
  if(d.learn){const l=LEARN.find(x=>x.id===d.learn);S.learnDone.push(l.id);if(l.q){render();toast('Added to Who we are as a draft fact. Check it and publish to make it live.')}else{toConsole('campaigns')}return}
  if(d.ldis){S.learnDone.push(d.ldis);render();return}
});

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='guard'){const v=$('#newGuard').value.trim();if(!v){toast('Type the guardrail first.');return}S.guards.push({id:'R-'+(15+S.guards.length),t:v,src:'You added it',found:true,coach:['Won’t say it, and warns',''],ask:['Won’t say it',''],sev:'fail',on:true});render('newGuard');toast('Added. It stops a post from counting, like the others.')}
  if(f==='try'){const v=$('#tryq').value.trim();if(!v)return;const tab=S.tryTab;S.log[tab].push({q:v,...reply(tab,v)});render('tryq')}
});
const theme=()=>document.documentElement.getAttribute('data-theme')==='dark';
$('#pMenu').onclick=()=>{const o=$('.proto').classList.toggle('open');$('#pMenu').setAttribute('aria-expanded',String(o))};
$('#pRestart').onclick=()=>{S=fresh();$('#pWeek').setAttribute('aria-pressed','false');window.scrollTo(0,0);render()};
$('#pSkip').onclick=()=>{if(!S.files.length)S.files=FILES.slice(0,3);if(!S.guards)buildGuards();if(!S.credit)S.credit='50';S.facts.forEach(f=>{if(f.st==='new')f.st='kept'});S.published=true;toConsole()};
$('#pWeek').onclick=()=>{S.week=!S.week;$('#pWeek').setAttribute('aria-pressed',String(S.week));render();toast(S.week?'Showing a week of activity.':'Back to day one.')};
$('#pTheme').onclick=()=>{document.documentElement.setAttribute('data-theme',theme()?'light':'dark');$('#pTheme').textContent=theme()?'Light':'Dark'};
if(!document.documentElement.getAttribute('data-theme'))document.documentElement.setAttribute('data-theme','light');
$('#pTheme').textContent=theme()?'Light':'Dark';
render();
})();
</script>
</body>
</html>
