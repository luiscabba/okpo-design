<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OkPo Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: okpo.com's front door for people who aren't signed in. Three doors, open campaigns as casting-call cards, a directory of passed posts, and the Earn with OkPo page. Light first; product register (crisp, glass, ink buttons). */
:root{
  --ground:#f6f1e4; --tone:#ebe2cc; --ink:#121212; --body:#4a4640; --mute:#6a655c; --line:rgba(18,18,18,.12); --soft:rgba(18,18,18,.06);
  --glass-a:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.44); --glass-edge:rgba(255,255,255,.95); --glass-strong:rgba(255,255,255,.82); --glass-shadow:0 16px 36px rgba(18,18,18,.10);
  --coral:#ff8787; --yellow:#ffd43b; --orange:#ffa94d; --green:#69db7c; --blue:#74c0fc; --purple:#b197fc;
  --l-coral:#c92a2a; --l-yellow:#9c6500; --l-green:#237a36; --l-blue:#1971c2;
  --btn:#121212; --on-btn:#f6f1e4;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif; --text:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); color-scheme:light;
}
:root[data-theme="dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12); --soft:rgba(255,255,255,.07);
  --glass-a:rgba(40,40,40,.7); --glass-b:rgba(18,18,18,.6); --glass-edge:rgba(255,255,255,.18); --glass-strong:rgba(32,32,32,.88); --glass-shadow:0 16px 36px rgba(0,0,0,.5);
  --l-coral:#ff8787; --l-yellow:#ffd43b; --l-green:#69db7c; --l-blue:#74c0fc; --btn:#ececec; --on-btn:#121212; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--text);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 48px;min-height:100vh}
button,input{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--l-blue,#1971c2);outline-offset:2px;border-radius:8px}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.bg svg{position:absolute;fill:var(--tone)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),var(--glass-shadow);border-radius:20px}
.glass.strong{background:var(--glass-strong)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.spacer{flex:1}
.label{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.small{font-size:13px;color:var(--mute)}.sub{color:var(--body)}.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:800 clamp(40px,6vw,68px)/.98 var(--display);letter-spacing:-.04em}
h2{font:800 clamp(28px,3.4vw,38px)/1.04 var(--display);letter-spacing:-.03em}
p{margin:0}
.wm{font:800 1em/1 var(--display);letter-spacing:-.035em;display:inline-flex}
.wm span:nth-child(1){color:var(--coral)}.wm span:nth-child(2){color:var(--yellow)}.wm span:nth-child(3){color:var(--green)}.wm span:nth-child(4){color:var(--blue)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--btn);color:var(--on-btn);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.ghost:hover{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font:600 10.5px/1 var(--mono);letter-spacing:.06em;white-space:nowrap}
.chip.n{background:var(--soft);color:var(--body)}.chip.ok{background:rgba(105,219,124,.24);color:var(--l-green)}.chip.w{background:rgba(255,212,59,.3);color:var(--l-yellow)}.chip.inv{background:rgba(116,192,252,.24);color:var(--l-blue)}
.tile{display:block;flex:none}

/* top */
.proto{position:sticky;top:0;z-index:30;margin-inline:-16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--ground);font:600 12px var(--mono)}
.proto .seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:rgba(127,127,127,.25)}
.proto button{border:0;background:transparent;color:inherit;border-radius:7px;padding:5px 9px;font:inherit}
.proto button[aria-pressed="true"]{background:var(--ground);color:var(--ink)}
nav.site{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:18px 20px;margin-top:16px}
nav.site .nl{border:0;background:transparent;padding:6px 2px;color:var(--body);font-weight:500;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
nav.site .nl[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}

/* doors */
.hero{display:flex;flex-direction:column;gap:22px}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.door{padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left;text-decoration:none;border-radius:20px;transition:transform .2s var(--ease)}
.door:hover{transform:translateY(-3px)}
.door b{font:800 22px/1.1 var(--display);letter-spacing:-.02em}
.mine{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* campaigns */
.camps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.camp{padding:20px;display:flex;flex-direction:column;gap:12px}
.camp .top{display:flex;align-items:center;gap:12px}
.bm{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--display);flex:none;background:var(--soft)}
.deal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.deal div{padding:10px 12px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.deal b{font:800 26px/1 var(--display);letter-spacing:-.02em}
.deal s{color:var(--mute);font-size:14px;margin-left:6px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv>span:nth-child(odd){font:600 10.5px/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tps{display:flex;gap:6px;flex-wrap:wrap}
.tps span{border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:12.5px;color:var(--body)}

/* directory */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.posts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.post{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.post .pic{aspect-ratio:3/4;border-radius:18px;position:relative;overflow:hidden;background:var(--tone);display:flex;align-items:flex-end;padding:12px}
.post .pic svg.big{position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.9}
.post .pic .cap{position:relative;background:var(--glass-strong);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.35}
.av{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:11px;color:var(--body);flex:none}

/* earn */
.ehero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr);gap:28px;align-items:start}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.diff{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.form{padding:22px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:48px;background:var(--glass-strong)}
.field input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%}
.field.bad{border-color:var(--l-coral)}
.otp{display:flex;gap:8px}.otp input{width:44px;height:52px;text-align:center;font:600 20px var(--mono);border:1px solid var(--line);border-radius:12px;background:var(--glass-strong)}
.pick{display:flex;flex-direction:column;gap:6px}
.pick label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.pick input{accent-color:var(--ink)}
.example{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;font-size:14.5px}
.calc .t{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step{padding:18px;display:flex;flex-direction:column;gap:8px}
details{border-top:1px solid var(--line);padding:12px 0}details:first-child{border-top:0}
summary{cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:12px 16px;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center;animation:up .3s var(--ease)}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translateX(-50%)}}
footer{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start;padding-top:24px;border-top:1px solid var(--line)}
footer .c{display:flex;flex-direction:column;gap:8px;font-size:14px}footer .c a{color:var(--body);text-decoration:none}
@media (max-width:900px){.doors,.diffs,.steps{grid-template-columns:minmax(0,1fr)}.camps,.ehero{grid-template-columns:minmax(0,1fr)}.posts{grid-template-columns:repeat(2,minmax(0,1fr))}}
nav.site .links{display:flex;gap:22px;align-items:center}
nav.site .acts{display:flex;gap:14px;align-items:center}
.proto{background:#121212;color:#f6f1e4}.proto button[aria-pressed="true"]{background:#f6f1e4;color:#121212}
@media (max-width:600px){
 .proto{flex-wrap:nowrap;gap:4px;padding-inline:12px}.proto>span:first-child{display:none}.proto button{padding:5px 7px}
 nav.site{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:14px 16px}
 nav.site .spacer{display:none}nav.site .acts{grid-row:1;grid-column:2;justify-self:end;gap:10px}nav.site .links .nl{white-space:nowrap}nav.site .acts .btn{padding:10px 14px}nav.site .who .small{display:none}
 nav.site .links{grid-column:1/-1;gap:18px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);padding-top:8px}
 .mine .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg viewBox="-5 -5 110 110" style="left:-240px;top:-300px;width:820px;height:820px"><path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z"/></svg>
  <svg viewBox="-5 -5 110 110" style="right:-160px;top:36vh;width:520px;height:520px"><path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z"/></svg>
  <svg viewBox="-5 -5 110 110" style="left:18vw;top:80vh;width:700px;height:700px"><path d="M0 100 A50 50 0 0 1 100 100 Z"/><rect width="100" height="22"/></svg>
</div>
<div class="proto" role="toolbar" aria-label="Prototype controls"><span>Prototype</span><span class="seg" role="group" aria-label="Who is looking"><button type="button" data-who="visitor" aria-pressed="true">Visitor</button><button type="button" data-who="ana" aria-pressed="false">Signed in as Ana</button></span><span class="spacer"></span><button type="button" id="themeBtn">Dark</button><button type="button" id="resetBtn">Reset</button></div>
<div class="wrap">
  <nav class="site glass strong" aria-label="okpo.com" id="nav"></nav>
  <main id="view"></main>
  <footer><div class="c" style="max-width:280px"><span class="wm" style="font-size:30px" role="img" aria-label="OkPo"><span>O</span><span>k</span><span>P</span><span>o</span></span><span class="small">Train AI to train your influencers.</span></div>
  <div class="c"><span class="label">Earn</span><a href="#earn" data-view="earn">Earn with OkPo</a><a href="#campaigns" data-view="lobby" data-to="campaigns">Open campaigns</a></div>
  <div class="c"><span class="label">Find</span><a href="#posts" data-view="lobby" data-to="posts">Creators</a><a href="https://okpo-design.vercel.app/audience">A creator’s OkPo page</a></div>
  <div class="c"><span class="label">Brands</span><a href="https://okpo-design.vercel.app/console">Brand console</a><a href="#" data-noop="Books a call on the live site.">Book a call</a></div>
  <div class="c"><span class="label">Note</span><span class="small" style="max-width:260px">Every sponsored post made through OkPo is labelled as paid. Rates and names here are examples.</span></div></footer>
</div>
<div id="layer"></div>
<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const peso=n=>'₱'+Math.round(n).toLocaleString('en-PH');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const P={frame:'<path d="M0 0H100V100H0Z M27 27V73H73V27Z" fill-rule="evenodd" fill="C"/>',quarter:'<path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="C"/>',diamond:'<path d="M50 0L100 50L50 100L0 50Z M50 28L72 50L50 72L28 50Z" fill-rule="evenodd" fill="C"/>',half:'<path d="M0 100 A50 50 0 0 1 100 100 Z" fill="C"/><rect width="100" height="22" fill="C"/>',pin:'<path d="M0 0 L50 0 L50 50 Z M100 0 L100 50 L50 50 Z M100 100 L50 100 L50 50 Z M0 100 L0 50 L50 50 Z" fill="C"/>',petal:'<path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z" fill="C"/>'};
/* the shape map (DESIGN.md §6): five shapes, five meanings; frame is ink */
const COL={half:'var(--blue)',petal:'var(--purple)',diamond:'var(--coral)',pin:'var(--yellow)',quarter:'var(--green)',frame:'var(--ink)'};
const tile=(k,s=16,c)=>`<svg class="tile" width="${s}" height="${s}" viewBox="-5 -5 110 110" aria-hidden="true">${P[k].replace(/fill="C"/g,`fill="${c||COL[k]}"`)}</svg>`;
const APP='https://okpo-design.vercel.app';

const CAMPS=[
 {id:'heroes',brand:'GCash',bm:'G',name:'GCash Heroes',k:'pin',kind:'open',post:40,act:12,what:'One Reel or Story a day from your morning mission',fits:'Anyone in the Philippines with followers who don’t use GCash yet',ends:'31 Oct',tps:['Free to join','Five-minute sign-up','Send money home'],ana:'joined'},
 {id:'ipon',brand:'GCash',bm:'G',name:'GCash Ipon Challenge',k:'pin',kind:'invite',post:25,inv:30,act:10,actLabel:'per first deposit',what:'Two Reels a week about saving for a goal',fits:'Creators with student followers',ends:'Sat 4 Oct to accept',tps:['Start with ₱50','Goals for students'],ana:'invited'},
 {id:'kanto',brand:'Kanto Kape',bm:'KK',name:'Kanto Kape · first orders',k:'pin',kind:'open',post:35,act:15,actLabel:'per first order',what:'A taste test or your order in the Kanto app, 3 a week',fits:'Food creators with followers in Metro Manila',ends:'15 Dec',tps:['Order in the app','Show the stamp card'],ana:'fits'},
 {id:'baon',brand:'Baon Box',bm:'BB',name:'Baon Box · trial boxes',k:'pin',kind:'open',post:30,act:20,actLabel:'per trial box',what:'Unbox and cook one trial box',fits:'Followers in Cebu',ends:'30 Nov',tps:['Ready in 15 minutes','First box free'],ana:'nofit',why:'Needs followers in Cebu. Ana’s are mostly in Iloilo and QC.'}];
const POSTS=[
 {h:'@ana.posts',n:'Ana Reyes',av:'AR',t:'Food',c:'heroes',cap:'Libre mag-join. Sign-up in 14 seconds, on the real app.',page:true,k:'pin'},
 {h:'@bea.saves',n:'Bea Tan',av:'BT',t:'Budget',c:'heroes',cap:'Pinadala ko kay Nanay in two taps.',k:'pin'},
 {h:'@lia.cooks',n:'Lia Gomez',av:'LG',t:'Food',c:'kanto',cap:'Sikwate Latte, ordered ahead. Sulit.',k:'pin'},
 {h:'@joyful.kai',n:'Kai Santos',av:'KS',t:'Tech',c:'heroes',cap:'Five minutes, one ID, done.',k:'pin'},
 {h:'@mika.vlogs',n:'Mika Uy',av:'MU',t:'Student life',c:'ipon',cap:'First ₱50 into GSave. Goal: a new phone.',k:'pin'},
 {h:'@rhea.budget',n:'Rhea Ong',av:'RO',t:'Budget',c:'ipon',cap:'Ipon week 2. Still going.',k:'pin'},
 {h:'@jo.fits',n:'Jo Ramos',av:'JR',t:'Beauty',c:'heroes',cap:'Pay for my shoot fees in the app, no cash.',k:'pin'},
 {h:'@nico.ph',n:'Nico Paz',av:'NP',t:'Tech',c:'kanto',cap:'Stamp 9 of 9. Free drink.',k:'pin'}];
const FRESH=()=>({view:'lobby',who:'visitor',topic:'All',join:{step:'num',num:'',camp:'heroes'}});
let S;try{S=JSON.parse(sessionStorage.getItem('okpo-lobby')||'null')}catch(e){S=null}
if(!S||!S.join)S=FRESH();
const save=()=>{try{sessionStorage.setItem('okpo-lobby',JSON.stringify(S))}catch(e){}};
const ana=()=>S.who==='ana';

function nav(){
 $('#nav').innerHTML=`<a href="#lobby" data-view="lobby" aria-label="OkPo home" style="text-decoration:none"><span class="wm" style="font-size:26px"><span>O</span><span>k</span><span>P</span><span>o</span></span></a>
 <span class="links"><button class="nl" type="button" data-view="lobby" data-to="posts" ${S.view==='lobby'?'aria-current="page"':''}>Creators</button>
 <button class="nl" type="button" data-view="earn" ${S.view==='earn'?'aria-current="page"':''}>Earn with OkPo</button>
 <a class="nl" href="${APP}/brands">For brands</a></span>
 <span class="spacer"></span>
 <span class="acts">${ana()?`<span class="row who" style="gap:8px"><span class="av">AR</span><span class="small">Ana</span></span><a class="btn" href="${APP}/earner">Open the app</a>`:`<button class="nl" type="button" data-who="ana">Sign in</button><button class="btn" type="button" data-view="earn">Start earning</button>`}</span>`;
}
function campCard(c){
 const inv=c.kind==='invite',a=ana();let status='',cta='';
 if(a){
  if(c.ana==='joined'){status='<span class="chip ok">Joined</span>';cta=`<a class="btn" href="${APP}/earner">Open in the app</a>`}
  else if(c.ana==='invited'){status='<span class="chip inv">Invited you</span>';cta=`<a class="btn" href="${APP}/earner">See your invite</a><span class="small">Open for 72 hours</span>`}
  else if(c.ana==='fits'){status='<span class="chip ok">You qualify</span>';cta=`<button class="btn" type="button" data-joincamp="${c.id}">Join, 3-post trial</button>`}
  else {status='<span class="chip n">Not yet</span>';cta=`<span class="small">${esc(c.why)}</span>`}
 } else {
  status=inv?'<span class="chip inv">Invite only</span>':'<span class="chip ok">Open call</span>';
  cta=inv?`<span class="small">Brands invite creators who fit. Join OkPo so they can find you.</span><button class="ghost" type="button" data-view="earn">Join OkPo</button>`:`<button class="btn" type="button" data-startcamp="${c.id}">Join with my mobile number</button><span class="small">Your first 3 posts are a trial</span>`;
 }
 const postVal=a&&inv?`<b class="num">${peso(c.inv)}</b><s>${peso(c.post)}</s>`:`<b class="num">${peso(c.post)}</b>`;
 return `<article class="camp glass strong" id="c-${c.id}"><div class="top"><span class="bm">${c.bm}</span><span class="grow"><span class="small">${esc(c.brand)}</span><b style="display:block;font-size:18px">${esc(c.name)}</b></span>${tile(c.k,22)}${status}</div>
 <div class="deal"><div><span class="label">Per passed post</span><span>${postVal}</span>${a&&inv?'<span class="small">Your invite rate replaces the open rate</span>':''}</div><div><span class="label">${esc(c.actLabel||'per activated sign-up')}</span><b class="num">${peso(c.act)}</b></div></div>
 <div class="kv"><span>You post</span><span>${esc(c.what)}</span><span>Looking for</span><span>${esc(c.fits)}</span><span>Ends</span><span>${esc(c.ends)}</span><span>Talking points</span><span class="tps">${c.tps.map(t=>`<span>${esc(t)}</span>`).join('')}</span></div>
 <div class="row" style="flex-wrap:wrap">${cta}</div></article>`;
}
function vLobby(){
 const topics=['All','Food','Budget','Tech','Beauty','Student life'];
 const list=POSTS.filter(p=>S.topic==='All'||p.t===S.topic);
 const campName=id=>CAMPS.find(c=>c.id===id).name;
 return `<div style="display:flex;flex-direction:column;gap:56px">
 <section class="hero"><span class="label">okpo.com</span><h1>The fastest way to become a brand partner and get paid.</h1>
  ${ana()?`<div class="mine glass strong">${tile('quarter',28)}<span class="grow"><span class="label">Your week so far</span><b style="display:block;font-size:18px">You’ve earned ${peso(1240)} in GCash Heroes this week</b><span class="small">6-day streak · 1 invite waiting · ${peso(1180)} ready to claim</span></span><a class="btn" href="${APP}/earner">Open the app</a></div>`:''}
  <div class="doors">
   <button class="door glass" type="button" data-view="earn">${tile('quarter',30)}<b>Earn from your posts</b><span class="sub">No follower minimum. A mission every morning, paid every Friday to your GCash.</span><span class="label" style="margin-top:auto">For creators →</span></button>
   <button class="door glass" type="button" data-view="lobby" data-to="posts">${tile('frame',30)}<b>Find a creator</b><span class="sub">See what creators posted this week, and ask any of them about the campaign they’re on.</span><span class="label" style="margin-top:auto">For followers →</span></button>
   <a class="door glass" href="${APP}/brands">${tile('pin',30)}<b>Build a community that grows your revenue</b><span class="sub">Load your brand once. OkPo trains your influencers every day, and you pay for customers you confirm.</span><span class="label" style="margin-top:auto">For brands →</span></a>
  </div></section>
 <section id="posts" style="display:flex;flex-direction:column;gap:16px"><div class="row" style="flex-wrap:wrap;align-items:flex-end"><span class="grow"><span class="label">This week</span><h2>Posts that passed</h2><span class="small">The work, not the follower count. Tap one to open the creator’s OkPo page.</span></span><div class="filters" role="group" aria-label="Topic">${topics.map(t=>`<button type="button" data-topic="${t}" aria-pressed="${S.topic===t}">${t}</button>`).join('')}</div></div>
  <div class="posts">${list.map(p=>`<${p.page?`a href="${APP}/audience"`:`button type="button" data-noop="Opens ${esc(p.h)}’s OkPo page."`} class="post"><span class="pic">${tile(p.k,150).replace('class="tile"','class="tile big"')}<span class="cap">${esc(p.cap)}</span></span><span class="row" style="gap:8px"><span class="av">${p.av}</span><span class="grow"><b style="display:block;font-size:14px">${esc(p.n)}</b><span class="small">${esc(p.h)} · ${esc(campName(p.c))}</span></span></span></${p.page?'a':'button'}>`).join('')||'<span class="small">Nothing in this topic this week.</span>'}</div></section>
 <section id="campaigns" style="display:flex;flex-direction:column;gap:16px"><div class="row" style="flex-wrap:wrap;align-items:flex-end;row-gap:6px"><span class="grow" style="min-width:min(100%,420px)"><span class="label">${ana()?'Campaigns for you':'Open now'}</span><h2>${ana()?'Your campaigns, and ones you could join':'Campaigns you can join today'}</h2></span><span class="small">Every deal is fixed. No pitching, no haggling.</span></div>
  <div class="camps">${CAMPS.map(campCard).join('')}</div></section>
 </div>`;
}
function vEarn(){
 const j=S.join,c=CAMPS.find(x=>x.id===j.camp)||CAMPS[0];
 let form;
 if(j.step==='num')form=`<form class="form glass strong" data-form="num"><b style="font-size:18px">Join with your mobile number</b>
  <div class="pick" role="radiogroup" aria-label="Start in">${CAMPS.filter(x=>x.kind==='open').map(x=>`<label><input type="radio" name="camp" value="${x.id}" ${x.id===j.camp?'checked':''}>${tile(x.k,16)}<span class="grow">${esc(x.name)}</span><span class="small">${peso(x.post)} a post</span></label>`).join('')}</div>
  <label for="jnum" class="small">Mobile number</label><div class="field" id="jnumf"><span class="small" style="font-family:var(--mono)">+63</span><input id="jnum" inputmode="tel" autocomplete="tel" placeholder="917 123 4567" value="${esc(j.num)}"></div>
  <button class="btn" type="submit">Send me a code</button><button class="ghost" type="button" data-fillnum style="align-self:flex-start">Use a sample number</button><span class="small">One number for signing in and for payouts. Link TikTok or Instagram after your first mission.</span></form>`;
 else if(j.step==='code')form=`<form class="form glass strong" data-form="code"><b style="font-size:18px">Enter the code</b><span class="small">Sent to +63 ${esc(j.num)}. Demo code: 123456.</span><div class="otp" role="group" aria-label="6-digit code">${[0,1,2,3,4,5].map(i=>`<input id="o${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}">`).join('')}</div><span class="small" id="otpMsg"></span><button class="ghost" type="button" data-fillotp style="align-self:flex-start">Fill the demo code</button><button class="ghost" type="button" data-step="num" style="align-self:flex-start">Change number</button></form>`;
 else form=`<div class="form glass strong">${tile(c.k,40)}<b style="font-size:22px">You’re in.</b><span class="sub">You start in <b style="color:var(--ink)">${esc(c.name)}</b> on a 3-post trial. Your first mission arrives tomorrow at 7:00 AM.</span><a class="btn" href="${APP}/earner">Open the app</a><span class="small">Link your TikTok or Instagram there after your first mission.</span></div>`;
 return `<div style="display:flex;flex-direction:column;gap:48px">
 <section class="ehero"><div style="display:flex;flex-direction:column;gap:18px"><span class="label row" style="gap:8px">${tile('quarter',12)}Earn with OkPo</span><h1>Get paid for posts that bring people in.</h1><p class="sub" style="font-size:18px;max-width:34em">A mission every morning, a coach when you’re stuck, and pay every Friday for posts that pass and followers who sign up.</p>
  <div class="diffs"><div class="diff glass"><b>No follower minimum</b><span class="small">Campaigns say who they’re looking for. You see which ones fit.</span></div><div class="diff glass"><b>Just your number</b><span class="small">No email, no bank forms. Your number is your login and your payout.</span></div><div class="diff glass"><b>One payday</b><span class="small">Every Friday to your GCash, for every campaign. Claim sooner for 2%.</span></div></div></div>
  ${form}</section>
 <section class="example glass"><div class="row" style="flex-wrap:wrap"><span class="grow"><span class="label">A worked example, not a promise</span><b style="display:block;font-size:20px">A week in ${esc(c.name)}</b></span><span class="small">Your page is your link: sign-ups through it earn you more.</span></div>
  <div class="calc"><span>5 posts that pass × ${peso(c.post)}</span><b class="num">${peso(5*c.post)}</b><span>4 followers who sign up and activate × ${peso(c.act)}</span><b class="num">${peso(4*c.act)}</b><span>Weekly bonus for 5 passed posts</span><b class="num">[₱X]</b><span class="t">Paid Friday to your GCash</span><b class="t num">${peso(5*c.post+4*c.act)} + [₱X]</b></div></section>
 <section class="steps">${[['pin','Every morning','Up to three missions across your campaigns, each with today’s talking point and a short Never, Careful and Always list.'],['diamond','Post, then paste the link','The AI checks it in minutes. If something needs a fix, it names the rule and how to fix it.'],['quarter','Every Friday','Pay for posts that passed and sign-ups that activated, straight to your GCash.']].map(([k,t,d])=>`<div class="step glass">${tile(k,26)}<b style="font-size:18px">${t}</b><span class="sub">${d}</span></div>`).join('')}</section>
 <section class="glass" style="padding:8px 22px"><details open><summary>Do I need a lot of followers?</summary><p class="sub" style="margin-top:6px">No. Some campaigns look for followers in a place or topic, and the Lobby shows which ones fit you.</p></details><details><summary>Is it labelled as paid?</summary><p class="sub" style="margin-top:6px">Always. Every post turns on Paid partnership, and your OkPo page says who pays.</p></details><details><summary>What if a post doesn’t pass?</summary><p class="sub" style="margin-top:6px">You get the exact fix. Fix it, paste the link again, and your streak is safe until midnight.</p></details><details><summary>Can I be in more than one campaign?</summary><p class="sub" style="margin-top:6px">Yes. Missions from all of them arrive in Today, up to three a day.</p></details></section></div>`;
}
function render(to){
 nav();$('#view').innerHTML=S.view==='earn'?vEarn():vLobby();
 $$('[data-who]').forEach(b=>{if(b.closest('.proto'))b.setAttribute('aria-pressed',String(b.dataset.who===S.who))});
 if(S.view==='earn'&&S.join.step==='code')wireOtp();
 if(to){const el=document.getElementById(to);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}else window.scrollTo(0,0);
 save();
}
function toast(html){const t=document.createElement('div');t.className='toast glass strong';t.setAttribute('role','status');t.innerHTML=html;$('#layer').appendChild(t);setTimeout(()=>t.remove(),2800)}
function wireOtp(){const ins=$$('.otp input');setTimeout(()=>ins[0]&&ins[0].focus(),50);
 ins.forEach((el,i)=>{el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&ins[i+1])ins[i+1].focus();check(ins)});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()})})}
function check(ins){const v=ins.map(i=>i.value).join('');if(v.length<6)return;if(v!=='123456'){$('#otpMsg').textContent='That code doesn’t match. Try 123456.';ins.forEach(i=>i.value='');ins[0].focus();return}S.join.step='in';render()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-view],[data-who],[data-topic],[data-startcamp],[data-joincamp],[data-noop],[data-fillnum],[data-fillotp],[data-step]');if(!t)return;const d=t.dataset;
 if(d.who){e.preventDefault();S.who=d.who;render();toast(d.who==='ana'?'Signed in as Ana. The Lobby now shows her campaigns and numbers.':'Signed out. The Lobby shows what a visitor sees.');return}
 if(d.view){e.preventDefault();S.view=d.view;render(d.to);return}
 if(d.topic){S.topic=d.topic;render('posts');return}
 if(d.startcamp){S.join={step:'num',num:'',camp:d.startcamp};S.view='earn';render();return}
 if(d.joincamp){const c=CAMPS.find(x=>x.id===d.joincamp);c.ana='joined';render('campaigns');toast(`${tile(c.k,16)}<span><b>Joined ${esc(c.name)}</b> on a 3-post trial. Missions start tomorrow.</span>`);return}
 if(d.noop!==undefined){e.preventDefault();toast(esc(d.noop));return}
 if('fillnum' in d){$('#jnum').value='917 123 4567';return}
 if('fillotp' in d){const ins=$$('.otp input');'123456'.split('').forEach((c,i)=>ins[i].value=c);check(ins);return}
 if(d.step){S.join.step=d.step;render();return}
});
document.addEventListener('change',e=>{if(e.target.name==='camp'){S.join.camp=e.target.value;save()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.dataset.form==='num'){const v=$('#jnum').value.replace(/\D/g,'');if(v.length!==10){$('#jnumf').classList.add('bad');$('#jnum').focus();toast('Enter a 10-digit mobile number, like 917 123 4567.');return}S.join.num=v.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3');S.join.step='code';render()}});
const curTheme=()=>document.documentElement.getAttribute('data-theme')||'light';
const paint=()=>$('#themeBtn').textContent=curTheme()==='dark'?'Light':'Dark';
$('#themeBtn').onclick=()=>{document.documentElement.setAttribute('data-theme',curTheme()==='dark'?'light':'dark');paint()};paint();
$('#resetBtn').onclick=()=>{S=FRESH();CAMPS.find(c=>c.id==='kanto').ana='fits';render();toast('Reset.')};
const route=()=>{const h=location.hash.slice(1);if(h==='earn')S.view='earn';else if(h==='lobby'||h==='campaigns'||h==='posts')S.view='lobby';else return;
render(['campaigns','posts'].includes(h)?h:null);if(!['campaigns','posts'].includes(h))scrollTo(0,0)};
if(!['earn','lobby','campaigns','posts'].includes(location.hash.slice(1)))render();route();addEventListener('hashchange',route);
})();
</script>
</body>
</html>
