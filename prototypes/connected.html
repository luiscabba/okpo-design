<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OkPo Connected</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: control strip, then the brand console and two phones side by side on one shared state, then a log of every link that just fired. */
:root{
  --ground:#f6f1e4; --tone:#ebe2cc; --ink:#121212; --body:#4a4640; --mute:#6a655c; --line:rgba(18,18,18,.12);
  --panel:rgba(255,255,255,.78); --panel2:rgba(255,255,255,.55); --edge:rgba(255,255,255,.95); --shadow:0 16px 36px rgba(18,18,18,.10);
  --soft:rgba(18,18,18,.06); --btn:#121212; --on-btn:#f6f1e4;
  --coral:#ff8787; --yellow:#ffd43b; --orange:#ffa94d; --green:#69db7c; --blue:#74c0fc; --purple:#b197fc;
  --l-green:#237a36; --l-coral:#c92a2a; --l-blue:#1864ab; --warn-bg:rgba(255,212,59,.38); --warn-ink:#6b4e00;
  --hl:#1c7ed6;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --text:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12);
  --panel:rgba(34,34,34,.88); --panel2:rgba(26,26,26,.7); --edge:rgba(255,255,255,.16); --shadow:0 16px 36px rgba(0,0,0,.5);
  --soft:rgba(255,255,255,.07); --btn:#ececec; --on-btn:#121212;
  --l-green:#69db7c; --l-coral:#ff8787; --l-blue:#74c0fc; --warn-bg:rgba(255,212,59,.2); --warn-ink:#ffd43b; --hl:#74c0fc; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12);
  --panel:rgba(34,34,34,.88); --panel2:rgba(26,26,26,.7); --edge:rgba(255,255,255,.16); --shadow:0 16px 36px rgba(0,0,0,.5);
  --soft:rgba(255,255,255,.07); --btn:#ececec; --on-btn:#121212;
  --l-green:#69db7c; --l-coral:#ff8787; --l-blue:#74c0fc; --warn-bg:rgba(255,212,59,.2); --warn-ink:#ffd43b; --hl:#74c0fc; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--text);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:14px 40px}
button,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--hl);outline-offset:2px;border-radius:8px}
.bgshapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.bgshapes svg{position:absolute}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.glass{background:linear-gradient(160deg,var(--panel),var(--panel2));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),var(--shadow);border-radius:20px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.spacer{flex:1}
.label{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.small{font-size:12.5px;color:var(--mute)}.sub{color:var(--body)}.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.wm{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1;display:inline-flex}
.wm span:nth-child(1){color:var(--coral)}.wm span:nth-child(2){color:var(--yellow)}.wm span:nth-child(3){color:var(--green)}.wm span:nth-child(4){color:var(--blue)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:600;background:var(--btn);color:var(--on-btn);transition:transform .12s var(--ease)}
.btn:active:not(:disabled){transform:scale(.97)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500}
.ghost:hover:not(:disabled){background:var(--soft)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 var(--mono);letter-spacing:.08em;padding:4px 8px;border-radius:99px;white-space:nowrap;text-transform:uppercase}
.chip.ok{background:rgba(105,219,124,.24);color:var(--l-green)}.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}.chip.n{background:var(--soft);color:var(--body)}.chip.fix{background:rgba(255,135,135,.22);color:var(--l-coral)}.chip.pause{background:rgba(116,192,252,.24);color:var(--l-blue)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}

/* strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px 10px 18px}
.clock{display:flex;flex-direction:column;gap:2px}
.clock b{font:800 20px/1 var(--display);letter-spacing:-.02em}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 360px 360px;gap:18px;align-items:start}
.pane{display:flex;flex-direction:column;gap:8px;min-width:0}
.pane>.cap{display:flex;align-items:center;gap:8px}
.who{display:none}

/* console */
.con{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:740px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:10px;padding:7px 11px;font-size:13px;color:var(--body);display:inline-flex;align-items:center;gap:7px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs button[data-tab="aim"][aria-current="page"]{background:color-mix(in srgb,var(--green) 24%,transparent)}
.tabs button[data-tab="recruit"][aria-current="page"]{background:color-mix(in srgb,var(--yellow) 26%,transparent)}
.tabs button[data-tab="posts"][aria-current="page"]{background:color-mix(in srgb,var(--orange) 24%,transparent)}
.tabs button[data-tab="leads"][aria-current="page"]{background:color-mix(in srgb,var(--blue) 24%,transparent)}
.tabs button[data-tab="pool"][aria-current="page"]{background:color-mix(in srgb,var(--green) 24%,transparent)}
.echo{background:color-mix(in srgb,var(--orange) 16%,transparent);border-radius:10px;padding-inline:8px}
.echo.lead{background:color-mix(in srgb,var(--blue) 16%,transparent)}
.ping{display:inline-block;animation:ping 1s var(--ease) 2}
@keyframes ping{40%{transform:scale(1.5)}}
.cnt{font:600 10.5px/1 var(--mono);padding:3px 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn-ink)}
.box{padding:12px 14px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font:800 22px/1 var(--display);letter-spacing:-.02em}
.angle{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.brief{border-radius:18px;border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.tag{display:inline-flex;font:600 9.5px/1 var(--mono);letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--body);text-transform:uppercase}

/* phones */
.phone{position:relative;width:360px;max-width:100%;height:740px;border-radius:42px;overflow:hidden;background:var(--ground);border:1px solid var(--line);box-shadow:0 26px 54px rgba(0,0,0,.14);isolation:isolate}
.phone .pbg{position:absolute;inset:0;pointer-events:none}.phone .pbg svg{position:absolute}
.scr{position:absolute;inset:0;overflow-y:auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.big{font:800 26px/1.04 var(--display);letter-spacing:-.03em}
.ptabs{position:absolute;left:10px;right:10px;bottom:10px;height:58px;border-radius:24px;display:flex;align-items:center;padding:0 6px;z-index:5}
.ptabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute)}
.ptabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.mission{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mission:first-child{border-top:0}
.mission .mt{display:block;font-weight:600;font-size:13.5px}
.mission.done .mt{opacity:.55;text-decoration:line-through}
.go{background:var(--btn);color:var(--on-btn);font:600 12px/1 var(--text);padding:7px 11px;border-radius:99px;white-space:nowrap}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--mute);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctag{display:inline-flex;align-items:center;gap:4px;font:600 9px/1 var(--mono);letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:var(--soft);color:var(--body);text-transform:uppercase;margin-top:4px;align-self:flex-start}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12.5px}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--body);flex:none}
.wash{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#121212;pointer-events:none}

/* links */
.hl{animation:hl 1.6s var(--ease)}
@keyframes hl{0%,60%{box-shadow:0 0 0 3px var(--hl),var(--shadow)}100%{box-shadow:inset 0 1px 0 var(--edge),var(--shadow)}}
.log{padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.log .li{align-items:flex-start}
.log .t{font:500 11.5px/1.5 var(--mono);color:var(--mute);width:96px;flex:none}
.from{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--body);flex:none;width:210px}
.from i{font-style:normal;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.log .li.new{animation:rise .35s var(--ease)}

@media (max-width:1240px){.stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pane.console{grid-column:1 / -1}}
@media (max-width:820px){
  .who{display:inline-flex}
  .stage{grid-template-columns:minmax(0,1fr)}
  .stage[data-show="console"] .pane.ana,.stage[data-show="console"] .pane.fol,
  .stage[data-show="ana"] .pane.console,.stage[data-show="ana"] .pane.fol,
  .stage[data-show="fol"] .pane.console,.stage[data-show="fol"] .pane.ana{display:none}
  .pane.ana,.pane.fol{align-items:center}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .from{width:auto}.log .li{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="bgshapes" id="bgs" aria-hidden="true"></div>
<div class="wrap">
  <div class="strip glass" role="toolbar" aria-label="Prototype controls">

    <span class="spacer"></span>
    <div class="seg who" role="group" aria-label="Show"><button type="button" data-show="console" aria-pressed="true">Brand</button><button type="button" data-show="ana" aria-pressed="false">Ana</button><button type="button" data-show="fol" aria-pressed="false">Follower</button></div>
    <button class="btn" type="button" id="nextDay">Next day, 7:00 AM brief</button>
    <button class="ghost" type="button" id="themeBtn">Dark</button>
    <button class="ghost" type="button" id="resetBtn">Reset</button>
  </div>

  <div class="stage" id="stage" data-show="console">
    <section class="pane console" aria-label="Brand console">
      <div class="cap"><span class="label">GCash · brand console</span><span class="spacer"></span><span class="small">Viewing as</span><div class="seg" role="group" aria-label="Role"><button type="button" data-role="team">OkPo team</button><button type="button" data-role="brand">GCash</button></div></div>
      <div class="con glass" id="con"></div>
    </section>

      <div class="cap"><span class="label">A follower · Ana’s OkPo page</span></div>

  <section class="log glass" aria-label="What just connected">
    <div class="row" style="padding-bottom:6px"><b class="grow" style="font-size:15px">What just connected</b><span class="small">Newest first. Each line lights up both ends.</span></div>
    <div id="log"></div>
  </section>
</div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const peso=n=>'₱'+Math.round(n).toLocaleString('en-PH');
const fmt=n=>Math.round(n).toLocaleString('en-PH');

/* shapes */
const P={frame:'<path d="M0 0H100V100H0Z M27 27V73H73V27Z" fill-rule="evenodd" fill="C"/>',quarter:'<path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="C"/>',diamond:'<path d="M50 0L100 50L50 100L0 50Z M50 28L72 50L50 72L28 50Z" fill-rule="evenodd" fill="C"/>',half:'<path d="M0 100 A50 50 0 0 1 100 100 Z" fill="C"/><rect width="100" height="22" fill="C"/>',pin:'<path d="M0 0 L50 0 L50 50 Z M100 0 L100 50 L50 50 Z M100 100 L50 100 L50 50 Z M0 100 L0 50 L50 50 Z" fill="C"/>',petal:'<path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z" fill="C"/>'};
const COL={frame:'var(--coral)',quarter:'var(--green)',diamond:'var(--orange)',half:'var(--yellow)',petal:'var(--purple)',pin:'var(--blue)'};
function tile(k,s=14,out){let b=P[k];b=out?b.replace(/fill="C"/g,`style="fill:none;stroke:${out};stroke-width:9"`).replace('fill-rule="evenodd" ',''):b.replace(/fill="C"/g,`style="fill:${COL[k]}"`);return `<svg width="${s}" height="${s}" viewBox="-5 -5 110 110" aria-hidden="true" style="flex:none;display:block">${b}</svg>`}
const tone=(k,st)=>`<svg viewBox="-5 -5 110 110" style="${st}" aria-hidden="true">${P[k].replace(/fill="C"/g,'style="fill:var(--tone)"')}</svg>`;
$('#bgs').innerHTML=tone('quarter','left:-260px;top:-340px;width:900px;height:900px')+tone('petal','left:46vw;top:-260px;width:620px;height:620px')+tone('half','left:52vw;top:60vh;width:780px;height:780px');
const phoneBg=()=>`<div class="pbg">${tone('quarter','left:-110px;top:-110px;width:380px;height:380px')}${tone('petal','left:170px;top:130px;width:270px;height:270px')}${tone('half','left:110px;top:480px;width:350px;height:350px')}</div>`;

/* ---------- shared state ---------- */
const DAYS=['Tue 30 Sep','Wed 1 Oct','Thu 2 Oct','Fri 3 Oct','Sat 4 Oct','Sun 5 Oct','Mon 6 Oct'];
/* talking points: what a post leads with. Rules (R-xx) say what it must never do; talking points steer, never override */
const ANG={heroes:[{n:'Free to join',line:'Say it’s free to join. No promises on amounts.',r:'R-06 · R-03'},{n:'Five-minute sign-up',line:'Show the whole sign-up in the real app, under 20 seconds.',r:'R-05 · R-08'},{n:'Send money home',line:'Talk about sending money home to family.',r:'R-04'}],
 ipon:[{n:'Start with ₱50',line:'Show your own first ₱50 going into GSave.',r:'R-05 · R-12'},{n:'Goals for students',line:'Name one thing you’re saving for.',r:'R-09'}]};
const qBand=n=>n>=80?'Strong':n>=60?'Good':'Needs work';
const bandChip=n=>`<span class="chip ${n>=80?'ok':n>=60?'n':'warn'}">${qBand(n)}</span>`;
const FRESH=()=>({day:0,role:'team',tab:'aim',
 camps:{heroes:{name:'GCash Heroes',short:'Heroes',k:'half',status:'live',post:40,act:12,draft:ANG.heroes.map(a=>a.n),pub:ANG.heroes.map(a=>a.n),pool:62000,cut:null},
        ipon:{name:'GCash Ipon Challenge',short:'Ipon',k:'pin',status:'live',post:30,act:10,draft:ANG.ipon.map(a=>a.n),pub:ANG.ipon.map(a=>a.n),pool:37800,cut:null}},
 ver:7,pend:[],
 leads:{counted:1284,confirmed:1196,trail:[]},
 posts:[{h:'@joyful.kai',c:'heroes',t:'Reel',s:'pass',when:'9:40 AM',tp:'Free to join',q:86},{h:'@bea.saves',c:'heroes',t:'Reel',s:'pass',when:'8:55 AM',tp:'Five-minute sign-up',q:71}],
 ana:{tab:'today',inv:'none',camps:['heroes'],missions:[],today:0,ready:1180,confirming:0,streak:6,notifs:[],signups:9},
 fol:{via:'heroes',taps:['heroes'],signed:false,credit:null},
 log:[]});
let S;try{S=JSON.parse(localStorage.getItem('okpo-connected-v2')||'null')}catch(e){S=null}
if(!S||!S.camps)S=FRESH();
const save=()=>{try{localStorage.setItem('okpo-connected-v2',JSON.stringify(S))}catch(e){}};
const C=id=>S.camps[id];

/* the 7:00 AM brief is written from what is published */
function writeBrief(){const A=S.ana,out=[];let id=1;
 A.camps.forEach(cid=>{const c=C(cid);if(c.status!=='live')return;const lead=ANG[cid].find(a=>a.n===c.pub[0]);
   out.push({id:id++,c:cid,t:cid==='heroes'?'Reel: '+lead.n.toLowerCase():'Story: '+lead.n.toLowerCase(),tp:lead.n,line:lead.line,rid:lead.r,r:c.post,s:'open'});
   const sec=ANG[cid].find(a=>a.n===c.pub[1]);out.push({id:id++,c:cid,t:cid==='heroes'?'Story with your sign-up link':'Reel: your savings goal',tp:sec.n,line:sec.line,rid:sec.r,r:cid==='heroes'?15:c.post,s:'open'})});
 if(A.camps.includes('heroes')&&C('heroes').status==='live')out.push({id:id++,c:'heroes',t:'Answer a follower question',line:'Reply to one question from your page.',rid:'R-03',r:10,s:'open'});
 A.missions=out;A.today=0}
if(!S.ana.missions.length)writeBrief();
const used=()=>S.ana.missions.filter(m=>m.s!=='open').length,capLeft=()=>Math.max(0,3-used());

/* ---------- links: log + light both ends ---------- */
function link(from,to,text,targets){S.log.unshift({at:DAYS[S.day]+' · '+new Date().toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'}),from,to,text});S.log=S.log.slice(0,14);save();renderLog(true);
 setTimeout(()=>(targets||[]).forEach(sel=>$$(sel).forEach(el=>{el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl')})),60)}
function renderLog(fresh){$('#log').innerHTML=S.log.length?S.log.map((l,i)=>`<div class="li${fresh&&i===0?' new':''}"><span class="t">${esc(l.at)}</span><span class="from">${esc(l.from)} <i>→</i> ${esc(l.to)}</span><span class="grow">${l.text}</span></div>`).join(''):'<span class="small">Nothing yet. Try: reorder the talking points and publish, then press Next day. Or sign up from the follower’s phone.</span>'}
function toast(html,where){const host=where||$('#toastLayer');const t=document.createElement('div');t.className='note glass';t.setAttribute('role','status');t.style.cssText=where?'position:absolute;left:12px;right:12px;top:12px;z-index:30':'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;max-width:calc(100% - 32px)';t.innerHTML=html;host.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ---------- console ---------- */
const team=()=>S.role==='team';
function stChip(s){return s==='live'?'<span class="chip ok">● Live</span>':s==='paused'?'<span class="chip pause">● Paused</span>':'<span class="chip n">'+esc(s)+'</span>'}
function renderCon(){const c=C('heroes'),pn=S.pend.length,money=S.pend.some(p=>p.money);
 const tabs=[['aim','Talking points · Heroes','quarter'],['recruit','Recruiting','half'],['posts','Posts','diamond'],['leads','Leads','pin'],['pool','Pool','quarter']];
 if(S.tab==='posts')S.echoPosts=false;if(S.tab==='leads')S.echoLeads=false;
 let body='';
 if(S.tab==='aim'){body=`<div class="row" style="flex-wrap:wrap"><b class="disp grow" style="font-size:22px">GCash Heroes</b>${stChip(c.status)}${c.status==='live'?`<button class="ghost" type="button" data-pause="heroes">Pause</button>`:`<button class="ghost" type="button" data-resume="heroes">Resume</button>`}</div>
  <div class="box" id="outbar"><div class="row" style="flex-wrap:wrap">${tile('petal',16)}<span class="grow">${pn?`<b>${pn} change${pn>1?'s':''} ready for v${S.ver+1}.</b> <span class="small">${money?'Includes a money change, so GCash approves first.':'GCash is told.'} Reaches Ana in the next 7:00 AM brief.</span>`:`<b>Published · v${S.ver}.</b> <span class="small">What Ana’s brief is written from.</span>`}</span>${pn?(money&&team()?`<button class="btn" type="button" data-pub>Send to GCash</button>`:`<button class="btn" type="button" data-pub>${money?'Approve and publish':'Publish'} v${S.ver+1}</button>`):''}</div>${pn?`<div class="small">${S.pend.map(p=>'· '+esc(p.what)+(p.money?(p.sent?' (waiting for GCash)':' (needs GCash)'):'')).join('<br>')}</div>`:''}</div>
  <span class="label">Talking points, in order · drafts until published</span><span class="small" style="margin-top:-4px">What posts lead with. First gets the most missions. Steers the brief; never overrides a rule.</span>
  <div style="display:flex;flex-direction:column;gap:6px" id="angles">${c.draft.map((n,i)=>`<div class="angle"><span class="mono small">0${i+1}</span><b class="grow">${esc(n)}</b>${c.pub[i]!==n?'<span class="chip warn">Changed</span>':''}<button class="ghost" type="button" data-up="${i}" ${i===0||!team()?'disabled':''} aria-label="Move ${esc(n)} up">↑ First</button></div>`).join('')}</div>
  <span class="label">Rewards</span>
  <div class="angle"><span class="grow"><b>${peso(c.post)} per passed post</b><br><span class="small">${c.cut?`Drops to ${peso(c.cut.to)} on ${DAYS[c.cut.on]}. Earners got 3 days’ notice.`:'₱12 per activated sign-up'}</span></span><button class="ghost" type="button" data-cut ${!team()||c.cut||S.pend.some(p=>p.cut)?'disabled':''}>Lower to ₱35</button></div>
  <div class="brief" id="conBrief"><div class="row"><span class="label grow">Ana’s next brief, as published</span><span class="small">7:00 AM</span></div>${c.pub.slice(0,2).map((n,i)=>`<div class="row" style="align-items:flex-start">${tile('quarter',11,'var(--mute)')}<span class="grow">${esc(ANG.heroes.find(a=>a.n===n).line)}<br><span class="tag">TALKING POINT 0${i+1} · ${esc(n)}</span></span></div>`).join('')}<div class="row" style="align-items:flex-start">${tile('frame',11,'var(--mute)')}<span class="grow">Tag #GCashHeroes and turn on Paid partnership.<br><span class="tag">RULES R-13 · R-01</span></span></div><div class="row" style="align-items:flex-start">${tile('frame',11,'var(--mute)')}<span class="grow">Don’t promise approval, amounts or dates.<br><span class="tag">RULE R-03 · FAIL</span></span></div></div>`}
 if(S.tab==='recruit'){const inv=S.ana.inv;body=`<b class="disp" style="font-size:22px">Recruiting · GCash Ipon Challenge</b><span class="sub">Invite people who fit. An invite is a better deal they must accept within 72 hours.</span>
  <div class="angle" id="recAna"><span class="av">AR</span><span class="grow"><b>@ana.posts</b><br><span class="small">Food and budget · QC · pass rate 96% on Heroes</span></span>${inv==='joined'?'<span class="chip ok">Joined</span>':inv==='sent'?'<span class="chip warn">Invite sent · 72h</span>':`<button class="btn" type="button" data-invite ${team()?'':'disabled'}>Invite at ₱30 per post</button>`}</div>
  <div class="angle"><span class="av">BT</span><span class="grow"><b>@bea.saves</b><br><span class="small">Budget · Bacolod</span></span><span class="chip ok">Joined</span></div>
  <span class="small">Open call pays ₱25. Ana’s invite replaces that with ₱30; it doesn’t add to it.</span>`}
 if(S.tab==='posts'){body=`<b class="disp" style="font-size:22px">Posts, checked against the brief</b><div id="postList">${S.posts.map(p=>`<div class="li${p.when==='just now'?' echo':''}"><span class="av">${p.h[1].toUpperCase()}</span><span class="grow"><b>${p.h}</b><br><span class="small">${p.t} · ${C(p.c).name} · ${p.when}${p.tp?' · '+esc(p.tp):''}</span></span>${p.q?`<span class="mono small" title="Quality score, brand side only">${p.q}</span>${bandChip(p.q)}`:''}${p.s==='pass'?'<span class="chip ok">Passed</span>':'<span class="chip warn">In review</span>'}</div>`).join('')}</div><span class="small">Quality is a separate score from pass or fail. You see the number; the earner sees only the band and two tips. It never changes pay.</span>`}
 if(S.tab==='leads'){const L=S.leads;body=`<b class="disp" style="font-size:22px">Your numbers, next to ours</b>
  <div class="kpis" id="leadKpis"><div class="kpi"><span class="label">Counted by OkPo</span><b class="num">${fmt(L.counted)}</b></div><div class="kpi"><span class="label">Confirmed by GCash</span><b class="num">${fmt(L.confirmed)}</b></div><div class="kpi"><span class="label">Waiting</span><b class="num">${L.counted-L.confirmed}</b></div><div class="kpi"><span class="label">Match</span><b class="num">${Math.round(L.confirmed/L.counted*100)}%</b></div></div>
  <div class="row"><span class="label grow">Latest trail</span><button class="ghost" type="button" data-gconfirm ${L.counted>L.confirmed?'':'disabled'}>GCash confirms</button></div>
  <div id="trail">${L.trail.length?L.trail.map((t,i)=>`<div class="li${i===0&&!t.ok?' echo lead':''}">${tile(C(t.c).k,14)}<span class="grow"><b>${t.id}</b> · from ${t.h}<br><span class="small">${esc(t.d)}</span></span>${t.ok?'<span class="chip ok">Confirmed</span>':'<span class="chip n">Waiting</span>'}</div>`).join(''):'<span class="small">Sign up from the follower’s phone to add one.</span>'}</div>
  <span class="small">Counts within 7 days of the tap. GCash confirms within 2 days. Last link tapped gets the credit, once. Billing uses GCash’s number.</span>`}
 if(S.tab==='pool'){body=`<b class="disp" style="font-size:22px">Pool and billing</b><div class="kpis" id="poolKpis">${['heroes','ipon'].map(id=>`<div class="kpi"><span class="label">${C(id).short} pool left</span><b class="num">${peso(C(id).pool)}</b></div>`).join('')}<div class="kpi"><span class="label">Billing</span><b style="font-size:16px">GCash-confirmed</b></div><div class="kpi"><span class="label">Cap</span><b>₱120</b></div></div><span class="small">Each passed post and each confirmed sign-up is paid from its campaign’s pool. Spending stops at the pool.</span>`}
 $('#con').innerHTML=`<div class="tabs" role="tablist">${tabs.map(([k,l,t])=>{const echo=(k==='posts'&&S.echoPosts)||(k==='leads'&&S.echoLeads);return `<button type="button" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}><span class="${echo?'ping':''}">${S.tab===k||echo?tile(t,13):tile(t,12,'var(--mute)')}</span>${l}${k==='aim'&&pn?`<span class="cnt">${pn}</span>`:''}</button>`}).join('')}</div>${body}`;
 $$('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===S.role)))}

/* ---------- Ana ---------- */
function renderAna(){const A=S.ana,M=A.missions,done=M.filter(m=>m.s==='pass').length,left=capLeft();
 let html='';
 if(A.tab==='today'){html=`<div class="row"><span class="wm" style="font-size:20px"><span>O</span><span>k</span><span>P</span><span>o</span></span><span class="spacer"></span><span class="av">AR</span></div>
  <div><span class="sub">Magandang umaga, Ana · ${DAYS[S.day]}</span><div class="big">${left?left+' mission'+(left>1?'s':'')+' left':'All done for today'}</div><span class="small">Up to 3 a day across your campaigns. Brief written from v${A.briefVer||S.ver}.</span></div>
  ${A.inv==='sent'?`<div class="card glass" id="anaInvite">${tile('pin',22)}<span class="label">GCash invited you · 72 hours</span><b>GCash Ipon Challenge</b><span class="small">₱30 per passed post (open call ₱25) · ₱10 per first deposit</span><div class="row"><button class="btn grow" type="button" data-accept>Accept</button><button class="ghost" type="button" data-decline>Not now</button></div></div>`:''}
  ${A.notifs.slice(0,2).map(n=>`<div class="note">${tile(n.k,16)}<span><b>${esc(n.t)}</b><br><span class="small" style="color:var(--body)">${esc(n.b)}</span></span></div>`).join('')}
  <div class="card glass" style="padding:4px 14px;gap:0" id="anaMissions">${M.length?M.map(m=>{const lock=m.s==='open'&&!left;return `<button class="mission ${m.s==='pass'?'done':''}" type="button" data-m="${m.id}" ${m.s!=='open'||lock?'aria-disabled="true"':''}>${m.s==='pass'?tile('diamond',20):tile('diamond',20,'var(--mute)')}<span class="grow" style="display:flex;flex-direction:column"><span class="mt">${esc(m.t)}</span><span class="small">${m.s==='check'?'AI is checking…':m.s==='pass'?'Passed · +'+peso(m.r)+(m.band?' · '+m.band:''):lock?'Daily cap reached · tomorrow':(m.tp?'Talking point: '+esc(m.tp)+' · ':'')+esc(m.line)}</span>${m.s==='open'&&m.rid?`<span class="ctag" style="text-transform:none">${esc(m.rid)}</span>`:''}${A.camps.length>1?`<span class="ctag">${tile(C(m.c).k,8)}${C(m.c).short}</span>`:''}</span>${m.s==='open'&&!lock?`<span class="go">+${peso(m.r)}</span>`:m.s==='check'?'<span class="spin"></span>':''}</button>`}).join(''):'<span class="small" style="padding:12px 0">No missions today. Your campaigns are paused.</span>'}</div>
  <div class="card glass"><div class="row"><span class="label grow">Earned today</span><b class="num">${peso(A.today)}</b></div><div class="row"><span class="small grow">Posting streak</span><b>${A.streak} days</b></div></div>`}
 if(A.tab==='wallet'){html=`<b style="font-size:17px">Wallet</b><div class="card glass" id="anaWallet"><span class="label">Ready to claim</span><div class="big num" style="font-size:40px">${peso(A.ready)}</div><div class="row small"><span class="grow">Confirming · waits on GCash</span><b class="num" style="color:var(--ink)">${peso(A.confirming)}</b></div><button class="btn" type="button" disabled>Claim to GCash</button><span class="small">Claim now costs 2%. Friday is free.</span></div>`}
 if(A.tab==='page'){html=`<b style="font-size:17px">My page</b><div class="card glass" id="anaPage"><span class="label">okpo.com/ana.posts</span><div class="row" style="gap:20px"><span><span class="big num">${A.signups}</span><br><span class="small">sign-ups this week</span></span></div><span class="small">Your page leads with the campaign a follower tapped.</span></div>`}
 $('#pAna').innerHTML=phoneBg()+`<div class="scr">${html}</div><nav class="ptabs glass" aria-label="Earner app">${[['today','Today','frame'],['wallet','Wallet','quarter'],['page','My page','half']].map(([k,l,t])=>`<button type="button" data-atab="${k}" ${A.tab===k?'aria-current="page"':''}>${A.tab===k?tile(t,20):tile(t,19,'var(--mute)')}${l}</button>`).join('')}</nav>`}

/* ---------- follower ---------- */
function renderFol(){const F=S.fol,ip=F.via==='ipon',iponOn=S.ana.camps.includes('ipon');
 const card=ip?{k:'pin',t:'Start the Ipon Challenge',d:'Ipon ng ₱50 sa GSave. Libre, mga 3 minuto.',b:'Start saving on GCash',src:'Story'}:{k:'half',t:'Join GCash Heroes',d:'Libre mag-join. About 5 minutes.',b:'Sign up on GCash',src:'Reel'};
 $('#pFol').innerHTML=phoneBg()+`<div class="scr"><div class="row small"><span class="grow mono">okpo.com/ana.posts?c=${ip?'ipon':'heroes'}</span></div>
  <div class="seg" role="group" aria-label="Which link did they tap" style="align-self:center"><button type="button" data-via="heroes" aria-pressed="${!ip}">Tapped Heroes Reel</button><button type="button" data-via="ipon" aria-pressed="${ip}" ${iponOn?'':'disabled title="Ana isn’t in Ipon yet"'}>Tapped Ipon Story</button></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center"><span class="av" style="width:70px;height:70px;font-size:20px">AR</span><span class="disp" style="font-size:22px">Ana Reyes</span><span class="chip n">Paid partnership with GCash</span></div>
  <div class="card glass" id="folCard"><span class="label">You came from Ana’s ${card.src}</span><span class="row">${tile(card.k,16)}<b style="font-size:15px">${card.t}</b></span><span class="sub">${card.d}</span><button class="btn" type="button" data-signup ${F.signed?'disabled':''}>${F.signed?'You’re signed up':card.b}</button><span class="small">${F.signed?'Credited once, to '+C(F.credit).name+'.':F.taps.length>1?'You tapped '+F.taps.map(x=>C(x).short).join(', then ')+'. The last link gets the credit.':'Ana gets credit when GCash confirms it.'}</span></div>
  ${!iponOn?'<span class="small" style="text-align:center">Ana’s Ipon link appears once she joins Ipon.</span>':''}
  <div class="card glass"><span class="row">${tile('petal',16)}<b>Ask Ana’s AI</b></span><span class="small">Answers from GCash’s checked info for ${C(F.via).name}.</span></div></div>`}

function renderAll(){renderCon();renderAna();renderFol();renderLog();$('#clock').textContent=DAYS[S.day];save()}

/* ---------- actions ---------- */
function wash(phone,color,text){if(RM){toast(text,phone);return}const w=document.createElement('div');w.className='wash';w.style.background=color;w.innerHTML=`<b class="disp" style="font-size:34px">${text}</b>`;phone.appendChild(w);w.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.75},{opacity:0}],{duration:1500}).finished.then(()=>w.remove())}
function passMission(m){const c=C(m.c),A=S.ana;m.s='pass';m.q=m.id===1?84:m.id===2?73:66;m.band=qBand(m.q);A.today+=m.r;A.ready+=m.r;c.pool-=m.r;if(!A.doneToday){A.doneToday=true;A.streak++}
 S.posts.forEach(p=>{if(p.when==='just now')p.when='earlier'});S.posts.unshift({h:'@ana.posts',c:m.c,t:m.t.split(':')[0].split(' ')[0],s:'pass',when:'just now',tp:m.tp,q:m.q});if(S.tab!=='posts')S.echoPosts=true;
 renderAll();wash($('#pAna'),'#ffe8cc','Passed');
 link('Ana','Brand console',`Ana’s ${esc(m.t.toLowerCase())} passed (${m.band}). It shows in <b>Posts</b> with its quality score, and ${peso(m.r)} comes out of the ${c.short} pool.`,['#anaMissions','#postList','#poolKpis','#con'])}
$('#pAna').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset,A=S.ana;
 if(d.atab){A.tab=d.atab;renderAna();save();return}
 if(d.m){const m=A.missions.find(x=>x.id===+d.m);if(!m||m.s!=='open')return;if(!capLeft()){toast('That’s 3 for today. It comes back tomorrow.',$('#pAna'));return}m.s='check';renderAna();setTimeout(()=>passMission(m),RM?100:1400);return}
 if('accept' in d){A.inv='joined';A.camps.push('ipon');A.notifs.unshift({k:'pin',t:'You joined GCash Ipon Challenge',b:'Its missions start in tomorrow’s brief, inside your 3 a day.'});renderAll();
   link('Ana','Brand console','Ana accepted the Ipon invite. Recruiting shows <b>Joined</b>, and her follower page can now carry an Ipon link.',['#recAna','#con','#pFol']);return}
 if('decline' in d){toast('Not now. The invite stays open until 72 hours pass.',$('#pAna'));return}});

$('#pFol').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset,F=S.fol;
 if(d.via){if(F.signed){toast('This follower already signed up. One sign-up, one credit.',$('#pFol'));return}F.via=d.via;if(F.taps[F.taps.length-1]!==d.via)F.taps.push(d.via);renderFol();save();return}
 if('signup' in d){F.signed=true;F.credit=F.via;const c=C(F.via),amt=F.via==='ipon'?10:12;const id='#L-'+(48222+S.leads.trail.length);
   S.leads.counted++;S.leads.trail.unshift({id,h:'@ana.posts',c:F.via,d:(F.taps.length>1?'Tapped '+F.taps.map(x=>C(x).short).join(', then ')+' · ':'')+'credited to '+c.short,ok:false});
   S.ana.confirming+=amt;S.ana.signups++;if(S.tab!=='leads')S.echoLeads=true;S.ana.notifs.unshift({k:'half',t:'A follower signed up · '+c.short,b:'+'+peso(amt)+' once GCash confirms.'});
   renderAll();link('Follower','Ana and Brand console',`A follower signed up from Ana’s page, credited to <b>${c.name}</b>${F.taps.length>1?' (the last link tapped)':''}. Leads counts it; Ana sees +${peso(amt)} confirming.`,['#folCard','#trail','#leadKpis','#pAna','#con']);return}});

$('#con').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset,c=C('heroes');
 if(d.tab){S.tab=d.tab;renderCon();save();return}
 if(d.up){const i=+d.up;const [m]=c.draft.splice(i,1);c.draft.unshift(m);S.pend=S.pend.filter(p=>!p.angle);if(c.draft.join()!==c.pub.join())S.pend.push({what:'Heroes talking point 01 is “'+m+'”',angle:1});renderCon();save();return}
 if('cut' in d){S.pend.push({what:'Heroes post reward ₱40 to ₱35',money:1,cut:1});renderCon();save();return}
 if('pub' in d){const money=S.pend.some(p=>p.money);
   if(money&&team()){S.pend.forEach(p=>p.sent=1);renderCon();save();link('OkPo team','GCash','A reward change went to GCash for approval. Switch the console to <b>GCash</b> to approve it.',['#outbar']);return}
   S.ver++;c.pub=c.draft.slice();const cut=S.pend.find(p=>p.cut);
   if(cut){c.cut={to:35,on:Math.min(S.day+3,6)};S.ana.notifs.unshift({k:'half',t:'Heroes posts drop to ₱35 on '+DAYS[c.cut.on],b:'3 days’ notice. Posts you make before then keep ₱40.'})}
   const what=S.pend.map(p=>p.what).join('; ');S.pend=[];renderAll();
   link(team()?'OkPo team':'GCash','Ana',`v${S.ver} published: ${esc(what)}. ${cut?'Ana got the 3-day notice now. ':''}The talking-point change reaches her in the <b>next 7:00 AM brief</b>.`,['#outbar','#conBrief','#pAna']);return}
 if(d.pause){c.status='paused';renderAll();link('Brand console','Ana','GCash Heroes is paused. From the next brief, Ana gets no Heroes missions; pay she earned is still paid Friday.',['#con','#pAna']);return}
 if(d.resume){c.status='live';renderAll();link('Brand console','Ana','GCash Heroes is live again. Its missions return in the next brief.',['#con','#pAna']);return}
 if('invite' in d){S.ana.inv='sent';renderAll();link('Brand console','Ana','Ana got an invite to Ipon at ₱30 per post. It sits on her Today until she answers, for 72 hours.',['#recAna','#pAna']);return}
 if('gconfirm' in d){const n=S.leads.counted-S.leads.confirmed;S.leads.confirmed=S.leads.counted;S.leads.trail.forEach(x=>x.ok=true);const amt=S.ana.confirming;S.ana.ready+=amt;S.ana.confirming=0;
   S.leads.trail.forEach(x=>{});renderAll();if(amt)wash($('#pAna'),'#ebfbee','+'+peso(amt));
   link('GCash','Ana and Brand console',`GCash confirmed ${n} sign-up${n>1?'s':''}. Billing uses this number${amt?', and Ana’s '+peso(amt)+' moved to Ready':''}.`,['#leadKpis','#trail','#pAna']);return}});

$$('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;renderCon();save()});

$('#nextDay').onclick=()=>{if(S.day>=6){toast('That’s the end of the demo week. Reset to start again.');return}
 const before=S.ana.missions[0]&&S.ana.missions[0].t;S.day++;const c=C('heroes');
 if(c.cut&&S.day>=c.cut.on){c.post=c.cut.to;c.cut=null}
 S.ana.doneToday=false;S.ana.briefVer=S.ver;writeBrief();S.ana.tab='today';
 renderAll();const lead=S.ana.missions[0];
 link('7:00 AM brief','Ana',`New day. Ana’s brief is written from v${S.ver}: ${lead?'it leads with <b>'+esc(lead.t)+'</b>'+(S.ana.camps.length>1?' and mixes '+S.ana.camps.map(x=>C(x).short).join(' and '):''):'no missions, because her campaigns are paused'}.`,['#anaMissions','#pAna'])};

$('#resetBtn').onclick=()=>{S=FRESH();writeBrief();renderAll()};
$$('[data-show]').forEach(b=>b.onclick=()=>{$('#stage').dataset.show=b.dataset.show;$$('[data-show]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
function curTheme(){const a=document.documentElement.getAttribute('data-theme');return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
const paintTheme=()=>$('#themeBtn').textContent=curTheme()==='dark'?'Light':'Dark';
$('#themeBtn').onclick=()=>{document.documentElement.setAttribute('data-theme',curTheme()==='dark'?'light':'dark');paintTheme()};paintTheme();
renderAll();
})();
</script>

</body></html>
