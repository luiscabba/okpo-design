const look=(scope,path)=>path.split('.').reduce((o,k)=>o==null?undefined:o[k],scope);
const HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
const sub=(str,scope)=>str.replace(HOLE,(_,p)=>{const v=p==='true'?true:p==='false'?false:look(scope,p);return v==null?'':String(v)});
function walk(node,scope){
  [...node.childNodes].forEach(ch=>{
    if(ch.nodeType===3){if(ch.nodeValue.includes('{{'))ch.nodeValue=sub(ch.nodeValue,scope);return}
    if(ch.nodeType!==1)return;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-if'){const m=/\{\{\s*([^}]+?)\s*\}\}/.exec(ch.getAttribute('value')||'');const ok=m?!!look(scope,m[1]):false;
      if(!ok){ch.remove();return}const frag=document.createDocumentFragment();while(ch.firstChild)frag.appendChild(ch.firstChild);walk(frag,scope);ch.replaceWith(frag);return}
    if(tag==='sc-for'){const m=/\{\{\s*([^}]+?)\s*\}\}/.exec(ch.getAttribute('list')||'');const list=(m&&look(scope,m[1]))||[];const as=ch.getAttribute('as')||'item';
      const out=document.createDocumentFragment();list.forEach((it,i)=>{const c=ch.cloneNode(true);const s=Object.assign({},scope,{[as]:it,index:i});walk(c,s);while(c.firstChild)out.appendChild(c.firstChild)});ch.replaceWith(out);return}
    [...ch.attributes].forEach(a=>{
      if(/^on[A-Z]/.test(a.name)||/^on[a-z]+$/.test(a.name)&&a.value.includes('{{')){const m=/\{\{\s*([^}]+?)\s*\}\}/.exec(a.value);const fn=m&&look(scope,m[1]);ch.removeAttribute(a.name);
        if(typeof fn==='function'){const ev=a.name.slice(2).toLowerCase();ch.addEventListener(ev,e=>{e.preventDefault();fn(e)})}return}
      if(a.value.includes('{{'))a.value=sub(a.value,scope)});
    walk(ch,scope)});
}
const tpl=document.getElementById('tpl'),frame=document.getElementById('frame');
function draw(){const vals=comp.renderVals();const frag=tpl.content.cloneNode(true);walk(frag,vals);frame.replaceChildren(frag);
  document.getElementById('stepLabel').textContent=vals.stepLabel||'';
  document.getElementById('prev').disabled=comp.state.step===0;document.getElementById('next').disabled=comp.state.step===12;}
function fit(){const w=Math.min(1440,document.documentElement.clientWidth-32);const k=w/1440;frame.style.transform='scale('+k+')';const h=document.getElementById('holder');h.style.width=w+'px';h.style.height=(940*k)+'px'}
document.getElementById('restart').onclick=()=>comp.setState({step:0,sens:null});
document.getElementById('prev').onclick=()=>comp.setState({step:Math.max(0,comp.state.step-1)});
document.getElementById('next').onclick=()=>{const s=comp.state.step;if(s===5&&!comp.state.sens)return;comp.setState({step:Math.min(12,s+1)})};
addEventListener('resize',fit);fit();draw();
</script>
</body>
