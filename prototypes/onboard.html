<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkPo Fast Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="../tokens.css">
<style>
/* Fast brand onboarding: one input, a few answer cards, live. Same five steps and components as setup.html (the detailed path).
   Brand setup base styles follow: the console new-brand flow (Sources, Read, Check facts, Rules, Test and publish), run full screen,
   one question per screen. The Brand context panel on the right fills as things are checked.
   Built from tokens.css and the console's own components and motion. Nothing here is new to the system. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}

/* backdrop: three crisp tone tiles, never moves */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute;display:block}

/* shell */
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:12px;z-index:30;margin:12px 16px 0;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:14px}
.brandsw{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:transparent;text-align:left;min-width:170px}
.gdot{width:28px;height:28px;border-radius:8px;background:#0d6efd;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.gdot.empty{background:transparent;border:1.5px dashed var(--mute);color:var(--mute)}
.stepper{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;min-width:0}
.step{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:500;border:0;background:transparent;padding:4px;white-space:nowrap}
.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:600 12px var(--mono);transition:background .25s,color .25s}
.step.on{color:var(--ink)}.step.on b{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.step.done b{background:var(--green);border-color:var(--green);color:#121212}
.step:disabled{cursor:default}
.sline{flex:0 1 40px;min-width:12px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}.sline i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s var(--ease)}
.stepmini{display:none;font-size:13px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;max-width:1200px;width:100%;margin:0 auto;padding:36px 24px 120px;align-items:start}
.main{width:100%;max-width:640px;justify-self:center;display:flex;flex-direction:column;gap:16px;min-width:0}
.main.wide{max-width:none}
.hd{display:flex;flex-direction:column;gap:6px}
.hd .label{display:inline-flex;align-items:center;gap:8px}
.hd h1{margin:0;font:800 32px/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:4px}

/* OkPo's guide line: first person, labelled, no avatar. Rises once, in one piece. */
.say{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--body);font-size:15px;line-height:1.5;max-width:60ch}
.say p{margin:0}

/* the console's components */
.card{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.txt{border:1px solid var(--line);border-radius:var(--r-field);padding:0 12px;height:42px;background:var(--glass-strong);width:100%;outline:none}
.txt:focus{border-color:var(--ink)}
textarea.txt{height:auto;padding:10px 12px;line-height:1.45;resize:vertical}
select.txt{appearance:auto}
.drop-z{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center;color:var(--body);background:transparent;width:100%;transition:background .2s,border-color .2s}
.drop-z:hover{background:var(--soft);border-color:var(--mute)}
.src{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);color:var(--mute)}
.kc{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kc p{margin:0}
.kc.flash{animation:flashk .7s var(--ease)}
@keyframes flashk{30%{box-shadow:0 0 0 3px var(--l-green),var(--glass-shadow);transform:scale(1.02)}}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--soft);min-width:0;min-height:120px}
.col .kc{background:var(--glass-strong);padding:11px 12px;gap:6px;font-size:13px}
.mini{padding:10px 12px;border-radius:12px;display:flex;align-items:flex-start;gap:8px;font-size:13px;min-width:0}
.scan{width:44px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--soft) 0%,var(--ink) 50%,var(--soft) 100%);background-size:220% 100%;animation:scan 1.1s linear infinite;flex:none}
@keyframes scan{from{background-position:120% 0}to{background-position:-120% 0}}
.dots{display:inline-flex;gap:4px;padding:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.opts{display:grid;gap:8px}
.opts button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;transition:border-color .2s,box-shadow .2s}
.opts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--glass-strong)}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mute);display:grid;place-items:center;background:transparent;padding:0;flex:none;transition:background .15s,border-color .15s;color:var(--ground)}
.cbx svg{transform:scale(0);transition:transform .2s var(--pop)}
[aria-checked="true"]>.cbx{background:var(--ink);border-color:var(--ink)}[aria-checked="true"]>.cbx svg{transform:scale(1)}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-row);border:1px solid var(--line);background:transparent;text-align:left;width:100%;transition:border-color .2s,background .2s}
.rrow[aria-checked="true"]{border-color:var(--ink);background:var(--glass-strong)}
.composer{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-radius:14px}
.composer input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:36px}
.chat{display:flex;flex-direction:column;gap:12px;min-height:200px;max-height:420px;overflow:auto}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--soft)}
.bub.ai{display:flex;gap:10px;padding:0;max-width:100%}
.kv2{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px 14px;font-size:14px}
.kv2>span:nth-child(odd){font:600 10.5px/1.7 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.why{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12.5px}

/* Brand context panel */
.ctx{position:sticky;top:88px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 104px);overflow:auto}
.ctx h2{margin:0;font:800 22px/1.1 var(--display);letter-spacing:-.03em}
.sec{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.prow span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.lit .rid{animation:lit .7s var(--ease)}
@keyframes lit{30%{box-shadow:0 0 0 2px var(--l-purple);transform:scale(1.08)}}
.vline{font:800 15px/1.25 var(--display);letter-spacing:-.02em}
.ctxbar{display:none}

/* sheet (phone) */
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:82vh;overflow:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 6px}
.sheet .ctx{position:static;max-height:none;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:12px 16px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.proto{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--btn);color:var(--on-btn);font:600 11.5px var(--mono)}
.proto button{border:0;background:transparent;color:inherit;border-radius:8px;padding:6px 9px;font:inherit}
.proto button:hover{background:rgba(127,127,127,.25)}

@media (max-width:1060px){
  .stepper .step span{display:none}
}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr);padding:16px 16px 120px;gap:14px}
  .body>.ctx{display:none}
  .ctxbar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;border:1px solid var(--glass-edge);font-size:13.5px}
  .stepper{display:none}.stepmini{display:block;flex:1;text-align:center}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .hd h1{font-size:26px}
  .top{margin:10px 10px 0;gap:10px;padding:8px 10px}
  .brandsw{min-width:0}.brandsw .bsw-t{display:none}
  .kv2{grid-template-columns:minmax(0,1fr);gap:2px 0}.kv2>span:nth-child(even){margin-bottom:10px}
  .proto{left:auto;right:12px}
}
/* fast onboarding additions */
.lvl{display:flex;flex-direction:column;gap:8px}
.lvl .segs{display:flex;gap:6px}
.lvl .segs i{display:block;flex:1;height:6px;border-radius:99px;background:var(--soft);transition:background .5s var(--ease)}
.lvl .segs i.on{background:var(--l-purple)}
.lvl .segs i.next{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--l-purple) 55%,transparent) 0 4px,color-mix(in srgb,var(--l-purple) 18%,transparent) 4px 8px)}
.trust{white-space:nowrap}
.fact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fact:first-of-type{border-top:0}
.fact b{font-weight:500}
.srow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.srow:first-of-type{border-top:0}
.srow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .small{white-space:nowrap}
.addrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.8fr) auto auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
.addrow:first-child{border-top:0}
.ans{display:grid;gap:8px}
.ans button{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:14px;padding:14px 16px;text-align:left;transition:border-color .2s,box-shadow .2s,background .2s}
.ans button:hover{background:var(--soft)}
.ans button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--glass-strong)}
.ans .k{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font:600 12px var(--mono);color:var(--mute)}
.ans button[aria-pressed="true"] .k{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.ans .o{display:flex;flex-direction:column;gap:5px;min-width:0}
.ans .line{font:800 19px/1.25 var(--display);letter-spacing:-.02em}
.min{display:flex;flex-direction:column;gap:2px}
.min .li{padding:8px 0}
.post{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line)}
.toprt{display:flex;align-items:center;gap:12px}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="shell" id="app"></div>
<div id="layer"></div>
<div class="proto" role="toolbar" aria-label="Prototype controls"><button type="button" id="pRestart">Restart</button><button type="button" id="pSkip">Skip to test</button><button type="button" id="pTheme">Dark</button></div>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,40):ms));
const EASE='cubic-bezier(.2,.8,.2,1)',POP='cubic-bezier(.34,1.56,.64,1)',POPS='cubic-bezier(.34,1.45,.64,1)',EXIT='cubic-bezier(.6,0,.3,1)';

const P={frame:'<path d="M0 0H100V100H0Z M27 27V73H73V27Z" fill-rule="evenodd" fill="C"/>',quarter:'<path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="C"/>',diamond:'<path d="M50 0L100 50L50 100L0 50Z M50 28L72 50L50 72L28 50Z" fill-rule="evenodd" fill="C"/>',half:'<path d="M0 100 A50 50 0 0 1 100 100 Z" fill="C"/><rect width="100" height="22" fill="C"/>',pin:'<path d="M0 0 L50 0 L50 50 Z M100 0 L100 50 L50 50 Z M100 100 L50 100 L50 50 Z M0 100 L0 50 L50 50 Z" fill="C"/>',petal:'<path d="M50 50 Q50 2 98 2 Q98 50 50 50 Z M50 50 Q98 50 98 98 Q50 98 50 50 Z M50 50 Q50 98 2 98 Q2 50 50 50 Z M50 50 Q2 50 2 2 Q50 2 50 50 Z" fill="C"/>'};
const COL={frame:'var(--coral)',quarter:'var(--green)',diamond:'var(--orange)',half:'var(--yellow)',pin:'var(--blue)',petal:'var(--purple)'};
function tile(k,s=14,outline){let b=P[k];b=outline?b.replace(/fill="C"/g,`style="fill:none;stroke:${outline};stroke-width:9"`).replace(/fill-rule="evenodd" /g,''):b.replace(/fill="C"/g,`style="fill:${COL[k]}"`);return `<svg width="${s}" height="${s}" viewBox="-5 -5 110 110" aria-hidden="true" style="flex:none;display:block">${b}</svg>`}
const IC={x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12l5 5 9-10"/>',doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',chev:'<path d="M9 6l6 6-6 6"/>',send:'<path d="M5 12h14M13 6l6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>'};
const ic=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;display:block">${IC[k]}</svg>`;
$('#bg').innerHTML=(innerWidth<700?[['quarter','left:-120px;top:-120px;width:420px;height:420px'],['petal','left:180px;top:140px;width:300px;height:300px'],['half','left:120px;top:520px;width:380px;height:380px']]:[['quarter','left:-260px;top:-360px;width:900px;height:900px'],['petal','left:45vw;top:-260px;width:640px;height:640px'],['half','left:48vw;top:58vh;width:820px;height:820px']]).map(([k,st])=>`<svg viewBox="-5 -5 110 110" style="${st}">${P[k].replace(/fill="C"/g,'style="fill:var(--tone)"')}</svg>`).join('');

/* ---------------- demo data (GCash) ---------------- */
const WEB=[{n:'gcash.com',d:'24 pages',web:1},{n:'Play Store · GCash',d:'listing and 200 reviews',web:1},{n:'facebook.com/gcashofficial',d:'30 recent posts',web:1},{n:'News',d:'6 articles, last 90 days',web:1},{n:'instagram.com/gcashofficial',d:'needs a login',web:1,bad:1}];
const EXTRA=[{n:'GCash Brand Book 2026.pdf',d:'42 pages · your file',use:'Voice, do and don’t',file:1},{n:'Fees and limits.xlsx',d:'3 sheets · your file',use:'Fees and limits',file:1,fees:1}];
const READ=[
 {id:'K1',t:'Free to join',tr:'src',src:'gcash.com'},
 {id:'K2',t:'Send to any PH bank',tr:'src',src:'gcash.com'},
 {id:'K3',t:'1,000+ billers',tr:'src',src:'gcash.com/bills'},
 {id:'K4',t:'GSave, no minimum',tr:'src',src:'gcash.com/gsave'},
 {id:'K5',t:'Cash in at 7-Eleven',tr:'src',src:'gcash.com/cashin'},
 {id:'K8',t:'Many send money home',tr:'guess',src:'Play Store reviews'},
 {id:'S1',t:'Verification takes about a day',tr:'src',src:'gcash.com/help',sens:'dates'},
 {id:'S2',t:'One valid ID to sign up',tr:'src',src:'gcash.com/help',sens:'eligibility'}];
const FEE={id:'S3',t:'Bank transfer fee, from your fee table',tr:'src',src:'Fees and limits.xlsx',sens:'money'};
const BOOK={id:'K9',t:'No hard sell; show the app doing the work',tr:'src',src:'Brand Book 2026.pdf, p.24'};
const WHO=[{v:'First-time users, 18 to 35',tr:'guess',src:'Play Store reviews'},{v:'Students and first-jobbers',tr:'guess',src:'facebook.com comments'},{v:'Families sending money home',tr:'guess',src:'Play Store reviews'}];
const VOICES=[{v:'Taglish, warm, short',line:'Libre lang mag-join, mga 5 minuto. Padala agad kay Nanay.',tr:'src',src:'facebook.com/gcashofficial'},{v:'Clear English',line:'Join free in about 5 minutes and send money the same day.',tr:'src',src:'gcash.com'},{v:'Playful',line:'5 minuto lang, libre pa. Ano pang hinihintay mo?',tr:'guess',src:'A guess from TikTok'}];
const MONEY=[{v:'₱50',d:'Welcome credit for new verified users',tr:'src',src:'gcash.com/promos'},{v:'₱100',d:'Welcome credit for new verified users',tr:'guess',src:'A news article, July'},{v:'Don’t mention it yet',d:'I stay quiet. It goes to To check.',tr:'',src:''}];
const RULES0=[{id:'R-03',t:'Never promise approval, loan amounts or dates',src:'Common for finance brands',on:true},{id:'R-04',t:'Never compare fees with other wallets',src:'Common for finance brands',on:true},{id:'R-09',t:'Don’t lead with loans or credit',src:'gcash.com/gcredit terms',on:true},{id:'R-10',t:'One campaign per post',src:'Common for finance brands',on:false}];
const OKPO=[['R-01','Turn on the paid partnership label'],['R-02','Say it’s paid, in words or with the label'],['R-11','Use your own tracked link'],['R-14','No minors on camera']];
const STEPS=['Sources','Read','Check','Rules','Test and publish'];
const STEP_OF=[0,1,2,2,2,3,4,4],LEVELS=['Just met','Learning','Knows you','Knows you well'];
const TR={conf:['ok','Confirmed'],src:['info','Sourced'],guess:['n','Guess']};

const fresh=()=>({step:0,site:'gcash.com',added:[],links:[],read:'no',srcDone:0,facts:[],who:null,whoOther:'',voice:null,money:null,rules:RULES0.map(r=>({...r})),published:false,checked:new Set(),sheet:false});
let S=fresh(),lastKey='',seen=new Set(),timers=[];
const later=(fn,ms)=>{const t=setTimeout(fn,RM?0:ms);timers.push(t);return t};
const trust=t=>t?`<span class="chip up trust ${TR[t][0]}">${TR[t][1]}</span>`:'';
const srcTag=(s,file)=>s?`<span class="src">${ic(file||/\.(pdf|xlsx|docx|pptx)/.test(s)?'doc':'link',12)}${esc(s)}</span>`:'';
const rulesOn=()=>S.rules.filter(r=>r.on);
const sensOpen=()=>S.facts.filter(f=>f.sens&&f.tr!=='conf');
const toCheck=()=>[...sensOpen(),...S.facts.filter(f=>f.tr==='guess'),...(S.money==='Don’t mention it yet'?[{id:'S4',t:'Welcome credit amount',sens:'money',tr:'',src:'You chose: don’t mention it yet'}]:[]),...(S.published?[{id:'Q1',t:'Can I use GCash abroad?',ask:1,tr:'',src:'Coach, test chat'}]:[])].filter(f=>!S.checked.has(f.id));
const minimum=()=>[['Who you want more of',!!(S.who||S.whoOther)],['Voice',!!S.voice],['At least 1 rule',(S.step>=5||S.published)&&rulesOn().length>0],['Every sensitive conflict answered',!!S.money]];
const minDone=()=>minimum().filter(m=>m[1]).length;

function toast(html){const t=document.createElement('div');t.className='toast glass strong';t.setAttribute('role','status');t.innerHTML=html;$('#layer').appendChild(t);
 if(!RM)t.animate([{opacity:0,transform:'translate(-50%,16px)'},{opacity:1,transform:'translateX(-50%)'}],{duration:350,easing:EASE});
 setTimeout(()=>{if(RM){t.remove();return}t.animate([{opacity:1},{opacity:0,transform:'translate(-50%,12px)'}],{duration:220}).finished.then(()=>t.remove())},3200)}
function bump(el){if(el&&!RM)el.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:260,easing:POP})}
const say=text=>`<div class="say" id="say"><span class="label">OkPo</span><p>${text}</p></div>`;
const head=(eyebrow,title)=>`<div class="hd"><span class="label" id="eyebrow">${tile('petal',14)}${eyebrow}</span><h1 id="h1">${title}</h1></div>`;
function navRow({back=true,primary='Continue',disabled=false,skip='',id='next'}={}){
 return `<div class="nav">${back?`<button type="button" class="ghost" data-act="back">Back</button>`:''}<span class="grow"></span>${skip?`<button type="button" class="link" data-act="skip">${skip}</button>`:''}<button type="button" class="btn" id="${id}" data-act="next" ${disabled?'disabled':''}>${primary}</button></div>`}

/* ---------------- the meter: how well I know the brand ---------------- */
function meter(){
 const lvl=S.published?2:1,pre=!S.published&&S.step===6&&minDone()===4;
 const right=S.published?'Next: Knows you':pre?'Publish to reach Learning':`${minDone()} of 4 to publish`;
 return `<div class="lvl" role="meter" aria-label="How well OkPo knows the brand" aria-valuemin="1" aria-valuemax="4" aria-valuenow="${lvl}" aria-valuetext="${LEVELS[lvl-1]}">
  <div class="row small" style="justify-content:space-between"><span><b style="color:var(--ink);font-weight:600">${LEVELS[lvl-1]}</b> · ${lvl} of 4</span><span style="${pre?'color:var(--l-purple)':''}">${right}</span></div>
  <div class="segs">${[0,1,2,3].map(i=>`<i class="${i<lvl?'on':pre&&i===lvl?'next':''}"></i>`).join('')}</div></div>`}

/* ---------------- Brand context panel ---------------- */
function panel(){
 const live=S.published,f=S.facts,tc=toCheck().length,v=S.voice,r=rulesOn();
 const row=(id,txt,t)=>`<div class="prow" data-p="${id}"><span class="rid k">${esc(id)}</span><span class="grow" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(txt)}</span>${trust(t)}</div>`;
 return `<div class="row"><span class="label grow" style="display:inline-flex;gap:8px;align-items:center">${tile('petal',14)}GCash · v1</span><span class="chip up ${live?'ok':'n'}">${live?'● Live':'Draft'}</span></div>
 <h2>Brand context</h2>${meter()}
 ${tc&&S.read==='done'?`<div class="mini" style="background:color-mix(in srgb,var(--yellow) 38%,transparent);color:var(--l-yellow);align-items:center"><b class="disp" style="font-size:22px">${tc}</b><span class="grow" style="line-height:1.35"><b>To check</b><br>Anyone at GCash or OkPo can check these.</span></div>`:''}
 <div class="sec"><div class="row"><span class="label grow">Facts</span><span class="cnt num">${f.length}</span></div>${f.slice(-7).map(x=>row(x.id,x.t,x.tr)).join('')||'<span class="small">Facts land here as I read.</span>'}${f.length>7?`<span class="small">+${f.length-7} more</span>`:''}</div>
 <div class="sec"><div class="row"><span class="label grow">Voice</span><span class="cnt num">${v?1:0}</span></div>${v?row('Voice',v,'conf'):'<span class="small">Picked on a card.</span>'}</div>
 <div class="sec"><div class="row"><span class="label grow">Rules</span><span class="cnt num">${S.step>=5||live?r.length+' + 4':'0'}</span></div>${S.step>=5||live?r.map(x=>`<div class="prow" data-p="${x.id}"><span class="rid">${x.id}</span><span>${esc(x.t)}</span></div>`).join('')+'<span class="small">Plus OkPo’s 4, the same for every brand.</span>':'<span class="small">Picked on a card.</span>'}</div>
 <div class="sec"><div class="row">${tile('quarter',14,'var(--mute)')}<span class="label grow">Campaign brief</span></div><span class="small">Written with each campaign.</span></div>`}
function paintPanel(){
 $$('[data-panel]').forEach(p=>p.innerHTML=panel());
 const bar=$('#ctxbar');if(bar)bar.innerHTML=barText();
 $$('[data-p]').forEach(el=>{const k=el.dataset.p+'|'+el.textContent;if(!seen.has(k)){seen.add(k);if(!RM&&lastKey)el.firstElementChild.animate([{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{duration:300,easing:POP})}})}
const barText=()=>`${tile('petal',16)}<span class="grow"><b>Brand context</b> · ${S.published?'Learning':'Just met'} · ${S.facts.length} facts</span>${ic('chev',14)}`;
function openSheet(){const l=$('#layer');l.insertAdjacentHTML('beforeend',`<div class="scrim" data-act="sheetclose"></div><div class="sheet glass strong" role="dialog" aria-modal="true" aria-label="Brand context"><div class="grab"></div><div class="row" style="justify-content:flex-end"><button class="ghost" type="button" data-act="sheetclose" aria-label="Close">${ic('x',14)}</button></div><div class="ctx" data-panel>${panel()}</div></div>`);
 const sh=$('.sheet',l);if(!RM){sh.animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:340,easing:EASE});$('.scrim',l).animate([{opacity:0},{opacity:1}],{duration:240})}sh.querySelector('button').focus()}
function closeSheet(){const l=$('#layer'),sh=$('.sheet',l),sc=$('.scrim',l);if(!sh)return;if(RM){sh.remove();sc.remove();return}
 sh.animate([{transform:'none'},{transform:'translateY(100%)'}],{duration:240,easing:EXIT}).finished.then(()=>sh.remove());sc.animate([{opacity:1},{opacity:0}],{duration:220}).finished.then(()=>sc.remove())}

/* ---------------- top bar ---------------- */
function topbar(){
 const cur=STEP_OF[S.step],pub=S.published,named=S.step>0;
 const steps=STEPS.map((s,i)=>{const done=pub||i<cur,on=!pub&&i===cur;return `<span class="step ${on?'on':done?'done':''}" ${on?'aria-current="step"':''}><b>${done?ic('check',13):i+1}</b><span>${s}</span></span>${i<4?`<span class="sline"><i style="width:${done?100:0}%"></i></span>`:''}`}).join('');
 return `<header class="top glass strong"><span class="wm" style="font-size:24px" role="img" aria-label="OkPo"><span>O</span><span>k</span><span>P</span><span>o</span></span>
 <button type="button" class="brandsw" id="brandBtn" data-act="brand">${named?'<span class="gdot">G</span>':'<span class="gdot empty">+</span>'}<span class="grow bsw-t"><b style="display:block;font-weight:600">${named?'GCash':'New brand'}</b><span class="small">${pub?'Brand context v1':named?'Setting up':'New brand'}</span></span></button>
 <nav class="stepper" aria-label="Setup steps">${steps}</nav><span class="stepmini">${pub?'Live':`${cur+1} of 5 · ${STEPS[cur]}`}</span>
 ${pub?'':`<a class="link" href="setup.html" style="white-space:nowrap">Set up in detail</a>`}</header>`}

/* ---------------- screens ---------------- */
function answerCard({items,key,group,other=true,skip=true}){
 return `<div class="ans" role="group" aria-label="${esc(group)}">${items.map((o,i)=>`<button type="button" data-pick="${key}" data-v="${esc(o.v)}" aria-pressed="${S[key]===o.v}"><span class="k">${i+1}</span><span class="o">${o.line?`<span class="small">${esc(o.v)}</span><span class="line">${esc(o.line)}</span>`:`<b style="font-weight:600;font-size:15px">${esc(o.v)}</b>${o.d?`<span class="small">${esc(o.d)}</span>`:''}`}${srcTag(o.src)}</span>${trust(o.tr)}</button>`).join('')}</div>
 ${other?`<form class="composer glass strong" data-form="other-${key}"><input id="other-${key}" placeholder="Something else" aria-label="Something else" autocomplete="off" value="${esc(key==='who'?S.whoOther:'')}"><button class="btn sm" type="submit">Use this</button></form>`:''}
 <span class="small">Press 1 to ${items.length} to answer.${skip?' Or skip for now; it goes to To check.':''}</span>`}

function screen(){
 const st=S.step;
 if(st===0){const n=S.added.length+S.links.length;
  return [head('New brand context','What’s the brand’s website?')+say('Hi, I’m OkPo. Give me a website and I’ll do the reading: your site, app store pages, public socials and the news. Got files? They help with what websites don’t say: fees, rules, what you’ve tried. About 3 minutes.')+
  `<div class="card glass strong"><label class="field"><span class="label">Website or brand name</span><input class="txt" id="fSite" value="${esc(S.site)}" autocomplete="off" placeholder="e.g. gcash.com" style="height:52px;font-size:18px;font-weight:600"></label>
  <div class="sec" style="gap:10px"><div class="row" style="align-items:baseline"><span class="label">Add more</span><span class="small">Optional. Skip it and I’ll read the website alone.</span></div>
  <button type="button" class="drop-z" data-act="addfile" style="flex-direction:row;justify-content:flex-start;text-align:left;gap:14px;padding:16px"><span style="width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--purple) 24%,transparent);color:var(--l-purple);display:grid;place-items:center;flex:none">${ic('up',18)}</span><span class="grow"><b style="color:var(--ink)">Drop files or browse</b><br><span class="small">Brand book, decks, FAQs, price lists. Click to add a sample.</span></span></button>
  <form class="composer glass" data-form="link" style="border:1px solid var(--line)"><span style="color:var(--mute)">${ic('link',16)}</span><input id="linkIn" placeholder="Paste a link: Drive, Notion, a social page, a landing page" aria-label="Paste a link" autocomplete="off"><button class="ghost" type="submit" style="display:inline-flex;gap:6px;align-items:center">${ic('plus',14)}Add</button></form>
  ${n?`<div id="adds">${[...S.added.map((f,i)=>({...f,k:'f'+i})),...S.links.map((l,i)=>({...l,k:'l'+i}))].map(x=>`<div class="addrow" data-add="${x.k}"><span style="color:var(--mute)">${ic(x.file?'doc':'link',15)}</span><span><b style="font-weight:500">${esc(x.n)}</b><br><span class="small">${esc(x.d)}</span></span><span class="small" style="color:var(--body)">${esc(x.use)}</span>${x.priv?'<span class="chip warn up">Needs sharing</span>':'<span class="chip ok up">Added</span>'}<button class="ghost" type="button" data-rm="${x.k}" aria-label="Remove ${esc(x.n)}" style="padding:6px">${ic('x',13)}</button></div>`).join('')}</div>`:''}
  ${S.links.some(l=>l.priv)?'<span class="small" style="color:var(--l-yellow)">That page is private. Share it with OkPo, or I’ll skip it.</span>':''}</div></div>
  <span class="small">Public pages only, plus what you add. Nothing goes live until you publish.</span>`+
  navRow({back:false,primary:'Read it',disabled:!S.site.trim()})]}
 if(st===1){const run=S.read==='run',srcs=[...S.added.map(f=>({...f})),...S.links.filter(l=>!l.priv),...WEB];
  return [head('Read',run?`Reading ${esc(S.site)}`:'Here’s what I found')+say(run?'Each fact says where it came from. Sourced means I found it on your own pages or files. Guess means I inferred it; I won’t say a guess until you confirm it.':readDone())+
  `<div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)">
   <div class="card glass strong"><div class="row"><span class="label grow">Sources</span><span class="disp num" style="font-size:28px" id="scount">${S.srcDone}</span><span class="small">read</span></div>
   <div>${srcs.map((f,i)=>`<div class="srow"><span style="color:var(--mute)">${ic(f.file?'doc':'link',14)}</span><b style="font-weight:500" class="grow">${esc(f.n)}</b><span class="small">${esc(f.d)}</span><span data-scan="${i}">${i<S.srcDone||!run?(f.bad?'<span class="chip warn up">Couldn’t read</span>':`<span style="color:var(--l-green)">${ic('check',14)}</span>`):'<span class="scan"></span>'}</span></div>`).join('')}</div></div>
   <div class="card glass"><span class="label">What I think GCash is</span><div id="flist">${S.facts.map(factRow).join('')||'<span class="small" id="fempty">Facts land here as I read.</span>'}</div></div></div>`+
  navRow({primary:'Continue',disabled:run})]}
 if(st===2)return [head('Check · 1 of 3','Who do you want more of?')+say('I read your reviews and posts. Pick the group you want OkPo to bring in. You can change it later.')+answerCard({items:WHO,key:'who',group:'Who you want more of'})+navRow({disabled:!(S.who||S.whoOther),skip:'Skip for now'})];
 if(st===3)return [head('Check · 2 of 3','Which one sounds like you?')+say('Same line, three ways. Hear it, don’t describe it.')+answerCard({items:VOICES,key:'voice',group:'Voice',skip:false})+navRow({disabled:!S.voice})];
 if(st===4)return [head('Check · 3 of 3','Your sources disagree on money.')+say('Your website says a ₱50 welcome credit. A news article says ₱100. I won’t guess with money, so this one needs an answer to publish. “Don’t mention it yet” counts.')+answerCard({items:MONEY,key:'money',group:'Welcome credit',other:false,skip:false})+navRow({disabled:!S.money})];
 if(st===5){const on=rulesOn().length;
  return [head('Rules','What should stop a post?')+say('I ticked the ones finance brands almost always need. Untick any that don’t fit. Each one stops a post from counting.')+
  `<div style="display:flex;flex-direction:column;gap:8px" role="group" aria-label="Rules">${S.rules.map((r,i)=>`<button type="button" class="rrow" role="checkbox" aria-checked="${r.on}" data-rule="${i}"><span class="cbx">${ic('check',13)}</span><span class="grow"><b style="display:block;font-weight:500">${esc(r.t)}</b><span class="src" style="margin-top:4px">${ic('doc',12)}${esc(r.src)}</span></span><span class="rid">${r.id}</span><span class="chip fix up">Fail</span></button>`).join('')}</div>
  <form class="composer glass strong" data-form="rule"><input id="ruleIn" placeholder="Add a rule, e.g. Never show another wallet’s app" aria-label="Add a rule" autocomplete="off"><button class="btn sm" type="submit">Add</button></form>
  <div class="card glass"><span class="label">Set by OkPo · the same for every brand</span>${OKPO.map(([id,t])=>`<div class="li"><span style="color:var(--mute)">${ic('lock',15)}</span><span class="rid">${id}</span><span class="grow">${esc(t)}</span></div>`).join('')}</div>`+
  navRow({disabled:!on,primary:on?`Use ${on} rule${on===1?'':'s'}`:'Tick at least one'})]}
 if(st===6){const vline=(VOICES.find(v=>v.v===S.voice)||VOICES[0]).line,all=minDone()===4,cr=S.money&&S.money!=='Don’t mention it yet'?S.money:null;
  return [head('Test and publish','Here’s what I’ll write.')+say('A sample post for tomorrow’s brief, and how I handle a question I can’t answer yet. Publish when the minimum is in.')+
  `<div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
   <div class="post"><span class="label">Sample post · tomorrow’s brief</span><b class="disp" style="font-size:19px;line-height:1.25">${esc(vline)}${cr?` May ${esc(cr)} welcome credit pa.`:''}</b><div class="row" style="flex-wrap:wrap;gap:6px"><span class="rid k">K1</span><span class="rid k">Voice</span>${cr?'<span class="rid k">K10</span>':''}<span class="rid">R-03</span></div><span class="small">Every line names the fact or rule it used.</span></div>
   <div class="post"><span class="label">The coach · an earner asks</span><div class="bub me" style="align-self:flex-start;background:var(--soft)">Magkano ang cash out fee papuntang bank?</div><div class="bub ai">${tile('petal',20)}<div><span>Hindi ko pa po sigurado, kaya hindi ako manghuhula. Ipapasa ko ito sa GCash team.</span><div style="margin-top:6px"><span class="chip warn up">Handed off · To check</span></div></div></div></div></div>
  <div class="card glass strong"><div class="row"><span class="label grow">Minimum to publish</span><span class="cnt num">${minDone()} of 4</span></div><div class="min">${minimum().map(([l,ok])=>`<div class="li"><span style="color:${ok?'var(--l-green)':'var(--mute)'}">${ic(ok?'check':'x',15)}</span><span class="grow">${l}</span>${ok?'':'<button class="ghost" type="button" data-fix="'+l+'">Answer</button>'}</div>`).join('')}</div>
  <span class="small">${toCheck().length} things go to To check. I won’t say them until someone confirms them.</span></div>`+
  navRow({primary:'Publish v1',id:'publish',disabled:!all})]}
 if(st===7){const tc=toCheck();
  return [head('Brand context · v1','It’s live.')+say('I know enough to write daily briefs in your voice. The rest is in To check; anyone at GCash or OkPo can confirm it, and each one goes live in the next brief.')+
  `<div class="card glass strong"><div class="row"><span class="label grow">To check</span><span class="cnt warn num">${tc.length}</span></div>
  ${tc.length?tc.map(f=>`<div class="li" data-tc="${f.id}"><span class="grow"><b style="font-weight:500">${esc(f.t)}</b><br><span class="small">${f.ask?'Asked by an earner':f.sens?'Sensitive · '+f.sens:'Audience'} · ${esc(f.src)}</span></span>${f.tr?trust(f.tr):'<span class="chip n up">Missing</span>'}<button class="ghost" type="button" data-confirm="${f.id}">${f.tr?'Confirm':'Answer'}</button></div>`).join(''):'<span class="small">Nothing left. Everything I say is confirmed or sourced.</span>'}</div>
  <div class="nav"><span class="grow"></span><a class="btn" href="console.html" style="text-decoration:none">Open the console</a></div>`]}
}
function factRow(f){return `<div class="fact" data-f="${f.id}"><span><b>${esc(f.t)}</b>${f.sens?` <span class="small">· sensitive</span>`:''}<br>${srcTag(f.src)}</span>${trust(f.tr)}</div>`}
function readDone(){const g=S.facts.filter(f=>f.tr==='guess').length,s=S.facts.filter(f=>f.sens).length,bad=WEB.find(w=>w.bad);
 return `Done. ${S.facts.length} facts: ${g} guess${g===1?'':'es'} and ${s} sensitive ones I won’t say until confirmed. I couldn’t read ${esc(bad.n)}; it ${esc(bad.d)}. Three quick questions next.`}

/* ---------------- render ---------------- */
function render(focusId){
 const key='s'+S.step,changed=key!==lastKey;
 const [inner,nav]=screen();
 const wide=S.step===1||S.step===6;
 $('#app').innerHTML=topbar()+`<div class="body"><main class="main${wide?' wide':''}" id="main"><button type="button" class="ctxbar glass" id="ctxbar" data-act="sheet">${barText()}</button>${inner}${nav||''}</main><aside class="ctx glass" data-panel aria-label="Brand context"></aside></div>`;
 paintPanel();
 if(changed&&lastKey){window.scrollTo(0,0);if(!RM)$('#main').animate([{opacity:0},{opacity:1}],{duration:260,easing:EASE})}
 lastKey=key;
 if(focusId){const el=document.getElementById(focusId);if(el)el.focus({preventScroll:true})}
}
function go(step){timers.forEach(clearTimeout);timers=[];S.step=step;closeSheet();if(step===1&&S.read!=='done'){startRead();return}render()}

/* Read: sources tick one by one, facts land with their trust level */
function startRead(){S.facts=[];S.srcDone=0;S.read='run';render();
 const srcs=[...S.added,...S.links.filter(l=>!l.priv),...WEB];
 const items=[...READ];if(S.added.some(f=>f.fees))items.splice(2,0,{...FEE});if(S.added.some(f=>f.file&&!f.fees))items.splice(1,0,{...BOOK});
 let i=0,s=0;
 const tickSrc=()=>{if(S.step!==1||S.read!=='run'||s>=srcs.length)return;const el=$(`[data-scan="${s}"]`),f=srcs[s];s++;S.srcDone=s;
  if(el){el.innerHTML=f.bad?'<span class="chip warn up">Couldn’t read</span>':`<span style="color:var(--l-green)">${ic('check',14)}</span>`;if(!RM)el.firstElementChild.animate([{transform:'scale(.6)',opacity:0},{transform:'none',opacity:1}],{duration:300,easing:POP})}
  const c=$('#scount');if(c){c.textContent=s;bump(c)}later(tickSrc,520)};
 const tickFact=()=>{if(S.step!==1||S.read!=='run')return;if(i>=items.length){later(finishRead,Math.max(0,(srcs.length-s)*520+200));return}
  const f=items[i++];S.facts.push(f);const l=$('#flist');$('#fempty')?.remove();
  if(l){l.insertAdjacentHTML('beforeend',factRow(f));const el=l.lastElementChild;if(!RM)el.animate([{opacity:0,transform:'translateY(14px) scale(.96)'},{opacity:1,transform:'none'}],{duration:420,easing:POPS})}
  paintPanel();later(tickFact,i<2?800:420)};
 later(tickSrc,500);later(tickFact,900)}
function finishRead(){if(S.step!==1)return;S.read='done';S.srcDone=[...S.added,...S.links.filter(l=>!l.priv),...WEB].length;
 const h=$('#h1');if(h)h.textContent='Here’s what I found';
 const sy=$('#say p');if(sy){sy.innerHTML=readDone();if(!RM)$('#say').animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:EASE})}
 const b=$('#next');if(b)b.disabled=false;paintPanel()}

/* picking an answer card confirms it into Brand context */
function pick(key,v){
 if(key==='who'){S.who=v;S.whoOther='';S.facts=S.facts.filter(f=>f.id!=='K6');S.facts.push({id:'K6',t:v,tr:'conf',src:'You picked it'})}
 if(key==='voice'){S.voice=v}
 if(key==='money'){S.money=v;S.facts=S.facts.filter(f=>f.id!=='K10');if(v!=='Don’t mention it yet')S.facts.push({id:'K10',t:v+' welcome credit',tr:'conf',src:'You settled it',sens:'money'})}
 $$(`[data-pick="${key}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===v)));
 const n=$('#next');if(n)n.disabled=false;paintPanel();
 later(()=>{if(S.step===2&&key==='who')go(3);else if(S.step===3&&key==='voice')go(4);else if(S.step===4&&key==='money')go(5)},RM?0:420)}

/* Publish: the console's moment, then the meter fills to Learning */
function publish(){const btn=$('#publish'),target=$('#brandBtn');
 const done=()=>{S.published=true;go(7);
  const bb=$('#brandBtn');if(bb&&!RM)bb.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:420});
  const seg=$$('.ctx .lvl .segs i')[1];if(seg&&!RM)seg.animate([{transform:'scaleX(.2)',transformOrigin:'left'},{transform:'scaleX(1)',transformOrigin:'left'}],{duration:600,easing:EASE});
  toast(`${tile('petal',16)}<span><b>GCash brand context v1 is live.</b> I’m at Learning. The coach, daily briefs and every OkPo page use it now.</span>`)};
 if(RM||!btn||!target){done();return}btn.disabled=true;
 const r=btn.getBoundingClientRect(),t=target.getBoundingClientRect(),g=document.createElement('div');g.innerHTML=tile('petal',46);
 g.style.cssText=`position:fixed;left:${r.left+r.width/2-23}px;top:${r.top+r.height/2-23}px;z-index:90;pointer-events:none`;document.body.appendChild(g);
 const dx=t.left+22-(r.left+r.width/2),dy=t.top+20-(r.top+r.height/2);
 g.animate([{transform:'scale(.2) rotate(0)',opacity:0},{transform:'scale(1.5) rotate(45deg)',opacity:1,offset:.35},{transform:'scale(1.5) rotate(45deg)',offset:.55},{transform:`translate(${dx}px,${dy}px) scale(.4) rotate(90deg)`,opacity:.9}],{duration:1300,easing:EXIT}).finished.then(()=>{g.remove();done()})}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-act]');if(!b||b.closest('.proto'))return;const d=b.dataset;
 if(d.act==='sheet'){openSheet();return}
 if(d.act==='sheetclose'){closeSheet();return}
 if(d.act==='brand'){toast(S.published?'Switch brands from the console.':'Brands switch in the console once this one is live.');return}
 if(d.act==='next'){if(S.step===6){publish();return}go(S.step+1);return}
 if(d.act==='back'){go(Math.max(0,S.step-1));return}
 if(d.act==='skip'){if(S.step===2){S.who=null;go(3)}return}
 if(d.act==='addfile'){const f=EXTRA.find(a=>!S.added.some(x=>x.n===a.n));if(!f){toast('All the sample files are added.');return}S.added.push(f);S.read='no';render();const rows=$$('[data-add]');const row=rows[S.added.length-1];if(row&&!RM)row.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,easing:EASE});return}
 if(d.rm){const k=d.rm,i=+k.slice(1);(k[0]==='f'?S.added:S.links).splice(i,1);S.read='no';render();return}
 if(d.pick){pick(d.pick,d.v);return}
 if(d.rule!==undefined){const r=S.rules[+d.rule];r.on=!r.on;b.setAttribute('aria-checked',String(r.on));paintPanel();const n=rulesOn().length,nx=$('#next');nx.disabled=!n;nx.textContent=n?`Use ${n} rule${n===1?'':'s'}`:'Tick at least one';return}
 if(d.fix){go(d.fix.startsWith('Who')?2:d.fix==='Voice'?3:d.fix.startsWith('At least')?5:4);return}
 if(d.confirm){const id=d.confirm,f=S.facts.find(x=>x.id===id);if(f){f.tr='conf'}S.checked.add(id);const row=$(`[data-tc="${id}"]`);const fin=()=>{render();toast(`${tile('petal',16)}<span><b>Confirmed.</b> It goes live in the next brief.</span>`)};if(row&&!RM)row.animate([{opacity:1},{opacity:0,transform:'translateX(8px)'}],{duration:220}).finished.then(fin);else fin();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fSite'){S.site=t.value;S.read='no';$('#next').disabled=!t.value.trim()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form;
 if(k==='link'){const i=$('#linkIn'),v=i.value.trim();if(!v){i.focus();return}const priv=/notion|docs\.google|drive\.google/i.test(v);S.links.push({n:v.replace(/^https?:\/\//,''),d:'link'+(priv?' · private page':''),use:/tiktok|instagram|facebook|youtube/i.test(v)?'How you sound':'Read for facts',priv});S.read='no';render('linkIn');return}
 if(k==='rule'){const i=$('#ruleIn'),v=i.value.trim();if(!v){i.focus();return}const n=Math.max(15,...S.rules.map(r=>+r.id.slice(2)+1));S.rules.push({id:'R-'+n,t:v,src:'Added by you',on:true});render('ruleIn');return}
 if(k==='other-who'){const v=$('#other-who').value.trim();if(!v)return;S.whoOther=v;pick('who',v);return}
 if(k==='other-voice'){const v=$('#other-voice').value.trim();if(!v)return;pick('voice',v);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();return}
 if(/^[1-4]$/.test(e.key)&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){const key={2:'who',3:'voice',4:'money'}[S.step];if(!key)return;const btns=$$(`[data-pick="${key}"]`),b=btns[+e.key-1];if(b){b.focus();pick(key,b.dataset.v)}}});

/* prototype controls */
const theme=()=>document.documentElement.getAttribute('data-theme')==='dark';
$('#pTheme').onclick=()=>{document.documentElement.setAttribute('data-theme',theme()?'light':'dark');$('#pTheme').textContent=theme()?'Light':'Dark'};
$('#pRestart').onclick=()=>{timers.forEach(clearTimeout);timers=[];S=fresh();lastKey='';seen=new Set();closeSheet();render()};
$('#pSkip').onclick=()=>{timers.forEach(clearTimeout);timers=[];S.facts=[...READ];S.read='done';S.srcDone=WEB.length;pick('who',WHO[0].v);S.voice=VOICES[0].v;pick('money','₱50');timers.forEach(clearTimeout);timers=[];go(6)};
document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')||'light');
render();
})();
</script>
