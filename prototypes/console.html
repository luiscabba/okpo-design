<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>OkPo Brand Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a glass sidebar and a working area over the calm tone-on-tone ground. Every section shares one campaign state, so an action in one place updates the others. */
:root{
  --ground:#f6f1e4; --tone:#ebe2cc; --ink:#121212; --body:#4a4640; --mute:#6a655c; --line:rgba(18,18,18,.12);
  --glass-a:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.44); --glass-edge:rgba(255,255,255,.95); --glass-shadow:0 16px 36px rgba(18,18,18,.10);
  --glass-strong:rgba(255,255,255,.82); --soft:rgba(18,18,18,.06); --scrim:rgba(18,18,18,.28);
  --coral:#ff8787; --yellow:#ffd43b; --orange:#ffa94d; --green:#69db7c; --blue:#74c0fc; --purple:#b197fc;
  --l-green:#237a36; --l-coral:#c92a2a; --warn-bg:rgba(255,212,59,.38); --warn-ink:#6b4e00;
  --s-okpo:#e8590c; --s-gcash:#1c7ed6;
  --btn:#121212; --on-btn:#f6f1e4;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --text:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* Light first (settled 1 Oct): dark only when the person picks it. */
@media (prefers-color-scheme: dark){:root[data-theme="system-dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12);
  --glass-a:rgba(40,40,40,.7); --glass-b:rgba(18,18,18,.6); --glass-edge:rgba(255,255,255,.18); --glass-shadow:0 16px 36px rgba(0,0,0,.5);
  --glass-strong:rgba(32,32,32,.88); --soft:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.55);
  --l-green:#69db7c; --l-coral:#ff8787; --warn-bg:rgba(255,212,59,.2); --warn-ink:#ffd43b;
  --s-okpo:#ff8a3d; --s-gcash:#4dabf7; --btn:#ececec; --on-btn:#121212; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12);
  --glass-a:rgba(40,40,40,.7); --glass-b:rgba(18,18,18,.6); --glass-edge:rgba(255,255,255,.18); --glass-shadow:0 16px 36px rgba(0,0,0,.5);
  --glass-strong:rgba(32,32,32,.88); --soft:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.55);
  --l-green:#69db7c; --l-coral:#ff8787; --warn-bg:rgba(255,212,59,.2); --warn-ink:#ffd43b;
  --s-okpo:#ff8a3d; --s-gcash:#4dabf7; --btn:#ececec; --on-btn:#121212; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}.num{font-variant-numeric:tabular-nums}
.label{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.small{font-size:12.5px;color:var(--mute)}.sub{color:var(--body)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.spacer{flex:1}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.wm{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1;display:inline-flex}
.wm span:nth-child(1){color:var(--coral)}.wm span:nth-child(2){color:var(--yellow)}.wm span:nth-child(3){color:var(--green)}.wm span:nth-child(4){color:var(--blue)}
.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),var(--glass-shadow);border-radius:20px}
.glass.strong{background:var(--glass-strong)}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute;display:block}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:244px minmax(0,1fr);gap:16px;padding:16px;min-height:100%}
.side{padding:18px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px)}
.brandsw{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px}
.gdot{width:28px;height:28px;border-radius:8px;background:#0d6efd;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;height:38px;padding:0 12px;text-align:left;color:var(--body);transition:background .2s}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:600}
.nav button.sub{height:30px;padding-left:44px;font-size:13px}
.nav .badge{margin-left:auto}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:13px;color:var(--body);transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 16px}
.view{display:flex;flex-direction:column;gap:14px;min-width:0}
.hd{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hd .t{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px}
.hd h1{margin:0;font:800 32px/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:600;background:var(--btn);color:var(--on-btn);transition:transform .12s var(--ease),filter .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.y{background:var(--btn);color:var(--on-btn)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:500;transition:background .2s}
.ghost:hover:not(:disabled){background:var(--soft)}
.card{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font:600 16px/1.3 var(--text)}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font:800 30px/1 var(--display);letter-spacing:-.03em}
.meter{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink);width:0;transition:width .8s var(--ease)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;padding:4px 8px;border-radius:99px;white-space:nowrap;text-transform:uppercase}
.chip.ok{background:rgba(105,219,124,.22);color:var(--l-green)}.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}.chip.fix{background:rgba(255,135,135,.2);color:var(--l-coral)}.chip.n{background:var(--soft);color:var(--body)}
.cnt{font:600 11px/1 var(--mono);padding:3px 7px;border-radius:99px;background:var(--soft);color:var(--body)}
.cnt.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;background:transparent;transition:background .2s,color .2s}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .chip{white-space:normal;line-height:1.25;text-align:left}
.tbl tr.click{cursor:pointer;transition:background .15s}.tbl tr.click:hover td{background:var(--soft)}
.tablewrap{overflow-x:auto}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--body);flex:none}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--mute);display:grid;place-items:center;background:transparent;padding:0;flex:none;transition:background .15s,border-color .15s}
.cbx[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.cbx svg{transform:scale(0);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}.cbx[aria-checked="true"] svg{transform:scale(1)}
.switch{width:40px;height:23px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .22s cubic-bezier(.34,1.56,.64,1)}
.switch[aria-checked="true"]{background:var(--green)}.switch[aria-checked="true"]::after{left:20px;background:#121212}
.tok{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 6px 4px 11px;background:var(--soft);font-size:13px;animation:pop .25s cubic-bezier(.34,1.56,.64,1)}
.tok button{border:0;background:transparent;padding:2px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.inp{border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--glass-strong);min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inp input{border:0;background:transparent;outline:none;min-width:120px;flex:1;height:30px}
.field{display:flex;flex-direction:column;gap:6px}
.txt{border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;background:var(--glass-strong);width:100%}
.src{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--mono);color:var(--mute)}
.srcc{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--mono);letter-spacing:.06em;padding:4px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 10px/1 var(--mono);letter-spacing:.06em;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--body);text-transform:uppercase}
.kc{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .3s var(--ease)}
.kc p{margin:0}
.kc.flash{animation:flashk .7s var(--ease)}
@keyframes flashk{30%{box-shadow:0 0 0 3px var(--green),var(--glass-shadow);transform:scale(1.02)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.angle{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.angle.drag{box-shadow:0 18px 40px rgba(0,0,0,.18);cursor:grabbing;z-index:2;position:relative}
.angle input[type=range]{width:120px;accent-color:var(--ink)}
.handle{color:var(--mute);display:grid;place-items:center}
.pv{border-radius:26px;border:1px solid var(--line);padding:14px;background:var(--glass-strong);display:flex;flex-direction:column;gap:8px}
.pv .line{animation:rise .35s var(--ease) both}
.why{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12.5px}
.why .w{animation:rise .3s var(--ease) both}
.chat{display:flex;flex-direction:column;gap:12px;min-height:180px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.5;animation:rise .3s var(--ease)}
.bub.me{align-self:flex-end;background:var(--soft)}
.bub.ai{display:flex;gap:10px;padding:0;max-width:100%}
.dots{display:inline-flex;gap:4px;padding:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-radius:14px}
.composer input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:36px}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px}
.step{display:flex;align-items:center;gap:8px;color:var(--mute);font-weight:500;border:0;background:transparent;padding:4px}
.step b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font:600 12px var(--mono);transition:background .25s,color .25s}
.step.on{color:var(--ink)}.step.on b{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.step.done b{background:var(--green);border-color:var(--green);color:#121212}
.sline{flex:1;min-width:16px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}.sline i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s var(--ease)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;transition:border-color .2s,box-shadow .2s}
.opts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ccard{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--glass-strong);display:flex;flex-direction:column}
.ccard .top{padding:18px;background:var(--tone);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.ccard .body{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.flipnum{display:inline-block;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--soft);min-width:0}
.mini{padding:10px 12px;border-radius:12px;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0;animation:rise .35s var(--ease) both}
.fun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fun>div{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fun .v{font:800 28px/1 var(--display);letter-spacing:-.03em}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--body)}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chartwrap{position:relative}
.chartwrap .tip{position:absolute;pointer-events:none;padding:8px 10px;border-radius:10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s}
.bar-rect{transition:height .7s var(--ease),y .7s var(--ease)}
.tl{display:flex;flex-direction:column}
.tl .s{display:flex;gap:12px;align-items:flex-start;padding:9px 0;opacity:0;animation:rise .35s var(--ease) forwards}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:4px;flex:none}
.tl .d.off{background:transparent;border:2px solid var(--mute)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:60;padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px;border-radius:22px 0 0 22px;overflow:auto}
.scrim{position:fixed;inset:0;z-index:55;background:var(--scrim)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;width:min(480px,calc(100% - 32px));padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;padding:12px 16px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);animation:up .35s var(--ease)}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translateX(-50%)}}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.ex{font:500 11px/1.3 var(--mono);color:var(--mute)}
.need{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);border:0;text-align:left;flex:1;min-width:220px;transition:background .2s}
.need:hover{background:var(--line)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--line)}
.bars .d{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.bars .d i{flex:1;border-radius:4px 4px 0 0;display:block;height:0;transition:height .8s var(--ease)}
.ladder{display:flex;flex-direction:column;gap:6px;position:relative}
.rung{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);transition:box-shadow .3s,background .3s}
.rung.on{background:var(--glass-strong);box-shadow:inset 0 0 0 1.5px var(--ink)}
.rung .mono{width:14px}
.camp{text-align:left;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}.camp:hover{transform:translateY(-3px)}
.li.changed{background:linear-gradient(90deg,var(--warn-bg),transparent 70%);border-radius:10px;padding-left:8px;padding-right:8px}
.li.flip{animation:flipin .5s var(--ease)}@keyframes flipin{0%{transform:rotateX(70deg);opacity:.3}100%{transform:none;opacity:1}}
.gerr{color:var(--l-coral);font-size:12.5px}
.scan{width:44px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--soft) 0%,var(--ink) 50%,var(--soft) 100%);background-size:220% 100%;animation:scan 1.1s linear infinite;flex:none}
@keyframes scan{from{background-position:120% 0}to{background-position:-120% 0}}
.drop-z{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px;border:1.5px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center;color:var(--body);transition:background .2s,border-color .2s}
.drop-z:hover,.drop-z.over{background:var(--soft);border-color:var(--mute)}
.bmenu{position:fixed;z-index:80;padding:6px;display:flex;flex-direction:column;gap:2px;border-radius:14px}
.bmenu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:8px;text-align:left;font-size:13px;line-height:1.3}
.bmenu button:hover{background:var(--soft)}.bmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.nbflow{animation:rise .35s var(--ease) both}
button.brandsw{width:100%;background:transparent;text-align:left;transition:background .2s}button.brandsw:hover{background:var(--soft)}
.col .kc{background:var(--glass-strong)}
.step:disabled{opacity:.4}
select.txt{appearance:auto}
/* Colour rule B (settled 1 Oct): each section wears its earner-app tile. Status colours keep their own meaning. */

function sourcesText(){const n=nb();let s='';if(n.paste.trim())s+=`[Pasted text]\n${n.paste.trim().slice(0,14000)}\n\n`;
 if(n.iv.who||n.iv.offer||n.iv.never)s+=`[Interview]\nWho the customers are: ${n.iv.who||'(not answered)'}\nWhat we want people to do: ${n.iv.offer||'(not answered)'}\nWhat the AI must never say: ${n.iv.never||'(not answered)'}\n\n`;
 n.files.forEach(f=>{if(f.text)s+=`[File: ${f.name}]\n${f.text.slice(0,8000)}\n\n`});return s}
function readPrompt(){const n=nb();return `You are OkPo's brand context reader. OkPo pays influencers in the Philippines to post for brands. An AI coach (for influencers) and "Ask AI" (for their followers) will only ever say what is on a checked Know card, so accuracy matters more than coverage.

Read the brand's sources below and draft Know cards.
Rules:
- Only state what the sources say. Never invent numbers, prices, dates, locations or promises.

function renderNavNB(){const n=nb();$('#nav').innerHTML=`<button type="button" data-nbback>${ic('arrow',14).replace('M5 12h14M13 6l6 6-6 6','M19 12H5M11 6l-6 6 6 6')}<span>Back to GCash</span></button><span class="label" style="padding:12px 12px 4px">Setting up</span>`+NB_STEPS.map((s,i)=>{const on=!n.published&&n.step===i,done=n.published||i<n.max||(i<n.step);return `<button type="button" data-nbstep="${i}" ${on?'aria-current="page"':''} ${i>n.max||(n.read==='run'&&i!==1)?'disabled':''}>${done&&!on?`<span style="color:var(--l-green)">${ic('check',15)}</span>`:tile(['quarter','quarter','diamond','half','petal'][i],on?15:14,on?null:'var(--mute)')}<span>${s}</span>${i===2&&n.cards.length?`<span class="badge cnt${reqLeft()?' warn':''}">${n.cards.filter(c=>c.st==='ok').length}/${n.cards.length}</span>`:''}</button>`}).join('')+(n.published?`<button type="button" aria-current="page">${tile('petal',15)}<span>Live</span></button>`:'')}
function goNB(){S.view='newbrand';render()}
function flashCard(id){const el=$(`[data-nbc="${id}"]`);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}

document.addEventListener('click',e=>{const t=e.target.closest('button,[data-nbbrand]');
 if(!e.target.closest('.bmenu,#brandBtn'))$('.bmenu')?.remove();
 if(!t)return;const d=t.dataset,n=nb();
 if(t.id==='brandBtn'){brandMenu();return}
 if(d.nbbrand!==undefined){$('.bmenu')?.remove();if(d.nbbrand==='gcash'){S.view='overview';render();return}if(d.nbbrand==='new'){if(S.nb&&S.nb.published)S.nb=NBFRESH();goNB();return}const br=S.brands[+d.nbbrand];if(br){S.nb=br.nb;goNB()}return}
 if('nbback' in d){S.view='overview';render();return}
 if('nbnew' in d){S.nb=NBFRESH();render();return}
 if('nbcamp' in d){const a=n.aim.angles;S.wiz={step:0,brand:n.name,name:n.name+' · first campaign',goal:1000,goalKind:'first orders',who:(n.iv&&n.iv.who)||'',post:40,act:12,pool:30000,cap:120,reviewer:'ai',ends:'2026-12-15',hook:a[0]?a[0].n+'. '+(a[0].d||''):'Join and earn.',from:'Hook from “'+(a[0]?a[0].n:'its first default')+'”; rewards, checks and cap from its setup defaults; guardrails locked: '+((n.aim.guards||[]).length)+'.'};S.view='campaigns';S.cview='new';render();toast(`${tile('quarter',16)}<span>Campaign setup for <b>${esc(n.name)}</b>, filled in from its Direction.</span>`);return}
 if('nbedit2' in d){n.published=false;n.step=2;render();return}
 if(d.nbstep!==undefined){const s=+d.nbstep;if(s>n.max+1||(s>=2&&!n.cards.length))return;if(s===4&&!n.aim.angles.length){toast('Add at least one default first.');return}if(s===3&&reqLeft()){toast('Check every Don’t say and Compliance card, and settle the conflicts first.');return}n.step=s;n.max=Math.max(n.max,s);if(n.published&&s<5)n.published=false;render();return}
 if('nbex' in d){Object.assign(n,{name:EX.name,cat:EX.cat,paste:EX.paste,iv:{...EX.iv},files:[],example:true});render({quiet:true});$$('#nbName,#nbPaste,[data-nbiv]').forEach((el,i)=>!RM&&el.animate([{boxShadow:'0 0 0 3px var(--yellow)'},{boxShadow:'0 0 0 0 transparent'}],{duration:700,delay:i*90}));paintBrandBtn();return}
 if('nbgo' in d||'nbreread' in d){startRead();return}
 if('nbstop' in d){readCtl?readCtl.abort():finishRead('Stopped. Keep what was drafted, or read again.');n.read='done';return}
 if(d.nbrmf!==undefined){n.files.splice(+d.nbrmf,1);render({quiet:true});return}
 if(d.nbok){const c=cardById(d.nbok);if(c){c.st='ok';render({quiet:true});flashCard(c.id);bump($('#nbOkN'))}return}
 if('nbokall' in d){const list=n.cards.filter(c=>c.st!=='ok'&&c.conf==='high');list.forEach(c=>c.st='ok');render({quiet:true});list.forEach((c,i)=>setTimeout(()=>flashCard(c.id),RM?0:i*60));toast(`${tile('diamond',16)}<span><b>${list.length} cards checked.</b> The guesses still need you.</span>`);return}
 if(d.nbedit){n.editing=d.nbedit;render({quiet:true});$(`[data-nbtxt="${d.nbedit}"]`)?.focus();return}
 if(d.nbsave){const c=cardById(d.nbsave),ta=$(`[data-nbtxt="${d.nbsave}"]`);if(c&&ta&&ta.value.trim()){c.t=ta.value.trim();c.st='ok';c.src=c.src.includes('edited')||c.src==='Added by you'?c.src:c.src+' · edited by you'}else if(c){n.cards=n.cards.filter(k=>k!==c)}n.editing=null;render({quiet:true});flashCard(d.nbsave);return}
 if(d.nbdrop){const el=$(`[data-nbc="${d.nbdrop}"]`);const go=()=>{n.cards=n.cards.filter(c=>c.id!==d.nbdrop);n.aim.angles.forEach(a=>a.uses=(a.uses||[]).filter(u=>u!==d.nbdrop));render({quiet:true})};if(el&&!RM)el.animate([{opacity:1},{opacity:0,transform:'scale(.9)'}],{duration:200}).finished.then(go);else go();return}
 if(d.nbadd){const c={id:newId(),g:d.nbadd,t:'',src:'Added by you',conf:'high',st:'need'};n.cards.push(c);n.editing=c.id;render({quiet:true});$(`[data-nbtxt="${c.id}"]`)?.focus();return}
 if(d.nbpick){const [id,j]=d.nbpick.split(':');const c=n.conflicts.find(x=>x.id===id);if(!c)return;const first=c.pick==null;c.pick=+j;const text=c.options[+j];const ex=n.cards.find(k=>k.from===id);if(ex){ex.t=text}else n.cards.push({id:newId(),g:c.g,t:text,src:'You settled: '+c.src,conf:'high',st:'ok',from:id});render({quiet:true});if(first)toast(`${tile('diamond',16)}<span>Settled. The other version is dropped.</span>`);return}
 if('nbsuggest' in d){suggestAngles();return}
 if(d.nbmv){const [i,dir]=d.nbmv.split(':').map(Number);const j=i+dir,A=n.aim.angles;if(j<0||j>=A.length)return;const [m]=A.splice(i,1);A.splice(j,0,m);render({quiet:true});return}
 if(d.nbrma!==undefined){n.aim.angles.splice(+d.nbrma,1);render({quiet:true});return}
 if(d.nbtryangle){checkAngle(d.nbtryangle);return}
 if(d.nbg){n.aim.guards=n.aim.guards||[];n.aim.guards.push(d.nbg);render({quiet:true});return}
 if(d.nbrmg!==undefined){n.aim.guards.splice(+d.nbrmg,1);render({quiet:true});return}
 if('nbclearv' in d){n.angleCheck=null;render({quiet:true});return}
 if(d.nbuse){const ac=n.angleCheck;if(ac&&ac.rewrite){n.aim.angles.push({n:ac.rewrite.slice(0,48),d:'Rewritten to fit Know',p:20,uses:ac.card?[]:[]});n.angleCheck=null;render({quiet:true});toast(`${tile('quarter',16)}<span>Added. It stays within Know.</span>`)}return}
 if(d.nbas){n.as=d.nbas;render({quiet:true});scrollChat();return}
 if(d.nbq){askNB(d.nbq);return}
 if('nbpublish' in d){publishNB();return}
});
document.addEventListener('submit',e=>{const f=e.target;
 if(f.dataset.form==='nbguard'){e.preventDefault();const i=$('#nbGuardIn');const v=i.value.trim();if(!v){i.focus();return}const n=nb();n.aim.guards=n.aim.guards||[];n.aim.guards.push(v);render({quiet:true});setTimeout(()=>$('#nbGuardIn')?.focus({preventScroll:true}),0);return}
 if(f.dataset.form==='nbangle'){e.preventDefault();const i=$('#nbAngleIn');const v=i.value.trim();if(!v){i.focus();return}checkAngle(v);return}
 if(f.dataset.form==='nbask'){e.preventDefault();const i=$('#nbAskIn');const v=i.value.trim();if(!v){i.focus();return}askNB(v);setTimeout(()=>$('#nbAskIn')?.focus({preventScroll:true}),0);return}
 if(f.dataset.nbgap){e.preventDefault();const n=nb();const g=n.gaps.find(x=>x.id===f.dataset.nbgap);const v=f.querySelector('input').value.trim();if(!g||!v){f.querySelector('input').focus();return}
  const card={id:newId(),g:'Campaign facts',t:v,src:'Your answer to: '+g.q,conf:'high',st:'ok'};n.cards.push(card);n.gaps=n.gaps.filter(x=>x!==g);
  if(RM){render({quiet:true});return}f.animate([{opacity:1},{opacity:0,transform:'translateX(24px)'}],{duration:240,easing:'ease-in'}).finished.then(()=>{render({quiet:true});flashCard(card.id)});toast(`${tile('petal',16)}<span>Added to Know as a checked card.</span>`)}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('.bmenu')?.remove()});

if(S.nb&&S.nb.read==='run'){S.nb.read=S.nb.cards.length?'done':'no';if(!S.nb.cards.length){S.nb.step=0}}

$('#resetBtn').onclick=()=>{S=FRESH();closeOv();lastView=null;render();toast('Demo reset.')};
/* arriving from brand setup: setup.html links here with #new-campaign */
if(location.hash==='#new-campaign'){S.view='campaigns';S.cview='new';history.replaceState(null,'',location.pathname)}
render();
})();
</script>
