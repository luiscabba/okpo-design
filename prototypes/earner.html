<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>OkPo Earner and Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a thin control strip, then two phones side by side (Ana's earner app, a follower's view of her OkPo page) sharing one state. Colour is reserved for reward takeovers; the phones sit on calm tone-on-tone tiles. */
:root{
  --ground:#f6f1e4; --tone:#ebe2cc; --ink:#121212; --body:#4a4640; --mute:#6a655c; --line:rgba(18,18,18,.12);
  --glass-a:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.44); --glass-edge:rgba(255,255,255,.95); --glass-shadow:0 16px 36px rgba(18,18,18,.12);
  --glass-strong:rgba(255,255,255,.8); --soft:rgba(18,18,18,.06); --scrim:rgba(18,18,18,.28);
  --coral:#ff8787; --yellow:#ffd43b; --orange:#ffa94d; --green:#69db7c; --blue:#74c0fc; --purple:#b197fc;
  --l-coral:#c92a2a; --l-green:#237a36; --l-yellow:#9c6500; --l-purple:#6741d9;
  --btn:#121212; --on-btn:#f6f1e4;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --text:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --pop:cubic-bezier(.34,1.56,.64,1);
}
/* Light first (settled 1 Oct): dark only when the person picks it. */
@media (prefers-color-scheme: dark){:root[data-theme="system-dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12);
  --glass-a:rgba(40,40,40,.7); --glass-b:rgba(18,18,18,.6); --glass-edge:rgba(255,255,255,.22); --glass-shadow:0 16px 36px rgba(0,0,0,.5);
  --glass-strong:rgba(34,34,34,.86); --soft:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.5);
  --l-coral:#ff8787; --l-green:#69db7c; --l-yellow:#ffd43b; --l-purple:#b197fc; --btn:#ececec; --on-btn:#121212; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f0f0f; --tone:#1c1b19; --ink:#ececec; --body:#b9bcc0; --mute:#8f949a; --line:rgba(255,255,255,.12);
  --glass-a:rgba(40,40,40,.7); --glass-b:rgba(18,18,18,.6); --glass-edge:rgba(255,255,255,.22); --glass-shadow:0 16px 36px rgba(0,0,0,.5);
  --glass-strong:rgba(34,34,34,.86); --soft:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.5);
  --l-coral:#ff8787; --l-green:#69db7c; --l-yellow:#ffd43b; --l-purple:#b197fc; --btn:#ececec; --on-btn:#121212; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 14px/1.45 var(--text);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:12px 32px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--l-blue);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.label{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.small{font-size:12.5px;color:var(--mute)} .sub{color:var(--body)}
.row{display:flex;align-items:center;gap:10px} .grow{flex:1;min-width:0} .spacer{flex:1}
.wm{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1;display:inline-flex}
.wm span:nth-child(1){color:var(--coral)}.wm span:nth-child(2){color:var(--yellow)}.wm span:nth-child(3){color:var(--green)}.wm span:nth-child(4){color:var(--blue)}
.glass{background:linear-gradient(160deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),var(--glass-shadow);border-radius:20px}
.glass.strong{background:var(--glass-strong)}
.press{transition:transform .12s var(--ease)} .press:active{transform:scale(.97)}

/* control strip */
.strip{max-width:980px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 10px 8px 16px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:13px;color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:500}
.ghost:hover{background:var(--soft)}
.who{display:none}

/* stage */
.stage{display:flex;justify-content:center;gap:48px;align-items:flex-start;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:0}
.cap{font-size:12.5px;color:var(--mute);text-align:center;max-width:390px}
.phone{position:relative;width:390px;max-width:100%;height:800px;border-radius:44px;overflow:hidden;background:var(--ground);border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.16);isolation:isolate}
.phone.flash{animation:flash 1s var(--ease)}
@keyframes flash{30%{box-shadow:0 0 0 6px var(--yellow),0 30px 60px rgba(0,0,0,.16)}}
.pbg{position:absolute;inset:0;pointer-events:none;z-index:0}
.pbg svg{position:absolute;display:block}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 18px 110px;display:flex;flex-direction:column;gap:14px;z-index:1;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.02}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--btn);color:var(--on-btn)}
.btn.y{background:var(--btn);color:var(--on-btn)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{border:0;background:transparent;padding:4px 0;font-weight:600;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;position:relative;flex:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--body);flex:none}
.badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:99px;background:var(--coral);color:#121212;font:700 10px/16px var(--mono);text-align:center;padding:0 4px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.mission{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);border-radius:0}
.mission:first-child{border-top:0}
.mission .mt{display:block;font-weight:600}
.mission.done .mt{opacity:.55;text-decoration:line-through}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;white-space:nowrap}
.chip.go{background:var(--btn);color:var(--on-btn);font:600 13px/1 var(--text);letter-spacing:0;padding:7px 13px}
.chip.ok{background:rgba(105,219,124,.24);color:var(--l-green)}
.chip.fix{background:rgba(255,135,135,.22);color:var(--l-coral)}
.chip.wait{background:var(--soft);color:var(--body)}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--mute);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{display:flex;gap:4px;flex:none}.progress i{flex:1;height:6px;border-radius:9px;background:var(--line);transition:background .4s}.progress i.on{background:var(--yellow)}
.week{display:flex;gap:4px}
.week span{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;background:var(--soft)}
.bar i{display:block;height:100%;transition:flex-grow .6s var(--ease)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);font-size:13.5px}
.kv span{padding:8px 0;border-top:1px solid var(--line)} .kv span:nth-child(-n+2){border-top:0}
.kv span:nth-child(odd){color:var(--mute);font-family:var(--mono);font-size:12px}
.copyrow{display:flex;gap:8px}
.copyrow button{flex:1;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:13px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px;background:var(--glass-strong)}
.field input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%}
.field.bad{border-color:var(--l-coral)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--soft)}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.5;animation:rise .3s var(--ease)}
.bub.me{align-self:flex-end;background:var(--soft)}
.bub.ai{display:flex;gap:10px;padding:0;max-width:100%}
.used{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.used span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:12px;color:var(--body)}
.dots{display:inline-flex;gap:4px;padding:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;background:var(--glass-strong)}
.composer{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;border-radius:16px}
.composer input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:36px}
.tabbar{position:absolute;left:12px;right:12px;bottom:12px;height:64px;display:flex;align-items:center;padding:0 6px;border-radius:26px;z-index:20;transition:transform .35s var(--ease)}
.tabbar.away{transform:translateY(100px)}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);padding:6px 0}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabbar .ti{display:grid;place-items:center;width:24px;height:24px}
.tabbar .ti.land{animation:land .6s var(--pop)}
@keyframes land{40%{transform:scale(1.5)}}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;padding:12px 18px 22px;display:flex;flex-direction:column;gap:12px;z-index:40}
.grab{align-self:center;width:40px;height:5px;border-radius:9px;background:var(--line)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:transparent;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:2px;align-items:center}
.opts button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.panel{position:absolute;left:10px;right:10px;top:10px;z-index:40;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-height:70%;overflow:auto}
.toast{position:absolute;left:14px;right:14px;top:14px;z-index:45;padding:12px 14px;display:flex;align-items:center;gap:10px;animation:drop .35s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:44px;height:54px;text-align:center;font:600 22px var(--mono);border:1px solid var(--line);border-radius:12px;background:var(--glass-strong)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs button{aspect-ratio:3/4;border-radius:12px;border:0;background:var(--soft);display:flex;align-items:flex-end;padding:8px;color:var(--body)}
.askbar{position:absolute;left:14px;right:14px;bottom:14px;height:58px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;border-radius:22px;border:0;text-align:left;color:var(--body);z-index:20}
.go-y{width:40px;height:40px;border-radius:14px;background:var(--btn);display:grid;place-items:center;margin-left:auto;color:var(--on-btn)}
.over{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:var(--scrim)}
.over .glass{padding:20px;display:flex;flex-direction:column;gap:12px;width:100%;animation:rise .3s var(--ease)}


/* follower sign-up banner: a smaller reward, still in the yellow-half language */
.nb{position:absolute;left:12px;right:12px;top:12px;z-index:55;border-radius:22px;overflow:hidden;cursor:pointer;color:#121212;box-shadow:0 14px 34px rgba(0,0,0,.18);background:#fff9db;border:1px solid rgba(255,255,255,.9)}
.nb .sweep{position:absolute;inset:0;background:#ffd43b}
.nb .in{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px}
.nb .sh{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:14px;background:#fff9db}
.nb .sh svg{overflow:visible}
.nb b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .cnt{font:700 15px/1 var(--mono);background:#121212;color:#ffd43b;border-radius:99px;padding:6px 11px;white-space:nowrap}
:root[data-theme="dark"] .nb{background:var(--glass-strong);color:#ececec;border-color:rgba(255,255,255,.18);box-shadow:0 14px 34px rgba(0,0,0,.5)}
:root[data-theme="dark"] .nb .sweep{background:#3a3110}
:root[data-theme="dark"] .nb .sh{background:#1d1a0c}
.always .al{display:flex;align-items:center;gap:9px;font-size:14px}.always .al i{width:7px;height:7px;border-radius:50%;flex:none}
.rk{display:flex;align-items:center;gap:10px;margin-top:4px}
ul.rl{margin:0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:2px}
ul.rl li{display:block}
ul.rl details summary{list-style:none;cursor:pointer;font-size:14px;padding:4px 0 4px 12px;border-left:2px solid var(--line)}
ul.rl details summary::-webkit-details-marker{display:none}
ul.rl details[open] summary{border-left-color:var(--ink)}
ul.rl details .small{display:block;padding:0 0 6px 14px;font-family:var(--mono);font-size:11px}

/* campaigns */
.ccard{gap:12px;text-align:left}
.ccard.dim{opacity:.72}
.cc-amt{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.cc-amt b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em}
.cc-amt span{font-size:13px;color:var(--mute)}
.segbar{display:flex;gap:4px}
.segbar i{height:10px;border-radius:6px;background:rgba(105,219,124,.28);display:block}
.segbar i.paid{background:var(--green)}
.segbar i.chk{background:repeating-linear-gradient(135deg,rgba(105,219,124,.55) 0 5px,rgba(105,219,124,.25) 5px 10px)}
.cc-ms{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute)}
.cc-ms .on{color:var(--ink);font-weight:600}
.cc-go{width:36px;height:36px;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;flex:none}
.minw{flex-direction:row;align-items:center;gap:12px;text-align:left}
.cinv{gap:10px;border:1.5px dashed rgba(156,101,0,.45)!important;text-align:left}
.ctag{display:inline-flex;align-items:center;gap:5px;font:600 9.5px/1 var(--mono);letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--soft);color:var(--body);text-transform:uppercase;margin-top:5px;align-self:flex-start}
.crow{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.crow::-webkit-scrollbar{display:none}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--glass-strong)}
.cchip.add{background:transparent;position:relative}
.cchip .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
.deal{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:baseline;font-size:13.5px}.deal .old{color:var(--mute);text-decoration:line-through}
.camp{border:0;text-align:left;width:100%;cursor:pointer}
.camp.off{opacity:.62;cursor:default}
.seclabel{margin-top:4px}
.bm{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 15px var(--display);flex:none;background:var(--soft);color:var(--ink)}
.chip.lock{background:var(--soft);color:var(--mute);font:600 12px/1 var(--text);letter-spacing:0;padding:7px 11px}
.meter{display:flex;gap:4px}.meter i{flex:1;height:5px;border-radius:9px;background:var(--line)}.meter i.on{background:var(--ink)}

/* brand context v2: rule IDs, talking points, quality bands */
.rid{display:inline-block;margin-left:6px;font:600 10px/1 var(--mono);letter-spacing:.04em;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--body);vertical-align:1px;white-space:nowrap}
.rid.tp{background:rgba(255,212,59,.28);color:var(--l-yellow)}
.dd{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dd li{display:flex;gap:8px;align-items:baseline}.dd li span:first-child{flex:1}
.band{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font:600 11.5px/1 var(--text);white-space:nowrap}
.band i{width:7px;height:7px;border-radius:50%;background:currentColor}
.band.s{background:rgba(105,219,124,.24);color:var(--l-green)}
.band.g{background:var(--soft);color:var(--body)}
.band.n{background:rgba(255,212,59,.3);color:var(--l-yellow)}
details.pq,.pq-plain{border-top:1px solid var(--line)}details.pq:first-child,.pq-plain:first-child{border-top:0}.pq-plain .li{border-top:0}
details.pq summary{list-style:none;cursor:pointer}details.pq summary::-webkit-details-marker{display:none}
details.pq summary .li{border-top:0}
details.pq .tips{display:flex;flex-direction:column;gap:8px;padding:0 0 12px 32px}
details.pq .tips div{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--body)}
details.pq .tips div b{font:600 11px/1 var(--mono);color:var(--mute)}
/* takeover */
.take{position:absolute;inset:0;z-index:60;overflow:hidden;cursor:pointer;color:#121212}
.take .wash{position:absolute;inset:0}
.take svg{position:absolute;overflow:visible}
.take .tx{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 24px}
.take .lab{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}

@media (max-width:900px){
  .who{display:inline-flex}
  .stage{gap:0}
  .stage[data-show="earner"] #colAud,.stage[data-show="aud"] #colEarn{display:none}
}
@media (max-width:430px){.phone{height:760px;border-radius:36px}.strip{padding:8px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="strip glass strong" role="toolbar" aria-label="Prototype controls">

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function arc(cx,cy,r,a0,a1,n=40){const o=[];for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return o}
const POLY={
 diamond:[[[50,0],[100,50],[50,100],[0,50],[50,0]],[[50,28],[72,50],[50,72],[28,50],[50,28]]],
 frame:[[[0,0],[100,0],[100,100],[0,100],[0,0]],[[27,27],[73,27],[73,73],[27,73],[27,27]]],

function wob(pts,seed,amp){
  const r=rng(seed),ph=[r()*6.28,r()*6.28,r()*6.28,r()*6.28],f=[.18+r()*.14,.5+r()*.3,.18+r()*.14,.5+r()*.3],q=[];

}

/* ---------- screen swapping with transitions ---------- */
function swap(phone,html,kind){
  const old=phone.querySelector('.screen');
  const nu=document.createElement('div');nu.className='screen';nu.innerHTML=html;
  if(old&&kind==='none'){const st=old.scrollTop;old.replaceWith(nu);nu.scrollTop=st;return nu}
  const bg=phone.querySelector('.pbg');bg?bg.after(nu):phone.prepend(nu);
  if(!old||RM){old&&old.remove();return nu}
  const D=320,E='cubic-bezier(.2,.8,.2,1)';
  if(kind==='push'){nu.animate([{transform:'translateX(100%)'},{transform:'none'}],{duration:D,easing:E});old.style.zIndex=0;old.animate([{transform:'none',opacity:1},{transform:'translateX(-28%)',opacity:.4}],{duration:D,easing:E}).finished.then(()=>old.remove())}
  else if(kind==='pop'){nu.style.zIndex=0;nu.animate([{transform:'translateX(-28%)',opacity:.4},{transform:'none',opacity:1}],{duration:D,easing:E});old.style.zIndex=2;old.animate([{transform:'none'},{transform:'translateX(100%)'}],{duration:D,easing:E}).finished.then(()=>old.remove())}
  else{nu.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:260,easing:E});old.animate([{opacity:1},{opacity:0}],{duration:160}).finished.then(()=>old.remove())}
  return nu;
}
function countUps(root){

    const t0=performance.now(),D=900;
    (function f(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=peso(a+(b-a)*e);if(p<1)requestAnimationFrame(f)})(t0);
  });
}

    rerenderIfVisible(prev);
  });
}
function rerenderIfVisible(prev){const top=S.e.stack[S.e.stack.length-1];if(!S.e.onb&&(!top||top.v==='camp'))renderE('none',prev);else save()}
function doClaim(){
  const E=S.e,amt=E.ready-fee();E.sheet=null;overlayE();
  enqueue(async()=>{
    const now=new Date();const t=d=>d.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
    E.receipt={a:amt,t1:t(now),t2:t(new Date(now.getTime()+60000)),ref:'OKP-'+String(Math.floor(1000+Math.random()*8999))+'-'+String(Math.floor(1000+Math.random()*8999)),shown:false};
    E.ready=0;E.notifs.unshift({t:`${peso(amt)} is in your GCash`,b:'Payday. Your receipt is in Wallet.',time:'Now',k:'quarter'});E.unread++;save();
    await takeover(pE,SPEC.payday(amt),pE.querySelector('#readyCard'));
    E.tab='wallet';E.stack=[{v:'receipt'}];renderE('push');
  });
}
function followerSignedUp(cid){cid=cid||'heroes';const ip=cid==='ipon',amt=ip?10:12;
  const E=S.e;E.signups++;E.visits+=3;E.confirming.push({t:ip?'1 first deposit · Ipon Challenge':'1 sign-up · GCash Heroes',a:amt,by:'Mon, 6 Oct'});
  E.notifs.unshift({t:ip?'A follower started the Ipon Challenge':'A follower signed up',b:`From your page, credited to ${ip?'Ipon Challenge':'GCash Heroes'}${S.a.taps.length>1?' (the last link they tapped)':''}. +₱${amt} once GCash confirms.`,time:'Now',k:'pin'});E.unread++;save();
  if(E.onb){return}
  focusPhone('earner');
  enqueue(async()=>{const was=S.e.tab;await signupBanner(pE,E.signups,cid);if(S.e.tab!==was)renderE('tab');else rerenderIfVisible()});
}
function gcashConfirms(){
  const E=S.e;const amt=E.confirming.reduce((a,b)=>a+b.a,0);
  if(!amt){toastIn(pE,`${tile('quarter',16)}<span>Nothing is waiting on GCash right now. Sign up from the follower’s phone first.</span>`);return}
  if(E.onb){E.onb=null;renderE('fade')}
  focusPhone('earner');
  const prev={today:E.today,week:E.week,ready:E.ready};
  E.ready+=amt;E.week+=amt;E.confirming=[];E.notifs.unshift({t:`${peso(amt)} confirmed`,b:'GCash confirmed your sign-ups. It’s ready to claim.',time:'Now',k:'quarter'});E.unread++;save();
  enqueue(async()=>{await takeover(pE,SPEC.money(amt,prev.week,E.week,'Sign-ups confirmed'),null);rerenderIfVisible(prev)});
}

/* ================= AUDIENCE ================= */

  <div class="card glass strong"><span class="label">You came from Ana’s ${C.src}</span><span class="row">${tile(C.k,16)}<b style="font-size:16px">${C.t}</b></span><span class="sub">${C.d}</span>

  ${otherOn?`<button class="card glass press" type="button" data-switchvia="${other}" style="flex-direction:row;align-items:center;gap:10px;text-align:left">${tile(O.k,16)}<span class="grow"><b style="display:block">${O.t}</b><span class="small">Also on Ana’s page</span></span>${ic('chev',16)}</button>`:''}
  <button class="card glass press" type="button" data-becomeearner style="flex-direction:row;align-items:center;gap:10px;text-align:left">${tile('quarter',18)}<span class="grow"><b style="display:block">Post like Ana and get paid</b><span class="small">Join OkPo with your mobile number</span></span>${ic('chev',16)}</button>
  <b>Posts</b><div class="thumbs">${['Heroes sign-up in 14s','₱500 grocery run','Budget ulam','Paano mag-GCash','Baon hacks','Week of meals'].map(t=>`<button type="button" class="press" data-noopa="${t}">${ic('play',12)}<span style="font-size:11px;text-align:left;margin-left:4px">${t}</span></button>`).join('')}</div>`,kind);
  pA.querySelectorAll('.askbar,.sheet,.scrim,.over').forEach(n=>n.remove());
  if(!A.sheet)pA.insertAdjacentHTML('beforeend',`<button class="askbar glass strong press" type="button" data-aopen>${tile('speech',20)}<span>Ask Ana’s AI about ${A.via==='ipon'?'the Ipon Challenge':'GCash Heroes'}</span><span class="go-y">${ic('send',16)}</span></button>`);
  else{
    pA.insertAdjacentHTML('beforeend',`<div class="scrim" data-aclose></div><div class="sheet glass strong" role="dialog" aria-label="Ana’s AI" style="height:600px"><span class="grab"></span>
     <div class="row">${tile('speech',18)}<b class="grow">Ana’s AI</b><span class="small">Answers from GCash’s Playbook</span><button class="iconbtn" type="button" data-aclose aria-label="Close" style="width:32px;height:32px;background:var(--soft)">${ic('x',14)}</button></div>
     <div class="chat" id="audChat" style="flex:1;overflow:auto">${chatHtml(A.chat,`Ask about ${A.via==='ipon'?'the Ipon Challenge':'GCash Heroes'}. Answers come from GCash’s Playbook. It only says what GCash has confirmed.`)}</div>
     <div class="pills">${(A.via==='ipon'?['Magkano ang kailangan?','May ₱50 welcome credit ba?','Paano kung wala pa akong GCash?']:['May bayad ba mag-sign up?','May ₱50 welcome credit ba?','Paano kung wala pa akong GCash?']).map(q=>`<button class="pill press" type="button" data-ask="aud" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
     <button class="btn y wide press" type="button" data-signup ${A.signed?'disabled':''}>${A.signed?'You’re signed up':A.via==='ipon'?'Start saving on GCash':'Sign up on GCash'}</button>
     <form class="composer glass" data-form="aud"><label for="audIn" style="position:absolute;left:-9999px">Ask a question</label><input id="audIn" placeholder="Magtanong…" autocomplete="off"><button class="btn press" type="submit" style="padding:8px 12px">Ask</button></form></div>`);
    const sh=pA.querySelector('.sheet');if(kind==='sheet'&&!RM){sh.animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)'});pA.querySelector('.scrim').animate([{opacity:0},{opacity:1}],{duration:240})}
    const ch=$('#audChat',pA);ch.scrollTop=ch.scrollHeight;

/* ---------- chat ---------- */
function chatHtml(arr,empty){if(!arr.length)return `<span class="small">${empty}</span>`;return arr.map(m=>m.me?`<div class="bub me">${esc(m.t)}</div>`:m.typing?`<div class="bub ai">${tile('speech',22)}<span class="dots" aria-label="Typing"><i></i><i></i><i></i></span></div>`:`<div class="bub ai">${tile('speech',22)}<div><span>${m.t}</span>${m.used?`<div class="used">${m.used.map(u=>`<span>${tile(u[1],9)}${u[0]}</span>`).join('')}</div>`:''}</div></div>`).join('')}
function answer(q,aud){q=q.toLowerCase();const inIpon=aud&&S.a.via==='ipon';
 if(/welcome|credit|promo/.test(q))return inIpon?{t:'Wala pong welcome credit sa Ipon Challenge. Ang kailangan lang ay first deposit na ₱50 o higit pa sa GSave.',used:[['Ipon Challenge','pin']]}:{t:'Opo! New verified users get a ₱50 welcome credit, until 31 Oct.',used:[['Facts','half'],['Rules: say the end date','diamond']]};
 if(inIpon&&/magkano|kailangan|minimum|deposit/.test(q))return{t:'₱50 lang po ang first deposit sa GSave. Pwede mo nang dagdagan kahit kailan.',used:[['Ipon Challenge','pin']]};
 if(/sure|guarantee|approval/.test(q))return{t:'Hindi po natin puwedeng sabihin yan. Puwede mong sabihin: “Libre mag-join, at mabilis ang sign-up.”',used:[['Rules: no approval promises','diamond'],['Voice','petal']]};
 if(/magkano|how much|bayad|per sign/.test(q))return aud?{t:'Libre po ang pag-join. Walang bayad.',used:[['Facts','half']]}:{t:'May bayad ka sa bawat passed post, at dagdag sa bawat sign-up na na-activate mula sa page mo. Makikita mo sa Wallet.',used:[['GCash Heroes','pin']]};
 if(/tiktok|bio|link|facebook/.test(q))return{t:'Opo! Gamitin mo yung link na may code mo. I-tag ang #GCashHeroes at i-on ang Paid partnership.',used:[['Rules: say it’s paid, tag it','diamond'],['GCash Heroes','pin']]};
 if(/gcash|wala|app|paano|how/.test(q))return{t:'I-download ang GCash app, i-verify ang number mo, tapos sundan ang link. Mga 5 minuto lang po.',used:[['GCash Heroes','pin']]};
 if(/makukuha|get/.test(q))return{t:'Makakagamit ka ng GCash para magbayad, mag-ipon at magpadala. Libre ang sign-up.',used:[['GCash Heroes','pin']]};
 return{t:'Magandang tanong po. Ipapasa ko ito sa GCash team para masagot nang tama.',used:[['Voice','petal']]}}
function ask(which,q){
  const arr=which==='coach'?S.e.chat:S.a.chat;arr.push({me:1,t:q});const typing={typing:1};arr.push(typing);
  which==='coach'?renderE('none'):renderA('none');
  setTimeout(()=>{const i=arr.indexOf(typing);const a=answer(q,which==='aud');arr.splice(i,1,{t:a.t,used:a.used});
    if(which==='coach'){if(S.e.tab==='coach'&&!S.e.stack.length&&!S.e.onb)renderE('none');else save()}else renderA('none')},RM?200:1100);
}

/* ---------- phone focus on narrow screens ---------- */
function focusPhone(w){const st=$('#stage');if(matchMedia('(max-width:900px)').matches){st.dataset.show=w;$('#showE').setAttribute('aria-pressed',String(w==='earner'));$('#showA').setAttribute('aria-pressed',String(w==='aud'))}}
$('#showE').onclick=()=>focusPhone('earner');$('#showA').onclick=()=>focusPhone('aud');

/* ---------- events ---------- */
function copy(v,phone){const ok=()=>toastIn(phone,`${ic('check',16)}<span>Copied: ${esc(v)}</span>`);try{navigator.clipboard.writeText(v).then(ok,ok)}catch(e){ok()}}
pE.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-closeov]');if(!t||t.closest('.take'))return;const d=t.dataset;const E=S.e;
  if('closeov' in d){E.notifsOpen=false;E.sheet=null;overlayE();return}
  if(d.etab){if(E.onb)return;const same=E.tab===d.etab&&!E.stack.length;E.tab=d.etab;E.stack=[];if(!same)renderE('tab');return}
  if('notifs' in d){E.notifsOpen=true;E.unread=0;renderE('none');overlayE();return}
  if(d.mission){const m=E.missions.find(x=>x.id===+d.mission);if(m&&m.state==='open'&&capLeft()===0){toastIn(pE,`${tile('pin',16,'var(--mute)')}<span>That’s ${E.cap} for today. This one comes back tomorrow.</span>`);return}if(m&&(m.state==='open'||m.state==='fix')){E.stack=E.stack.filter(x=>x.v==='camp').concat([{v:'mission',id:m.id}]);renderE('push')}return}
  if(d.campgo){E.stack=[{v:'camp',id:d.campgo}];renderE('push');return}
  if('camps' in d){E.stack=[{v:'camps'}];renderE('push');return}
  if(d.invite){E.stack.push({v:'invite',id:d.invite});renderE('push');return}
  if(d.notego){E.notifsOpen=false;overlayE();E.tab='today';E.stack=[{v:'camps'},{v:'invite',id:'ipon'}];renderE('push');return}
  if(d.accept){const c=camp(d.accept);c.status='joined';c.deal=`${peso(c.rate)} per passed post · ${peso(c.dep)} per first deposit`;c.left=`${c.weeks} weeks`;c.stats='Starts today';
    E.missions.splice(1,0,{id:4,camp:'ipon',t:'Story: your first ₱50 deposit',type:'Story',r:c.rate,state:'open',tries:0,tp:'Save for one goal'});
    E.notifs=E.notifs.filter(n=>!n.go);E.notifs.unshift({t:'You joined GCash Ipon Challenge',b:`${peso(c.rate)} per passed post. Its first mission is in Today.`,time:'Now',k:'pin'});
    E.stack=[];E.tab='today';renderE('pop');toastIn(pE,`${tile('pin',16)}<span><b>Joined.</b> Ipon is in Your campaigns. Still ${E.cap} a day in total.</span>`);return}
  if(d.joincamp){const c=camp(d.joincamp);c.status='trial';renderE('none');toastIn(pE,`${tile('pin',16)}<span><b>You’re on a 3-post trial</b> with ${esc(c.brand)}. Missions start tomorrow.</span>`);return}
  if('back' in d){E.stack.pop();renderE('pop');return}
  if('paste' in d){const i=$('#plink',pE);i.value='tiktok.com/@ana.posts/video/'+Math.floor(7e9+Math.random()*1e9);$('#plinkf',pE).classList.remove('bad');return}
  if(d.copy){copy(d.copy,pE);return}
  if(d.noop){toastIn(pE,`<span>${esc(d.noop)} opens the composer in the real app.</span>`);return}
  if(d.ask==='coach'){ask('coach',d.q);return}
  if('claim' in d){E.sheet={opt:'now'};overlayE();return}
  if(d.opt){E.sheet.opt=d.opt;overlayE();return}
  if('doclaim' in d){if(E.sheet.opt==='friday'){E.sheet=null;overlayE();toastIn(pE,`${tile('quarter',16)}<span>Scheduled. ${peso(E.ready)} goes to your GCash on Friday, free.</span>`);return}doClaim();return}
  if('seefollower' in d){focusPhone('aud');pA.classList.remove('flash');void pA.offsetWidth;pA.classList.add('flash');return}
  if(d.onb){E.onb=d.onb;renderE(t.getAttribute('aria-label')==='Back'?'pop':'push');return}
  if('fillnum' in d){$('#jnum',pE).value='917 123 4567';return}
  if('fillotp' in d){const ins=[...pE.querySelectorAll('.otp input')];'123456'.split('').forEach((c,i)=>ins[i].value=c);checkOtp(ins);return}
  if('onbdone' in d){const v=E.via;E.onb=null;E.via=null;E.tab='today';renderE('fade');if(v)toastIn(pE,'<span>Demo: back on Ana’s phone.</span>');return}
});
pE.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==='submit'){const v=$('#plink',pE).value.trim();if(!v){$('#plinkf',pE).classList.add('bad');$('#plink',pE).placeholder='Paste the link to your post first';$('#plink',pE).focus();return}submitMission(+f.dataset.mid,v);return}
  if(k==='coach'){const i=$('#coachIn',pE);const q=i.value.trim();if(!q)return;ask('coach',q);setTimeout(()=>{const n=$('#coachIn',pE);n&&n.focus({preventScroll:true})},0);return}
  if(k==='num'){const v=$('#jnum',pE).value.replace(/\D/g,'');if(v.length!==10){$('#jnumf',pE).classList.add('bad');$('#jnum',pE).focus();toastIn(pE,'<span>Enter a 10-digit mobile number, like 917 123 4567.</span>');return}S.e.num=v.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3');S.e.onb='code';renderE('push');return}
});
pA.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-aclose]');if(!t)return;const d=t.dataset;const A=S.a;
  if('aopen' in d){A.sheet=true;renderA('sheet');return}
  if('aclose' in d){if(!RM){const sh=pA.querySelector('.sheet');sh.animate([{transform:'none'},{transform:'translateY(100%)'}],{duration:260,easing:'ease-in'}).finished.then(()=>{A.sheet=false;renderA('none')})}else{A.sheet=false;renderA('none')}return}
  if(d.ask==='aud'){ask('aud',d.q);return}
  if('signup' in d){A.over='handoff';renderA('none');return}
  if('signupgo' in d){A.signed=true;A.credit=A.via;A.creditName=A.via==='ipon'?'GCash Ipon Challenge':'GCash Heroes';A.over='done';A.sheet=false;renderA('none');setTimeout(()=>followerSignedUp(A.via),500);return}
  if(d.switchvia){A.via=d.switchvia;if(A.taps[A.taps.length-1]!==A.via)A.taps.push(A.via);paintVia();renderA('fade');return}
  if('overclose' in d){A.over=null;renderA('none');return}
  if('becomeearner' in d){startVia();return}
  if(d.noopa){toastIn(pA,`${ic('play',14)}<span>Opens “${esc(d.noopa)}” on TikTok.</span>`);return}
});
pA.addEventListener('submit',e=>{e.preventDefault();const i=$('#audIn',pA);const q=i.value.trim();if(!q)return;ask('aud',q);setTimeout(()=>{const n=$('#audIn',pA);n&&n.focus({preventScroll:true})},0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.e.sheet||S.e.notifsOpen){S.e.sheet=null;S.e.notifsOpen=false;overlayE()}if(S.a.sheet){S.a.sheet=false;renderA('none')}}});

/* ---------- controls ---------- */
function setBg(b){S.bg=b;$('#bgTone').setAttribute('aria-pressed',String(b==='tone'));$('#bgColour').setAttribute('aria-pressed',String(b==='colour'));[pE,pA].forEach(p=>{const o=p.querySelector('.pbg');const t=document.createElement('div');t.innerHTML=backdrop();o?o.replaceWith(t.firstElementChild):p.prepend(t.firstElementChild)});save()}
$('#bgTone').onclick=()=>setBg('tone');$('#bgColour').onclick=()=>setBg('colour');
$('#simConfirm').onclick=gcashConfirms;
function paintVia(){$('#viaH').setAttribute('aria-pressed',String(S.a.via==='heroes'));$('#viaI').setAttribute('aria-pressed',String(S.a.via==='ipon'));const t=S.a.taps.map(x=>x==='ipon'?'Ipon Story':'Heroes Reel').join(', then ');$('#capA').textContent=`A follower’s phone · tapped ${t} · credit goes to the last link tapped`}
function arrive(c){if(c==='ipon'&&camp('ipon').status!=='joined'){toastIn(pA,`${tile('pin',16)}<span>Ana hasn’t joined Ipon yet. Accept the invite on her phone first (+ Campaigns).</span>`);return}if(S.a.signed){toastIn(pA,'<span>This follower already signed up. One sign-up, one credit. Reset to try again.</span>');return}S.a.via=c;if(S.a.taps[S.a.taps.length-1]!==c)S.a.taps.push(c);S.a.chat=[];S.a.sheet=false;paintVia();focusPhone('aud');renderA('fade')}
$('#viaH').onclick=()=>arrive('heroes');$('#viaI').onclick=()=>arrive('ipon');
$('#simVia').onclick=()=>startVia();
function startVia(){focusPhone('earner');S.e.via='ana';S.e.num='';S.e.onb='welcome';S.e.stack=[];S.e.sheet=null;S.e.notifsOpen=false;overlayE();renderE('fade')}
$('#simOnb').onclick=()=>{focusPhone('earner');S.e.via=null;S.e.onb='welcome';S.e.stack=[];S.e.sheet=null;S.e.notifsOpen=false;overlayE();renderE('fade')};
$('#resetBtn').onclick=()=>{const bg=S.bg;S=FRESH();S.bg=bg;setTimeout(paintVia,0);pE.querySelectorAll('.take,.toast').forEach(n=>n.remove());overlayE();renderE('fade');renderA('fade')};
function curTheme(){const a=document.documentElement.getAttribute('data-theme');return a||'light'}
const paintTheme=()=>$('#themeBtn').textContent=curTheme()==='dark'?'Light':'Dark';
$('#themeBtn').onclick=()=>{document.documentElement.setAttribute('data-theme',curTheme()==='dark'?'light':'dark');paintTheme()};paintTheme();

setBg(S.bg||'tone');
paintVia();renderE('none');renderA('none');
if(location.hash==='#follower'||location.hash==='#audience'){focusPhone('aud');pA.classList.add('flash')}
})();
